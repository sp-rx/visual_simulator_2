/* Eye with far point `power` and `accommodation` sees clearly when the demand reaching it lies in [power - accommodation, power].
   Signed result: + = focus falls in front (myopic type), - = focus falls behind (accommodation / hyperopic type), 0 = clear. */
// Accommodation shortfall (the "AA" blur) starts late and grows gently:
const AA_DELAY = 0.5;     // D of shortfall the eye tolerates before any blur shows (depth of focus)
const AA_SLOPE = 0.7;     // how fast the blur grows after that (1 = as fast as a refractive error)
function rawSignedDefocus(power, accommodation, demand) {         // the true optical need (used for the "Presbyopia Rx" numbers)
  const high = power, low = power - accommodation;
  return demand > high ? demand - high : demand < low ? demand - low : 0;
}
function signedDefocus(power, accommodation, demand) {            // what is drawn: the shortfall is softened. With no accommodation (duochrome test) it is exact.
  const high = power, low = power - accommodation;
  if (demand > high) return demand - high;
  if (demand < low) return accommodation > 0 ? -Math.max(0, low - demand - AA_DELAY) * AA_SLOPE : demand - low;
  return 0;
}
const getResidualDefocus = (power, accommodation, demand) => Math.abs(rawSignedDefocus(power, accommodation, demand));

// Duochrome: red focuses further back than blue. Myopic defocus -> red side clearer; hyperopic -> blue side clearer.
// The red/blue split fades in gradually: 0 at balance, reaching the full 0.5 D split at 1.0 D of defocus
// (it used to jump straight to the full split at the first 0.25 D step).
const DUO_SPLIT = 1, DUO_SPLIT_RAMP = 1;
function duoDef(sd, side) {
  const m = Math.abs(sd);
  if (m === 0) return 0;
  const off = DUO_SPLIT * Math.min(1, m / DUO_SPLIT_RAMP);
  return side === (sd > 0 ? "red" : "blue") ? Math.max(0, m - off) : m + off;
}

/* ---------- BLUR (works on Safari / iPad, which ignores ctx.filter) ---------- */
const nativeBlur = (() => {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 9;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.filter = "blur(2px)";
    x.fillStyle = "#fff";
    x.fillRect(4, 4, 1, 1);
    return x.getImageData(2, 4, 1, 1).data[3] > 0;
  } catch (e) { return false; }
})();

const SMALL_BLUR = 2;                          // below this radius (px) the blur is a smooth fade between sharp and blur(2px)
const tmpCanvases = [];
function tmpCanvas(i, w, h) {
  let c = tmpCanvases[i];
  if (!c) c = tmpCanvases[i] = document.createElement("canvas");
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const x = c.getContext("2d");
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = "high";
  x.clearRect(0, 0, w, h);
  return c;
}

function blurInto(dst, src, r) {
  dst.clearRect(0, 0, W, H);
  if (r <= 0) { dst.drawImage(src, 0, 0); return; }

  if (nativeBlur) {
    if (r < SMALL_BLUR) {                       // the browser's blur treats small radii in coarse steps (0.9 and 1.3 px look the same):
      dst.drawImage(src, 0, 0);                 // so fade smoothly from sharp to blur(SMALL_BLUR) instead
      dst.globalAlpha = r / SMALL_BLUR;
      dst.filter = `blur(${SMALL_BLUR}px)`;
      dst.drawImage(src, 0, 0);
      dst.filter = "none"; dst.globalAlpha = 1;
      return;
    }
    dst.filter = `blur(${r}px)`;
    dst.drawImage(src, 0, 0);
    dst.filter = "none";
    return;
  }

  const k = Math.max(1.5, r * 1.4);
  const chain = [];
  let cur = src, f = 1;
  while (f < k) {
    f = Math.min(f * 2, k);
    const c = tmpCanvas(chain.length, Math.max(1, Math.round(W / f)), Math.max(1, Math.round(H / f)));
    c.getContext("2d").drawImage(cur, 0, 0, c.width, c.height);
    chain.push(c);
    cur = c;
  }
  for (let i = chain.length - 1; i >= 0; i--) {
    if (i === 0) { dst.drawImage(chain[0], 0, 0, W, H); }
    else {
      const t = chain[i - 1];
      const x = t.getContext("2d");
      x.clearRect(0, 0, t.width, t.height);
      x.drawImage(chain[i], 0, 0, t.width, t.height);
    }
  }
}

/* ---------- VISION EFFECTS (blur + cylinder ghosting) ---------- */
// Cylinder "double image" strength. Everything except the fan chart is HALF of the old values; the fan chart is DOUBLE its old values.
const CYL_SMEAR = 7;            // streak length per diopter (was 14)
const CYL_SEP = 8;              // distance between the two images per diopter (was 16)
const CYL_WEIGHT = 0.375;       // brightness of the second image per diopter (was 0.75)
const CYL_WEIGHT_MAX = 0.25;    // cap on the second image (was 0.5)
const FAN_CYL_SEP = 8;          // fan chart: distance between the two images per diopter (was 4)
const FAN_CYL_WEIGHT = 1.5;     // fan chart: brightness of the second image per diopter (was 0.75)
const FAN_CYL_WEIGHT_MAX = 0.5; // fan chart: cap (kept at 0.5 so the second image never outshines the first)
// How the cylinder effect grows with Cyl Rx (D)
// SPLIT (distance + strength of the second image): normal up to 1.00 D, after that every extra step adds only 25% of the usual amount.
// BLUR (streak along the axis, and the fan chart's meridian blur): normal up to 2.00 D, after that every extra step adds 25% MORE than usual.
const CYL_SPLIT_KNEE = 1.00, CYL_SPLIT_SLOPE = 0.25;
const CYL_BLUR_KNEE = 2.00, CYL_BLUR_SLOPE = 1.25;
const cylSplit = c => c <= CYL_SPLIT_KNEE ? c : CYL_SPLIT_KNEE + (c - CYL_SPLIT_KNEE) * CYL_SPLIT_SLOPE;
const cylBlur = c => c <= CYL_BLUR_KNEE ? c : CYL_BLUR_KNEE + (c - CYL_BLUR_KNEE) * CYL_BLUR_SLOPE;
let fanFx = false;   // true only while building the fan chart's own ghost layer (no smear, smaller separation)
function applyVisionEffects(target, blurAmount, cylinder, axis) {
  blurInto(blurCtx, sourceCanvas, blurAmount);

  const angle = (axis + 90) * Math.PI / 180;
  const smearLen = fanFx ? 0 : cylBlur(cylinder) * CYL_SMEAR;
  let layer = blurCanvas;
  if (smearLen > 0.5) {
    const n = Math.min(15, Math.max(3, Math.ceil(smearLen / 3) + 1)), cs = Math.cos(angle), sn = Math.sin(angle);
    smearCtx.clearRect(0, 0, W, H);
    for (let k = 0; k < n; k++) {
      smearCtx.globalAlpha = 1 / (k + 1);
      const o = (k - (n - 1) / 2) * smearLen / (n - 1);
      smearCtx.drawImage(blurCanvas, cs * o, sn * o);
    }
    smearCtx.globalAlpha = 1;
    layer = smearCanvas;
  }

  ghostCtx.clearRect(0, 0, W, H);

  const separation = cylSplit(cylinder) * (fanFx ? FAN_CYL_SEP : CYL_SEP);
  const secondWeight = fanFx ? Math.min(FAN_CYL_WEIGHT_MAX, cylSplit(cylinder) * FAN_CYL_WEIGHT) : Math.min(CYL_WEIGHT_MAX, cylSplit(cylinder) * CYL_WEIGHT);
  const ox = Math.cos(angle) * separation / 2;
  const oy = Math.sin(angle) * separation / 2;

  ghostCtx.globalAlpha = 1;
  ghostCtx.drawImage(layer, -ox, -oy);
  ghostCtx.globalAlpha = secondWeight;
  ghostCtx.drawImage(layer, ox, oy);
  ghostCtx.globalAlpha = 1;

  target.clearRect(0, 0, W, H);
  target.drawImage(ghostCanvas, 0, 0);
}

let lensOn = true;        // glasses on / off
let lensType = "far";     // "far" | "near" | "multi" | "office"
let enhFrac = 0;          // Multifocal Enhancement 0..1
let boundaryVisibility = { far: false, intermediate: false, near: false, distortion: false };   // guide lines start off
const clamp01 = x => Math.min(1, Math.max(0, x));
// Edge of the clear corridor (fraction of lens half-width) at height t: narrowest in the intermediate, narrower still toward near.
const ZONES = {
  multi:  { far: 0.5, mid: 0.60, near: 0.7, edge: t => 0.1 + 0.15 * clamp01((t - 0.5) / 0.5) },
  office: { far: 0.1, mid: 0.3, near: 0.7, edge: t => 0.25 + 0.15 * clamp01((t - 0.05) / 0.95) }
};
const sideEdge = t => { const th = ZONES[lensType].edge(t) ; return th + (0.98 - th) * enhFrac; };

function drawLensGuides() {
  const Z = ZONES[lensType];
  if (!Z) return;
  const { cx, cy, rx, ry } = lens, yAt = t => cy + ry * (2 * t - 1);
  const hline = (t, color) => { ctx.strokeStyle = color; ctx.beginPath(); ctx.moveTo(cx - rx, yAt(t)); ctx.lineTo(cx + rx, yAt(t)); ctx.stroke(); };
  ctx.save(); lensPath(ctx); ctx.clip(); ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
  if (boundaryVisibility.far) hline(Z.far, "#4B9B80");
  if (boundaryVisibility.intermediate) hline(Z.mid, "#E2B84B");
  if (boundaryVisibility.near) hline(Z.near, "#D77C55");
  if (boundaryVisibility.distortion) {
    ctx.setLineDash([7, 6]); ctx.strokeStyle = "#C0392B";
    [-1, 1].forEach(side => {
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) { const t = Z.far + (1 - Z.far) * i / 100, x = cx + side * rx * sideEdge(t), y = yAt(t); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    });
  }
  ctx.restore();
}
// The lens frame is always shown (it is the lens tabs, not the corrections, that choose the lens)
function drawLensFrame() {
  lensPath(ctx);
  ctx.strokeStyle = "#3A6656"; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.5; ctx.stroke();
}
const sstep = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

// Fan chart: blur grows progressively from the good meridian to the opposite one.
let FAN = { cx: FAN_CX, cy: FAN_CY, x0: FAN_CX - (FAN_R + 120), y0: FAN_CY - (FAN_R + 120), size: 2 * (FAN_R + 120) };
const fanPool = [];
function fanBackground(target, sphR, cylAmt, axis) {
  const { cx, cy, x0, y0, size } = FAN, cylR = cylBlur(cylAmt) * 5, alpha = (axis + 90) * Math.PI / 180, data = [];
  const nL = 5, STEP = 1;
  for (let i = 0; i < nL; i++) {
    const lv = fanPool[i] || (fanPool[i] = makeCanvas(true));
    applyVisionEffects(lv[1], Math.min(30, sphR + i * cylR / (nL - 1)), 0, axis);
    data.push(lv[1].getImageData(x0, y0, size, size).data);
  }
  const gp = fanPool[5] || (fanPool[5] = makeCanvas(true));
  fanFx = true; applyVisionEffects(gp[1], Math.min(30, sphR), cylAmt, axis); fanFx = false;
  const gd = gp[1].getImageData(x0, y0, size, size).data;
  target.clearRect(0, 0, W, H);
  target.drawImage(fanPool[0][0], 0, 0);
  const img = target.createImageData(size, size), out = img.data;
  for (let y = 0; y < size; y += STEP) {
    for (let x = 0; x < size; x += STEP) {
      const f = Math.abs(Math.sin(Math.atan2(y0 + y - cy, x0 + x - cx) - alpha));
      const L = Math.min(nL - 1.001, f * (nL - 1)), i0 = Math.floor(L), w = L - i0, o = (y * size + x) * 4;
      for (let yy = y; yy < y + STEP && yy < size; yy++) {
        for (let xx = x; xx < x + STEP && xx < size; xx++) {
          const q = (yy * size + xx) * 4;
          for (let c = 0; c < 3; c++) out[q + c] = (data[i0][o + c] * (1 - w) + data[i0 + 1][o + c] * w) * 0.4 + gd[o + c] * 0.6;
          out[q + 3] = 255;
        }
      }
    }
  }
  target.putImageData(img, x0, y0);
}

// Combined scene background: fan chart (neutral blur) | red half | blue half
const comboPool = [];
function bgCombo(target, rn, rl, rr, cylinder, axis) {
  if (cylinder > 0) fanBackground(target, rn, cylinder, axis);
  else applyVisionEffects(target, rn, 0, axis);
  const cl = x => Math.max(0, Math.min(W, Math.round(x)));
  const x1 = cl(DUO_X0 + panX), x2 = cl(DUO_XC + panX);
  [[x1, x2, rl, 0], [x2, W, rr, 1]].forEach(([a, b, rad, k]) => {
    if (b <= a) return;
    const pc = comboPool[k] || (comboPool[k] = makeCanvas());
    applyVisionEffects(pc[1], rad, cylinder, axis);
    target.drawImage(pc[0], a, 0, b - a, H, a, 0, b - a, H);
  });
}

// Blur with a different radius on the left (red) and right (blue) half of the picture
let halfPool = null;
function applyVisionHalves(target, rl, rr, cylinder, axis) {
  applyVisionEffects(target, rl, cylinder, axis);
  if (rl === rr) return;
  const sx = Math.max(0, Math.min(W, Math.round(W / 2 + panX)));
  if (sx >= W) return;
  halfPool = halfPool || makeCanvas();
  applyVisionEffects(halfPool[1], rr, cylinder, axis);
  target.drawImage(halfPool[0], sx, 0, W - sx, H, sx, 0, W - sx, H);
}

// Scenes with several focal distances: each region gets the blur of its own demand
function bgRegions(target, v, regs, radFn, cylinder, axis, zk) {
  target.clearRect(0, 0, W, H);
  const used = [];
  regs.forEach((rg, i) => {
    const rad = radFn(rg), key = rad.toFixed(2);
    let j = used.indexOf(key);
    if (j < 0) {
      j = used.length; used.push(key);
      const pc = v.regPool[j] || (v.regPool[j] = makeCanvas());
      applyVisionEffects(pc[1], rad, cylinder, axis);
    }
    target.save();
    if (i > 0) { target.beginPath(); target.rect(600 + (rg[0] - 600) * zk + panX, 400 + (rg[1] - 400) * zk + panY, rg[2] * zk, rg[3] * zk); target.clip(); }
    target.drawImage(v.regPool[j][0], 0, 0);
    target.restore();
  });
}

/* ---------- RENDER ---------- */
let fast = false, lensSmall = null;      // `fast` is swapped per simulator by useView()

function schedule(sim) {
  if (sim.renderPending) return;
  sim.renderPending = true;
  requestAnimationFrame(() => doRender(sim));
}
// FAST_ALWAYS = true: one steady quality, no sharpen-after-you-stop pass, so no wait. false = rough while dragging, sharp ~FAST_DELAY ms after you stop.
const FAST_ALWAYS = true, FAST_DELAY = 180;
const FAST_STEP = 1.25;            // resolution while dragging = 1 / FAST_STEP: 1 = 100% (sharpest, slowest), 1.25 = 80%, 1.5 = 67%, 2 = 50%
function render(sim) {
  if (!visible(sim)) return;
  sim.fast = true;
  if (!FAST_ALWAYS) {
    clearTimeout(sim.fastTimer);
    sim.fastTimer = setTimeout(() => { sim.fast = false; schedule(sim); }, FAST_DELAY);
  }
  schedule(sim);
}

function renderView(v) {
  const val = id => Number(el[id].value);
  enhFrac = val("enhance") / 200;
  const power = val("power");
  const aspheric = val("aspheric");
  const cylinder = val("cylinder");
  const axis = val("axis");
  const accommodation = val("accommodation");
  const nearAdd = getAdd(v);                                           // real add in D (contacts: No / Low / Med / High)
  const farLens = corrLens(defById.farCorrection);                     // the lenses actually worn, in D (signed)
  const cylLens = corrLens(defById.cylCorrection);
  const nearLens = corrLens(defById.nearCorrection);
  const farCorr = power !== 0 ? farLens / power : 1;                   // far lens as a fraction of the eye's Rx (1 when the eye has none)
  const axisCorr = val("axisCorrection");                              // axis of the correcting cylinder lens

  /* Original (uncorrected) vision */
  const demand = getSceneDemand();
  const regs = REGIONS[curScene] || null, zk = ZK[curScene] || 1;                          // scenes with several focal distances
  const isDuo = curScene === "duo";                                                        // fan chart (left) + duochrome (right)
  // [red side, blue side, neutral] defocus. Neutral is used for the fan chart and for every non-duochrome scene.
  const sideDef = sd => isDuo ? [duoDef(sd, "red"), duoDef(sd, "blue"), Math.abs(sd)] : [Math.abs(sd), Math.abs(sd), Math.abs(sd)];
  const zx0 = DUO_X0 + panX, zc = DUO_XC + panX;                                           // duochrome zone start / red-blue seam on screen
  const accom = curScene === "duo" ? 0 : accommodation;
  const regRad = rg => Math.min(30, Math.abs(signedDefocus(power, accom, rg[4])) * 5);
  const [bgL, bgR, bgN] = sideDef(signedDefocus(power, accom, demand));
  const bgKey = [curScene, regs ? regs.map(rg => regRad(rg).toFixed(2)).join(",") : "", bgL.toFixed(3), bgR.toFixed(3), bgN.toFixed(3), cylinder, axis, fast ? 1 : 0].join("|");
  if (v.bgKey === bgKey) { ctx.clearRect(0, 0, W, H); ctx.drawImage(v.bgCanvas, 0, 0); }
  else {
    if (regs) bgRegions(ctx, v, regs, regRad, cylinder, axis, zk);
    else if (isDuo) bgCombo(ctx, Math.min(30, bgN * 5), Math.min(30, bgL * 5), Math.min(30, bgR * 5), cylinder, axis);
    else applyVisionHalves(ctx, Math.min(30, bgL * 5), Math.min(30, bgR * 5), cylinder, axis);
    v.bgCtx.clearRect(0, 0, W, H); v.bgCtx.drawImage(canvas, 0, 0); v.bgKey = bgKey;
  }

  /* Through the lens */
  const isContact = lensType === "contacts";
  const addTotal = isContact ? nearAdd : nearLens;               // contacts: the chosen add is the lens add
  const intPart = addTotal / 2;
  const isMulti = !!ZONES[lensType];
  const lensAdd = lensType === "far" ? 0 : addTotal;
  const lensCylinder = cylinder - cylLens;

  // The eye sees the scene through lens power L = far correction + local ADD; accommodation only works when L is not enough
  // Contacts: the eye uses whichever zone (distance or add) is sharper for each distance, and everything carries a little depth-of-focus haze.
  // Duochrome: the add makes the eye read half the add "more plus", so red looks clearer until the lens is half the add more minus.
  // Contacts also carry a spherical shift (+0.25 / +0.50 / +0.75 D): it is added to the demand everywhere except the duo + fan scene.
  // The fan chart stays neutral (equal all around).
  const cInfo = isContact ? (CONTACT_ADDS.find(x => x[1] === addTotal) || [0, 0, 0, 0]) : [0, 0, 0, 0];
  const hazeD = cInfo[2], contactShift = isDuo ? 0 : cInfo[3];     // haze strength: drawn as a halo (below), not as extra blur
  const haloW = Math.min(HALO_MAX, hazeD * HALO_WEIGHT), haloR = hazeD ? HALO_RADIUS_BASE + hazeD * HALO_RADIUS_PER_D : 0;
const defsAt = (a, dm = demand) => {
  if (!isContact) return sideDef(signedDefocus(power, accom, dm + farLens + a));
  const base = dm + farLens + contactShift;   // spherical shift (0 on the duo + fan scene)
  const farSd = signedDefocus(power, accom, base), nearSd = signedDefocus(power, accom, base + addTotal);
  if (isDuo) {
    const sd = signedDefocus(power, accom, base + addTotal / 2);
    return [duoDef(sd, "red"), duoDef(sd, "blue"), Math.abs(sd)];   // <-- changed: was Math.abs(farSd)
  }
  const d = Math.min(Math.abs(farSd), Math.abs(nearSd));
  return [d, d, d];
};

  const addAt = t => {
    if (lensType === "far") return 0;
    if (lensType === "near") return addTotal;
    if (lensType === "contacts") return 0;                         // no add zone distortion (the add is handled in defsAt)
    const stops = lensType === "office"
      ? [[0, 0], [0.05, 0], [0.2, intPart], [0.6, intPart], [0.7, addTotal], [1, addTotal]]
      : [[0, 0], [0.5, 0], [0.65, intPart], [0.8, addTotal], [1, addTotal]];
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, a0] = stops[i - 1], [t1, a1] = stops[i];
        return a0 + (a1 - a0) * (t - t0) / (t1 - t0);
      }
    }
    return addTotal;
  };

  /* Title + details */
  const effectivePower = farLens;
  const effectiveCylinder = cylLens;
  const presbyopiaRx = Math.max(...(regs || [[0, 0, 0, 0, demand]]).map(rg => getResidualDefocus(0, accommodation, rg[4])));
  const rxText = v => (v > 0 ? "+" : "") + v.toFixed(2) + " D";
  if (!lensOn) {                                                  // glasses off: just the eye, no frame
    v.title = "Without Glasses";
    v.detail = "Eye Rx: " + rxText(power) + " | Cylinder: " + cylinder.toFixed(2) + " | Presbyopia Rx: " + rxText(presbyopiaRx);
    return;
  }

  const effects = [];
  if (isContact) effects.push("Contact Lens");
  if (effectivePower < 0) effects.push("Myopic Lens");
  else if (effectivePower > 0) effects.push("Hyperopic Lens");
  if (effectiveCylinder > 0) effects.push("Cylinder Lens");
  if (presbyopiaRx > 0) effects.push("Presbyopia");
  v.title = effects.length ? effects.join(" + ") : "No Rx";
  v.detail =
    "Far Lens Rx: " + rxText(effectivePower) + " | Eye Rx: " + rxText(power) +
    " | Near Lens Rx: " + rxText(lensAdd) + " | Presbyopia Rx: " + rxText(presbyopiaRx);

  // Vision stress: over-correcting the far lens (> 100%) forces extra accommodation.
  // (With a 0.00 D eye, any far lens power is an over-correction.)
  const overD = power === 0 ? Math.abs(farLens) : Math.max(0, farLens * Math.sign(power) - Math.abs(power));
  const stress = Math.round(overD / (0.5 * accommodation) * 100);
  const stressColor = stress <= 50 ? "#2E9B5F" : stress <= 75 ? "#E0A800" : "#C0392B";
  v.detail += '\n<span class="stress-dot" style="background:' + stressColor + '"></span>Vision Stress: ' + stress + "%";

  if (effectivePower === 0 && effectiveCylinder === 0 && lensAdd === 0) { drawLensFrame(); drawLensGuides(); return; }   // lens changes nothing

  /* Lens distortion parameters */
  const effectiveAspheric = aspheric * Math.min(farCorr, 1);
  const magFactor = isContact ? 1 + effectivePower / 100 * CONTACT_MAG : 1 + effectivePower / 100;
  const radialStrength = isContact ? 0 : effectivePower * 0.05 * (1 - effectiveAspheric / 100);      // contacts: no barrel / pincushion
  const ADD_STRENGTH = 1;
  const addRadK = isContact ? 0 : ADD_STRENGTH * 0.085 * (1 - aspheric / 100);
  const cylMag = isContact ? 1 + effectiveCylinder / 40 * CONTACT_MAG : 1 + effectiveCylinder / 40;
  const mAngle = (axisCorr + 90) * Math.PI / 180;
  const mCos = Math.cos(mAngle), mSin = Math.sin(mAngle);

  /* Lens region (+ padding for sampling) */
  const { cx, cy, rx, ry } = lens;
  const xStart = Math.max(0, Math.floor(cx - rx)), xEnd = Math.min(W, Math.ceil(cx + rx));
  const yStart = Math.max(0, Math.floor(cy - ry)), yEnd = Math.min(H, Math.ceil(cy + ry));
  const rw = xEnd - xStart, rh = yEnd - yStart;
  const gx = Math.max(0, xStart - 70), gy = Math.max(0, yStart - 70);
  const gw = Math.min(W, xEnd + 70) - gx, gh = Math.min(H, yEnd + 70) - gy;

  /* Blur levels */
  const SIDE_BLUR = 9;
  const isFan = isDuo;                                            // the fan chart lives in the combined scene
  // Residual cylinder = eye's cylinder (at its axis) minus the correcting cylinder (at its own axis), combined as vectors.
  // Same axis + full power -> 0. Wrong power -> leftover (over-correction flips 90 deg). Wrong axis -> leftover double image.
  const t1 = 2 * axis * Math.PI / 180, t2 = 2 * axisCorr * Math.PI / 180;
  const resX = cylinder * Math.cos(t1) - effectiveCylinder * Math.cos(t2), resY = cylinder * Math.sin(t1) - effectiveCylinder * Math.sin(t2);
  const cylAmt = Math.hypot(resX, resY), cylAxis = ((Math.atan2(resY, resX) * 90 / Math.PI) % 180 + 180) % 180;
  const perPixel = isMulti || isDuo || isFan || !!regs;           // blur varies across the lens
  let maxDef = 0;
  (regs || [[0, 0, 0, 0, demand]]).forEach(rg => {
    for (let k = 0; k <= (isMulti ? 20 : 0); k++) maxDef = Math.max(maxDef, ...defsAt(addAt(k / 20), rg[4]));
  });
  const rMax = Math.min(30, maxDef * 5 + (isMulti ? SIDE_BLUR : 0) + (isFan ? cylBlur(cylAmt) * 5 : 0));
  const nLev = perPixel ? 5 : 1;                     // fewer blur levels while dragging

  const lvKey = [curScene, nLev, rMax.toFixed(2), cylAmt.toFixed(2), cylAxis, isFan ? 1 : 0, isMulti ? 1 : 0, maxDef.toFixed(2), haloW.toFixed(3), fast ? 1 : 0].join("|");
  if (v.lvKey !== lvKey) {
    for (let i = 0; i < nLev; i++) {
      const lv = v.lvPool[i] || (v.lvPool[i] = makeCanvas());
      applyVisionEffects(lv[1], nLev === 1 ? rMax : i * rMax / (nLev - 1), isFan ? 0 : cylAmt, cylAxis);
    }
    v.lvPool2 = v.lvPool2 || [];
    if (isFan && cylAmt > 0) {                                    // duochrome side: normal cylinder smear
      for (let i = 0; i < nLev; i++) {
        const lv = v.lvPool2[i] || (v.lvPool2[i] = makeCanvas());
        applyVisionEffects(lv[1], i * rMax / (nLev - 1), cylAmt, cylAxis);
      }
    }
    if (isFan && cylAmt > 0) {
      v.ghostPool = v.ghostPool || makeCanvas();
      fanFx = true; applyVisionEffects(v.ghostPool[1], Math.min(30, maxDef * 5), cylAmt, cylAxis); fanFx = false;
    }
    if (isMulti) {
      const N = 9;
      [0.45, -0.45].forEach((ang, k) => {
        const sc = v.smearPool[k] || (v.smearPool[k] = makeCanvas()), d2 = sc[1];
        d2.clearRect(0, 0, W, H);
        for (let n = 0; n < N; n++) {
          d2.globalAlpha = 1 / (n + 1);
          const o = (n - (N - 1) / 2) * 24 / (N - 1);
          d2.drawImage(v.lvPool[0][0], Math.cos(ang) * o, Math.sin(ang) * o);
        }
        d2.globalAlpha = 1;
      });
    }
    if (haloW > 0) { v.haloPool = v.haloPool || makeCanvas(); blurInto(v.haloPool[1], sourceCanvas, haloR); }      // contacts: the halo layer
    v.lvKey = lvKey; v.lvData = null;
  }
  const readRegion = c => c[1].getImageData(gx, gy, gw, gh).data;
  const LD = v.lvData || (v.lvData = {                           // pixel data is cached until the blur levels change
    levels: v.lvPool.slice(0, nLev).map(readRegion),
    levels2: (isFan && cylAmt > 0) ? v.lvPool2.slice(0, nLev).map(readRegion) : null,
    ghost: (isFan && cylAmt > 0) ? readRegion(v.ghostPool) : null,
    halo: haloW > 0 ? readRegion(v.haloPool) : null,
    smear: isMulti ? v.smearPool.map(readRegion) : [] });
  const levelData = LD.levels, levels2Data = LD.levels2, fanGhostData = LD.ghost, smearData = LD.smear, haloData = LD.halo;

  const rowCache = [];                                           // ADD + defocus per lens height and focal region
  const rowInfo = (t, ri) => {
    const k = Math.round(t * 200), key = k * 32 + ri;
    if (!rowCache[key]) { const a = addAt(k / 200), [dl, dr, dn] = defsAt(a, regs ? regs[ri][4] : demand); rowCache[key] = { a, dl, dr, dn }; }
    return rowCache[key];
  };

  const STEP = fast ? FAST_STEP : 1;                             // fast mode: compute on a coarser grid, then upscale SMOOTHLY (no blocks)
  const off = STEP > 1 ? STEP / 2 : 0;                           // sample at the centre of each coarse pixel
  const sw = Math.ceil(rw / STEP), sh = Math.ceil(rh / STEP);
  let smallCtx = null;
  if (STEP > 1) {
    const sc = lensSmall || (lensSmall = document.createElement("canvas"));
    if (sc.width !== sw || sc.height !== sh) { sc.width = sw; sc.height = sh; }
    smallCtx = sc.getContext("2d");
  }
  const output = smallCtx ? smallCtx.createImageData(sw, sh) : ctx.getImageData(xStart, yStart, rw, rh);   // small buffer starts transparent outside the lens
  const out = output.data;

  const s3 = [0, 0, 0];
  function samp(arr, px, py) {
    const sx = Math.max(0, Math.min(gw - 1, px - gx));
    const sy = Math.max(0, Math.min(gh - 1, py - gy));
    const x0 = Math.floor(sx), y0 = Math.floor(sy);
    const x1 = Math.min(gw - 1, x0 + 1), y1 = Math.min(gh - 1, y0 + 1);
    const fx = sx - x0, fy = sy - y0;
    const p00 = (y0 * gw + x0) * 4, p10 = (y0 * gw + x1) * 4, p01 = (y1 * gw + x0) * 4, p11 = (y1 * gw + x1) * 4;
    for (let c = 0; c < 3; c++) {
      s3[c] = (arr[p00 + c] * (1 - fx) + arr[p10 + c] * fx) * (1 - fy) + (arr[p01 + c] * (1 - fx) + arr[p11 + c] * fx) * fy;
    }
  }

  for (let j = 0; j < sh; j++) {
    const y = yStart + j * STEP + off;
    const dy = (y - cy) / ry;
    if (dy * dy > 1) continue;
    const t = (dy + 1) / 2, a = rowInfo(t, 0).a;                 // ADD at this height of the lens
    const addMag = 1 + (a * ADD_STRENGTH) / 25, addRad = a * addRadK;

    for (let i = 0; i < sw; i++) {
      const x = xStart + i * STEP + off;
      const dx = (x - cx) / rx, d2 = dx * dx + dy * dy;
      if (d2 > 1) continue;
      if (lensCircle && (x - cx) * (x - cx) + (y - cy) * (y - cy) > CIRCLE_R * CIRCLE_R) continue;   // circle mask: keep the background pixel

      // 1) ADD: plus-lens magnification + pincushion
      const ra = 1 + addRad * d2;
      const ax = dx / addMag / ra;
      const ay = dy / addMag / ra;

      // 2) Lens power: magnification + radial distortion
      const rp = 1 + radialStrength * (ax * ax + ay * ay);
      let bx = (ax / magFactor / rp) * rx;
      let by = (ay / magFactor / rp) * ry;

      // 3) Cylinder: stretch the image along the power meridian
      const along = (bx * mCos + by * mSin) / cylMag;
      const perp = -bx * mSin + by * mCos;
      bx = along * mCos - perp * mSin;
      by = along * mSin + perp * mCos;

      let spx = cx + bx, spy = cy + by;

      // Multifocal side aberration
      let side = 0;
      if (isMulti) {
const DIST_EXTRA = 1;   // how far the distortion starts inside the marker (0 = same as marker)
side = sstep(Math.max(0, sideEdge(t) - DIST_EXTRA), 1.0, Math.abs(dx)) * Math.min(1, a) * (1 - 0.85 * enhFrac);
        spy += Math.abs(dx) * 80 * side;
        spx -= dx * 60 * side;
      }
      const ri = regs ? regionAt(regs, (spx - panX - 600) / zk + 600, (spy - panY - 400) / zk + 400) : 0;   // which focal distance this part of the scene has
      const rr_ = rowInfo(t, ri);
      const inFan = isFan && spx < zx0;                                      // left part of the combined scene: the fan chart
      let r = (spx < zx0 ? rr_.dn : spx < zc ? rr_.dl : rr_.dr) * 5 + side * SIDE_BLUR;   // fan: neutral | red half | blue half
      if (inFan) r += Math.abs(Math.sin(Math.atan2(spy - FAN.cy, spx - FAN.cx) - (cylAxis + 90) * Math.PI / 180)) * cylBlur(cylAmt) * 5;
      const lvData = (isFan && !inFan && levels2Data) ? levels2Data : levelData;
      const L = (nLev === 1 || rMax <= 0) ? 0 : Math.min(nLev - 1, r / rMax * (nLev - 1));
      const i0 = Math.floor(L), i1 = Math.min(nLev - 1, i0 + 1), f = L - i0;

      samp(lvData[i0], spx, spy);
      let R0 = s3[0], G0 = s3[1], B0 = s3[2];
      if (f > 0.001 && i1 !== i0) {
        samp(lvData[i1], spx, spy);
        R0 += (s3[0] - R0) * f; G0 += (s3[1] - G0) * f; B0 += (s3[2] - B0) * f;
      }
      if (side > 0.02) {
        samp(smearData[dx < 0 ? 0 : 1], spx, spy);
        const m = side * 0.8;
        R0 += (s3[0] - R0) * m; G0 += (s3[1] - G0) * m; B0 += (s3[2] - B0) * m;
      }
      if (fanGhostData && inFan) {
        samp(fanGhostData, spx, spy);
        R0 = R0 * 0.4 + s3[0] * 0.6; G0 = G0 * 0.4 + s3[1] * 0.6; B0 = B0 * 0.4 + s3[2] * 0.6;
      }
      if (haloData) {                                                        // contacts halo: the object bleeds into its surroundings
        samp(haloData, spx + HALO_SHIFT, spy + HALO_SHIFT);
        // lighten-only: light bleeds outward into darker neighbours, but a pixel is never made darker (a plain blend of a blurred copy dulls the contrast)
        R0 += Math.max(0, s3[0] - R0) * haloW; G0 += Math.max(0, s3[1] - G0) * haloW; B0 += Math.max(0, s3[2] - B0) * haloW;
      }
      const o = (j * sw + i) * 4;
      out[o] = R0; out[o + 1] = G0; out[o + 2] = B0; out[o + 3] = 255;
    }
  }

  if (smallCtx) {                                                // smooth upscale of the coarse result (the lens frame hides the soft edge)
    smallCtx.putImageData(output, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(lensSmall, 0, 0, sw, sh, xStart, yStart, sw * STEP, sh * STEP);
  } else ctx.putImageData(output, xStart, yStart);
  drawLensFrame();
  drawLensGuides();
}

function doRender(sim) {
  sim.renderPending = false;
  useView(sim);
  syncContacts(sim);
  controlDefs.forEach(d => { if (d.corr) syncCorrection(d); });
  controlDefs.forEach(d => {
    const full = d.corr ? corrLabel(d) : (d.id === "nearAdd" && sim.contactMode ? contactLabel(Math.round(Number(el[d.id].value))) : d.f(Number(el[d.id].value)));
    const vEl = sim.r(d.id + "Value");
    if (vEl.textContent !== full) vEl.textContent = full;
    const cEl = sim.r(d.id + "Chip");
    if (cEl) {                                                    // compact value on the chip
      const pr = full.split(" · "), c = (d.axisCorr ? pr[0] : d.corr || d.id === "accommodation" ? pr[pr.length - 1] : pr[0]).replace(" D", "");
      if (cEl.textContent !== c) cEl.textContent = c;
    }
  });
  renderView(sim);
  const html = `<div class="result-main">${dual ? "AB"[sim.i] + " · " : ""}${sim.title}</div><div class="result-sub">${sim.detail}</div>`;
  if (html !== sim.lastHtml) { $("result" + sim.i).innerHTML = html; sim.lastHtml = html; }
}

/* ---------- VIEW POSITION (the lens stays in the middle, the scene moves) ---------- */
function updateLensPosition(sim) {
  if (!visible(sim)) return;
  const h = Number(sim.el.lensPosition.value);
  const v = Number(sim.el.lensVerticalPosition.value);
sim.panX = -(h - 50) / 100 * (W - 2 * lens.rx);
sim.panY = -(v - 50) / 100 * (H - 2 * lens.ry);
  const F = sim.FAN;
  F.cx = FAN_CX + sim.panX; F.cy = FAN_CY + sim.panY;
  F.x0 = Math.max(0, Math.min(W - F.size, FAN_CX - (FAN_R + 120) + sim.panX));
  F.y0 = Math.max(0, Math.min(H - F.size, FAN_CY - (FAN_R + 120) + sim.panY));
  sim.bgKey = ""; sim.lvKey = "";
  panView(sim);
  render(sim);
}

/* ---------- EVENTS + INIT ---------- */
// Tap / click anywhere outside a chip or its slider popup closes the open popup
document.addEventListener("pointerdown", e => {
  if (!e.target.closest(".chip-wrap")) closePops();
});

// Pop-up sheets: Controls and Details (one open at a time; they sit above the bar so the sliders stay reachable)
const sheetBtn = { ctrlSheet: $("btnControls"), detailSheet: $("btnDetails") };
function openSheet(id) {
  const open = !$(id).classList.contains("open");
  Object.keys(sheetBtn).forEach(k => { $(k).classList.toggle("open", k === id && open); sheetBtn[k].classList.toggle("active", k === id && open); });
  closePops();
}
$("btnControls").addEventListener("click", () => openSheet("ctrlSheet"));
$("btnDetails").addEventListener("click", () => openSheet("detailSheet"));
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.close)));

// the sheets sit right above the bar, whatever height the bar has
const setBarH = () => document.documentElement.style.setProperty("--barH", (innerHeight - $("bar").getBoundingClientRect().top + 6) + "px");   // distance from the screen bottom to just above the bar
new ResizeObserver(setBarH).observe($("bar"));
addEventListener("resize", setBarH); addEventListener("orientationchange", () => setTimeout(setBarH, 200));
setBarH();

createSim(0);
createSim(1);                      // hidden until "Dual" is pressed; drawn the first time it is shown
$("zoomIn").addEventListener("click", () => { zoomLevel = Math.min(1.5, zoomLevel + 0.25); applyZoom(); });
$("zoomOut").addEventListener("click", () => { zoomLevel = Math.max(0.5, zoomLevel - 0.25); applyZoom(); });
$("zoomReset").addEventListener("click", () => { zoomLevel = 1; applyZoom(); });
applyZoom();
new ResizeObserver(layoutViewers).observe($("rowViews"));
addEventListener("orientationchange", () => setTimeout(layoutViewers, 200));
layoutViewers();
sims[0].r("scene").addEventListener("input", () => sims.forEach(s => { if (visible(s)) setScene(s); }));   // ONE scene slider moves both
sims[0].r("dual").addEventListener("click", toggleDual);
setScene(sims[0]);
updateLensPosition(sims[0]);

/* ---------- SWEEP: human-like gaze (fast jumps, stares, slow drifts) ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clampPos = x => Math.max(20, Math.min(80, x));       // slider limits

// Near object per scene, in scene coordinates [x, y]
const NEAR_TARGET = {
  city: [750, 550], escalator: [750, 550], market: [750, 550],   // the small phone
  phone: [600, 380], computer: [580, 300], meeting: [605, 587],
  night: [600, 730], duo: [700, 400]
};
// Where the near object sits inside the lens: 0 = lens centre, 1 = very bottom edge of the lens.
// 0.5 = midway between the centre and the bottom.
const NEAR_LENS_LOWER = 0.5;

// Slider position that puts a scene point at that spot in the lens (same maths as updateLensPosition, incl. scene zoom-out)
function nearPos() {
  const key = SCENES[Number(sims[0].r("scene").value)][0];
  const [x, y] = NEAR_TARGET[key] || [750, 550], zk = ZK[key] || 1;
  const h = 50 + (x - 600) * zk * 100 / (W - 2 * lens.rx);
  const v = 50 + ((y - 400) * zk - lens.ry * NEAR_LENS_LOWER) * 100 / (H - 2 * lens.ry);
  return [Math.max(-20, Math.min(120, h)), Math.max(0, Math.min(100, v))];   // full slider ranges
}

// move: "s" = saccade (fast jump, ~100-250 ms), "d" = slow drift. hold = how long the eye stares there (ms)
const GLANCE_MS = 300;   // how long the quick glances take (ms). Smaller = snappier
const clampFull = (h, v) => [Math.max(-20, Math.min(120, h)), Math.max(0, Math.min(100, v))];   // real slider ranges

// move: "s" = saccade (fast jump), "d" = slow drift. hold = how long the eye stares there (ms)
function buildPlan() {
  const side = Math.random() < 0.5 ? -1 : 1;
  const plan = [
    { h: 50 + side * rand(15, 28), v: rand(38, 50), move: "s", hold: rand(1200, 1800) },   // quick look at something
    { h: 50 - side * rand(12, 25), v: rand(42, 55), move: "s", hold: rand(900, 1400) },    // quick look the other way
    { h: 50 + side * rand(5, 15),  v: rand(74, 80), move: "d", hold: rand(2500, 3500) },   // slow diagonal down to the floor, stare
    { near: true,                                    move: "s", hold: rand(3000, 4000) }   // jump to the phone / near object, stare
  ];
  if (Math.random() < 0.5) plan.push(                                                      // A) distracted: quick glance left, quick back
    { nearOff: [-rand(18, 28), -rand(4, 10)], move: "s", dur: GLANCE_MS, hold: rand(300, 700) },
    { near: true,                              move: "s", dur: GLANCE_MS, hold: rand(2500, 3500) });
  else plan.push(                                                                          // B) quick look to the centre, pause, quick back
    { h: 50, v: 50,                            move: "s", dur: GLANCE_MS, hold: rand(1500, 2500) },
    { near: true,                              move: "s", dur: GLANCE_MS, hold: rand(2500, 3500) });
  plan.push(
    { h: 50 + rand(-10, 10), v: rand(25, 32), move: "s", hold: rand(700, 1000) },          // look up
    { h: 50, v: 50, move: "d", dur: rand(1200, 1800), hold: 1500 }                         // slowly back to centre
  );
  return plan;
}

let sweepOn = false, sweepRAF = 0, sweepT0 = 0, sweepPlan = [], sweepI = 0, sweepPhase = "move", sweepFrom = { h: 50, v: 50 }, sweepTo = null, sweepDur = 0;

function sweepSetPos(h, v) {
  const e = sims[0].el;
  const nh = h.toFixed(3), nv = v.toFixed(3);
  if (e.lensPosition.value === nh && e.lensVerticalPosition.value === nv) return;   // nothing moved: skip the heavy redraw
  e.lensPosition.value = nh; e.lensVerticalPosition.value = nv;
  sims.forEach(s => { if (visible(s)) updateLensPosition(s); });
}

function sweepBeginStep(now) {
  if (sweepI >= sweepPlan.length) { sweepPlan = buildPlan(); sweepI = 0; }
  const st = sweepPlan[sweepI], e = sims[0].el;
  sweepFrom = { h: Number(e.lensPosition.value), v: Number(e.lensVerticalPosition.value) };
  let th, tv;
if (st.near) [th, tv] = nearPos();
else if (st.nearOff) { const [nh, nv] = nearPos(); [th, tv] = clampFull(nh + st.nearOff[0], nv + st.nearOff[1]); }   // relative to the phone
else [th, tv] = [clampPos(st.h), clampPos(st.v)];
  sweepTo = { h: th, v: tv };
  const dist = Math.hypot(th - sweepFrom.h, tv - sweepFrom.v);
  sweepDur = st.dur || (st.move === "s" ? 1000 + dist * 3 : rand(2800, 4200));   // jumps are fast, drifts are slow
  sweepPhase = "move"; sweepT0 = now;
}

function sweepFrame(now) {
  if (!sweepOn) return;
  const st = sweepPlan[sweepI];
  if (sweepPhase === "move") {
    const k = Math.min(1, (now - sweepT0) / sweepDur);
    const ease = st.move === "s" ? 1 - Math.pow(1 - k, 3) : k * k * (3 - 2 * k);   // jump: fast start, sudden stop. drift: gentle in/out
    sweepSetPos(sweepFrom.h + (sweepTo.h - sweepFrom.h) * ease, sweepFrom.v + (sweepTo.v - sweepFrom.v) * ease);
    if (k >= 1) { sweepPhase = "hold"; sweepT0 = now; }
  } else if (now - sweepT0 >= st.hold) {
    sweepI++; sweepBeginStep(now);
  }
  sweepRAF = requestAnimationFrame(sweepFrame);
}

function setSweep(on) {
  const e = sims[0].el;
  sweepOn = on;
  $("btnSweep").classList.toggle("active", on);
  $("btnSweep").textContent = on ? "Stop" : "Sweep";
  cancelAnimationFrame(sweepRAF);
  if (on) {
    e.lensPosition.step = "0.001"; e.lensVerticalPosition.step = "0.001";   // very fine steps so nothing snaps
    sweepPlan = buildPlan(); sweepI = 0;
    sweepBeginStep(performance.now());
    sweepRAF = requestAnimationFrame(sweepFrame);
  } else {
    e.lensPosition.step = "1"; e.lensVerticalPosition.step = "1";
    sims.forEach(s => { if (visible(s)) updateLensPosition(s); });
  }
}
$("btnSweep").addEventListener("click", () => setSweep(!sweepOn));
// touching either position slider (or its Reset) by hand stops the sweep
[sims[0].el.lensPosition, sims[0].el.lensVerticalPosition,
 sims[0].r("lensPositionReset"), sims[0].r("lensVerticalPositionReset")]
  .forEach(x => x.addEventListener("pointerdown", () => { if (sweepOn) setSweep(false); }));


</script>
</body>
</html>
