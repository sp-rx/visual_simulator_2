<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIARA OPTOMETRY | Spectacle Lens Distortion</title>
<style>
:root{--bg:#F5F1E8;--panel:#FFFDF7;--green:#3A6656;--green-dark:#2F5547;--text:#292D2A;--muted:#777D77}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.container{max-width:2200px;margin:auto;zoom:0.72}
h2{margin:0 0 2px;font-size:15px;color:var(--green-dark)}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
.panel{background:var(--panel);padding:14px;border-radius:12px;border:1px solid #E5E0D5}

/* Layout: picture (stage) + controls. Stacked by default */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stage{min-width:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{min-width:0}

.pos-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.scene-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.scene-blocks{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:14px}
.dual-btn{flex:none;margin-top:8px}
.pos-row strong{font-size:9px;white-space:nowrap}
.pos-row input[type=range]{flex:1;min-width:0}
.tick{font-size:9px;color:var(--muted)}

.view-row{display:flex;gap:6px;align-items:stretch}
.viewer{flex:1;min-width:0;aspect-ratio:3/2;overflow:hidden;position:relative;background:#D9D9D9;border-radius:10px;display:flex;gap:4px}
.cv{position:relative;flex:1;min-width:0;overflow:hidden;background:#D9D9D9}
.cv-tag{position:absolute;left:8px;top:8px;z-index:2;padding:3px 8px;border-radius:999px;background:rgba(41,45,42,.72);color:#fff;font-size:9px;font-weight:bold}
[hidden]{display:none!important}
.stress-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
canvas{position:absolute;width:100%;height:100%;left:0;top:0;display:block;transform-origin:center;transition:transform .2s ease}

.result{height:112px;overflow:auto;margin-top:10px;padding:10px;background:#F5F1E8;border-radius:10px;text-align:center}
.result-main{font-size:11px;font-weight:bold;color:var(--green-dark)}
.result-main,.result-sub{white-space:pre-line}
.result-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}

.control{padding:4px 0}
.control-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.control-heading strong{font-size:10px}
.value{font-size:10px;font-weight:bold;color:var(--green);white-space:nowrap}
.control-right{display:flex;align-items:center;gap:8px}
.reset-button{border:1px solid #C9D1C9;background:transparent;color:var(--green-dark);padding:0px 8px;border-radius:8px;font-size:9px;height:18px;cursor:pointer}
.reset-button:hover,.reset-button:active{background:#EAEFE9}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* Correction sliders: 100-125% shaded red (not recommended). The Axis Correction slider sets its own track (--tg): red = more than 15 deg from the eye's axis */
.control.corr .scale{font-size:9px}
.control input.corr-slider::-webkit-slider-runnable-track{background:var(--tg,linear-gradient(to right,#CBD6CD 0 var(--rp,66%),#E7A9A2 var(--rp,66%) 100%))}
.control input.corr-slider::-moz-range-track{background:var(--tg,linear-gradient(to right,#CBD6CD 0 var(--rp,66%),#E7A9A2 var(--rp,66%) 100%))}

.reset-all{grid-column:1/-1;width:100%;height:30px;border:0;border-radius:8px;background:var(--green);color:#fff;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer}
.reset-all:active{background:var(--green-dark)}

.lens-switch button.active{background:var(--green);color:#fff}

/* View panel (below Reset All): position sliders + lens buttons + zoom */
.viewpanel{border:1px solid #E5E0D5;border-radius:10px;background:#FBF8EF;padding:8px 12px}
.pos-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pos-pair .pos-row{margin-top:0}
@media (max-width:940px){
  .pos-pair{grid-template-columns:minmax(0,1fr);gap:6px}   /* Horizontal on top, Vertical below */
  .pos-pair .pos-row strong{min-width:62px}                /* both tracks start at the same x */
  .pos-pair .pos-row input[type=range]{min-width:80px}     /* track can't collapse */
}
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:10px}
.lens-switch,.boundary-controls{display:flex;align-items:center;gap:4px;padding:4px;height:34px;border-radius:999px;white-space:nowrap}
.boundary-controls{display:flex;visibility:hidden}
.lens-switch button{border:0;background:transparent;color:var(--green-dark);font-family:inherit;font-size:10px;font-weight:bold;height:26px;padding:0 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.boundary-controls button{--c:#3A6656;height:26px;padding:0 10px;border:1.5px solid var(--c);border-radius:999px;background:transparent;color:var(--c);font-family:inherit;font-size:9px;font-weight:bold;cursor:pointer;opacity:.6}
.boundary-controls button.active{background:var(--c);color:#fff;opacity:1}
.boundary-controls [data-boundary=far]{--c:#4B9B80}
.boundary-controls [data-boundary=intermediate]{--c:#E2B84B}
.boundary-controls [data-boundary=intermediate].active{color:#3a3000}
.boundary-controls [data-boundary=near]{--c:#D77C55}
.boundary-controls [data-boundary=distortion]{--c:#C0392B}
.zoom-controls{display:flex;align-items:center;gap:5px;padding:5px;border-radius:9px}
.zoom-controls button{height:27px;min-width:27px;border:1px solid #C9D1C9;border-radius:6px;background:var(--green);color:#fff;font-size:13px;font-weight:bold;cursor:pointer}
.zoom-controls .zreset{background:transparent;color:var(--green-dark);font-size:9px;padding:0 7px}
.zval{min-width:35px;text-align:center;font-size:9px;font-weight:bold;color:var(--green-dark)}
.dual-btn.active{background:var(--green);color:#fff;border-color:var(--green)}

/* Polish */
.panel{box-shadow:0 6px 24px rgba(41,45,42,.08)}
.viewer{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 2px 10px rgba(41,45,42,.12)}
.lens-switch,.boundary-controls,.zoom-controls{background:rgba(255,253,247,.95);border:1px solid #D8D2C4;box-shadow:0 2px 10px rgba(41,45,42,.15)}
.lens-switch button,.boundary-controls button{transition:background .15s,color .15s}
.control{padding:6px 0}
.result{background:linear-gradient(#F8F4EA,#F3EEE2);border:1px solid #EAE3D3}
input[type=range]::-webkit-slider-thumb{box-shadow:0 1px 5px rgba(0,0,0,.35),0 0 0 1px rgba(58,102,86,.25)}

.group{grid-column:1/-1;border:1px solid #E5E0D5;border-radius:10px;background:#FBF8EF;padding:0 12px}

/* Slider chips: small buttons that open a floating slider */
.controls{display:flex;flex-direction:column;gap:8px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipgrid{display:grid;grid-template-columns:repeat(4,max-content);gap:8px;justify-content:start}
.chipgrid .chip{width:100%;justify-content:space-between}
.chipgrid .copy-btn{justify-content:center}
.chipgrid .reset-all{grid-row:3;grid-column:4;width:100%;height:36px;padding:0 15px;border-radius:999px;font-size:12px;white-space:nowrap}
.chip-wrap{position:static}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 15px;border:1px solid #C9D1C9;border-radius:999px;background:#fff;color:var(--green-dark);font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap}
.chip .value{font-size:11px}
.chip.open{background:var(--green);border-color:var(--green);color:#fff}
.chip.open .value{color:#fff}
.pop{position:absolute;left:12.5%;z-index:50;width:75%;background:var(--panel);border:1px solid #D8D2C4;border-radius:10px;padding:6px 12px 8px;box-shadow:0 8px 24px rgba(41,45,42,.28)}
.pop .control{border:0;padding:2px 0}
.pop .control-heading{flex-wrap:nowrap}
.pop .control-heading strong{flex:1}
.pop .control-right{width:auto}

/* Touch-friendly sliders */
input[type=range]{--th:28px;-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid #fff}

@media (max-width:600px){
  body{padding:7px}.panel{padding:8px}
}
.scale-wrapper{width:100%}
.result{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;align-items:center;height:76px;margin-top:8px;padding:6px 10px}
.result-panel{display:flex;align-items:flex-start;gap:6px;align-self:flex-start;padding:4px;background:linear-gradient(#F8F4EA,#F3EEE2);border:1px solid #EAE3D3;border-radius:10px}
.result-panel.open{align-self:stretch}
.result-panel .result{flex:1;min-width:0;margin:0;background:none;border:0}
.detail-toggle{flex:none;display:flex;align-items:center;justify-content:center;width:30px;height:30px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--green-dark);font-family:inherit;font-size:14px;font-weight:bold;cursor:pointer}
.detail-toggle:active{background:#EAEFE9}
.detail-toggle .arrow{display:inline-block;transition:transform .15s}
.detail-toggle[aria-expanded=true] .arrow{transform:rotate(90deg)}
.result-main{font-size:10px}
.result-sub{font-size:9px;line-height:1.35;margin-top:2px}
.result{grid-column:1/-1}
/* Compact sizing for a portrait iPad. Single and dual panels are the same size (single sits in the left half). */
body{padding:4px}
.panel{padding:8px;border-radius:10px}
.layout,.side{gap:8px}
.group{padding:0 8px}
.control{padding:3px 0}
.control-heading strong,.value{font-size:9px}
.reset-button{font-size:8px;height:16px;padding:0 6px;border-radius:6px}
.scale,.control.corr .scale{font-size:8px}
.chipgrid{gap:5px}
.chip{height:26px;padding:0 9px;font-size:10px;gap:4px}
.chip .value{font-size:9px}
.pop{padding:4px 9px 6px}
.chipgrid .reset-all{height:26px;padding:0 9px;font-size:10px}
input[type=range]{--th:22px;height:24px}
input[type=range]::-webkit-slider-thumb{width:22px;height:22px;margin-top:-8px;border-width:2px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-width:2px}
.detail-toggle{width:24px;height:24px;font-size:12px}
.result{height:64px;margin-top:4px;padding:4px 8px}
.result-main{font-size:9px}
.result-sub{font-size:8px}
.pos-row{gap:6px}
.pos-row strong,.tick{font-size:8px}
.pos-pair{grid-template-columns:minmax(0,1fr);gap:2px}
.pos-pair .pos-row strong{min-width:52px}
.viewpanel{padding:6px 8px}
.toolbar{gap:5px;margin-top:6px}
.lens-switch,.boundary-controls{height:28px;padding:3px;gap:3px}
.lens-switch button{font-size:9px;height:22px;padding:0 9px}
.boundary-controls button{height:22px;padding:0 8px;font-size:8px}
.zoom-controls{padding:3px;gap:4px}
.zoom-controls button{height:22px;min-width:22px;font-size:11px}
.zoom-controls .zreset{font-size:8px;padding:0 6px}
.zval{min-width:30px;font-size:8px}
.cv-tag{font-size:8px;padding:2px 6px}
/* One shared scene / position / details area; the two eyes (A, B) only differ in their own chips + lens row */
.sims{display:flex;flex-direction:column;gap:6px;width:100%}
/* the two eyes: centred and half width when single, full width when dual */
.pair{display:flex;flex-direction:column;gap:6px;width:50%;margin:0 auto}
.sims.dual .pair{width:100%}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-items:start}
.sims.dual .row{grid-template-columns:repeat(2,minmax(0,1fr))}
.ctrlcol{display:flex;flex-direction:column;gap:6px;min-width:0;padding:6px 8px;border:1px solid #E5E0D5;border-radius:10px;background:#FBF8EF}
.ctrlcol .toolbar{margin-top:8px;justify-content:flex-start}
.sims .result-panel{align-self:flex-start}
.sims .result-panel.open{align-self:stretch}
.sims .pos-pair{grid-template-columns:1fr 1fr auto;gap:16px;align-items:center}
.viewpanel .scene-row{margin-bottom:4px}
/* ===== Full-screen scenes. Controls and details are pop-up sheets. ===== */
html,body{height:100%}
body{padding:0;overflow:hidden}
.scale-wrapper,.container{height:100%}
.container{zoom:1;max-width:none;margin:0}
.sims.panel{height:100vh;height:100dvh;padding:4px;border-radius:0;border:0;box-shadow:none;gap:4px}
.ui{zoom:0.72}                                   /* the small-UI scale now only applies to the bar and the sheets, not to the scenes */

/* the scenes take every pixel that is left above the bar; 3:2 pictures sized from the free space (container query units) */
.views{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;gap:4px}
.views > div{display:flex}
.viewer{flex:none;width:min(100cqw,150cqh);aspect-ratio:3/2}
.sims.dual .viewer{width:min(calc(50cqw - 2px),150cqh)}                     /* landscape: side by side */
@media (orientation:portrait){
  .sims.dual .views{flex-direction:column}                                  /* portrait: A above B, each as big as fits */
  .sims.dual .viewer{width:min(100cqw,calc(75cqh - 3px))}
}

.bar{flex:none}
.bar .viewpanel{border-radius:10px}
.scene-btns{display:flex;gap:6px;flex:none;margin-top:8px}
.scene-btns .dual-btn{margin-top:0}
.tbtn{height:22px;padding:0 10px;font-size:9px;font-weight:bold;border-radius:999px}
.tbtn.active{background:var(--green);color:#fff;border-color:var(--green)}

/* pop-up sheets sit just above the bar, so the scenes and the sliders stay visible */
.sheet{display:none;position:fixed;left:0;right:0;bottom:var(--barH,120px);z-index:100;background:var(--panel);border-top:1px solid #D8D2C4;box-shadow:0 -6px 20px rgba(41,45,42,.25);padding:4px 8px 6px}
.sheet.open{display:block}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sheet-head strong{font-size:10px;color:var(--green-dark)}
.sheet-close{border:1px solid #C9D1C9;background:transparent;color:var(--green-dark);border-radius:999px;height:22px;width:26px;font-size:11px;font-weight:bold;cursor:pointer}
.sheet .result{height:auto;min-height:48px;margin:0;background:none;border:0}
/* breathing room around everything, so edge buttons are easy to hit on the iPad */
.sims.panel{padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px)) 16px;gap:10px}
.bar .viewpanel{padding:10px 14px}
.sheet{left:10px;right:10px;border:1px solid #D8D2C4;border-radius:12px;padding:6px 12px 10px}
/* ===== Bigger slider handles / buttons for the iPad ===== */
input[type=range]{--th:33px;height:48px}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px}
input[type=range]::-moz-range-track{height:8px;border-radius:4px}
input[type=range]::-webkit-slider-thumb{width:33px;height:22px;margin-top:-7px;border-radius:11px;border-width:3px}
input[type=range]::-moz-range-thumb{width:27px;height:16px;border-radius:8px;border-width:3px}
.reset-button{height:28px;padding:0 10px;font-size:9px;border-radius:8px}
.tbtn{height:30px;padding:0 12px;font-size:10px}
.zoom-controls button{height:30px;min-width:30px;font-size:13px}
.zoom-controls .zreset{font-size:9px;padding:0 9px}

/* ===== Taller pictures: the scene is cropped at the sides and scaled up to fill the height ===== */
.viewer{aspect-ratio:auto}                         /* width + height are set from the free space by layoutViewers() */
.cv{container-type:inline-size}
canvas{width:150cqw;height:100cqw;left:50%;top:50%}  /* scene scaled so the lens fills the width; the part that overflows is cropped */
.control-heading.scene-head{justify-content:flex-start;gap:6px}
.chip:disabled{opacity:.4;cursor:default}
/* ===== Aspheric + MF Enhance sliders, inside the scene ===== */
.cv-tools{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:flex;gap:14px;padding:2px 12px;border-radius:12px;background:rgba(255,253,247,.82);border:1px solid #D8D2C4;box-shadow:0 2px 10px rgba(41,45,42,.2);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.cv-tools .control{flex:1;min-width:0;padding:0;border:0}
.cv-tools .control-heading{margin-bottom:0}
.cv-tools .control-heading strong{font-size:11px;flex:1}
.cv-tools .value{font-size:11px}
.cv-tools .scale,.cv-tools .reset-button{display:none}   /* Reset All still clicks the hidden Reset buttons */
.cv-tools input[type=range]{height:38px}

</style>
</head>
<body>

<div class="scale-wrapper">
<div class="container">
<div class="sims panel" id="sims">

  <div class="views" id="rowViews"></div>

  <!-- shared by A and B -->
  <div class="bar" id="bar"><div class="ui">
    <div class="viewpanel">
      <div class="scene-row">
        <div class="scene-blocks"><div class="control">
          <div class="control-heading scene-head"><strong>Viewing Scene :</strong><span class="value" data-r="sceneValue"></span></div>
          <input type="range" data-r="scene" min="0" max="7" step="1" value="0">
          <div class="scale"><span>City</span><span>Escalator</span><span>Aisle</span><span>Night</span><span>Meeting</span><span>Computer</span><span>Phone</span><span>Duo + Fan</span></div>
        </div></div>
        <div class="scene-btns">
          <button class="reset-button tbtn" id="btnControls" type="button">Controls</button>
          <button class="reset-button tbtn" id="btnDetails" type="button">Details</button>
          <button class="reset-button tbtn dual-btn" data-r="dual" type="button">Dual</button>
  <button class="reset-button tbtn" id="btnSweep" type="button">Sweep</button>
        </div>
      </div>
      <div class="pos-pair">
        <div class="pos-row"><strong>Horizontal</strong><span class="tick">Left</span>
          <input type="range" data-r="lensPosition" min="-20" max="120" step="1" value="50"><span class="tick">Right</span>
          <span class="value" data-r="lensPositionValue"></span><button class="reset-button" data-r="lensPositionReset" type="button">Reset</button></div>
        <div class="pos-row"><strong>Vertical</strong><span class="tick">Top</span>
          <input type="range" data-r="lensVerticalPosition" min="0" max="100" step="1" value="50"><span class="tick">Bottom</span>
          <span class="value" data-r="lensVerticalPositionValue"></span><button class="reset-button" data-r="lensVerticalPositionReset" type="button">Reset</button></div>
        <div class="zoom-controls">
          <button type="button" id="zoomOut">&minus;</button><span class="zval" id="zoomValue">100%</span><button type="button" id="zoomIn">+</button><button type="button" class="zreset" id="zoomReset">Reset</button>
        </div>
      </div>
    </div>
  </div></div>

  <!-- pop-up: every eye's chips + lens buttons -->
  <div class="sheet" id="ctrlSheet"><div class="ui">
    <div class="sheet-head"><strong>Controls</strong><button class="sheet-close" data-close="ctrlSheet" type="button">&times;</button></div>
    <div class="row" id="rowCtrls"></div>
  </div></div>

  <!-- pop-up: details -->
  <div class="sheet" id="detailSheet"><div class="ui">
    <div class="sheet-head"><strong>Details</strong><button class="sheet-close" data-close="detailSheet" type="button">&times;</button></div>
    <div class="result" id="resultBox"><div id="result0"></div><div id="result1" hidden></div></div>
  </div></div>

</div>
</div>
</div>

<script>
/* ---------- CANVASES ---------- */
const W = 1200, H = 800;
let canvas, ctx, sourceCanvas, S, curScene = "city";   // swapped per view by useView()
let cur = null;                                         // the simulator (A or B) being drawn right now, set by useView()
let panX = 0, panY = 0;                                 // how far the view (scene) is moved; the lens stays in the middle

function makeCanvas(willRead) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  return [c, c.getContext("2d", willRead ? { willReadFrequently: true } : undefined)];
}
const [blurCanvas, blurCtx] = makeCanvas();
const [ghostCanvas, ghostCtx] = makeCanvas();
const [smearCanvas, smearCtx] = makeCanvas();
const lens = { cx: W / 2, cy: H / 2, rx: 390, ry: 230 };

let lensCircle = false;          // circle mask on/off (the oval maths is unchanged either way)
const CIRCLE_R = 207;            // 90% of the oval's half-height (230); change this to resize the circle

function lensPath(c) {
  c.beginPath();
  if (lensCircle) c.arc(lens.cx, lens.cy, CIRCLE_R, 0, Math.PI * 2);
  else c.ellipse(lens.cx, lens.cy, lens.rx, lens.ry, 0, 0, Math.PI * 2);
  c.closePath();
}

/* ---------- AGE <-> ACCOMMODATION (estimate) ---------- */
const AGE_TABLE = [[0.25, 58], [0.5, 53], [1, 49], [2, 43], [3, 38], [4, 33], [5, 27]];   // [diopters, age]
function ageLabel(acc) {
  if (acc <= AGE_TABLE[0][0]) return ">" + AGE_TABLE[0][1] + " yrs";
  if (acc >= AGE_TABLE[AGE_TABLE.length - 1][0]) return "<" + AGE_TABLE[AGE_TABLE.length - 1][1] + " yrs";
  for (let i = 1; i < AGE_TABLE.length; i++) {
    const [a0, y0] = AGE_TABLE[i - 1], [a1, y1] = AGE_TABLE[i];

const SHORT = { power: "Far RX", accommodation: "AA Age", cylinder: "Cyl Rx", axis: "Axis", nearAdd: "Add", aspheric: "Aspheric", enhance: "MF Enhance", cylCorrection: "Cyl Rx %", axisCorrection: "Axis %", farCorrection: "Far RX %", nearCorrection: "Near RX %" };
let el = {};            // the active simulator's sliders (swapped by useView)
let userSet = {};       // the active simulator's "moved by hand" flags

const q25 = x => Math.round(x / 0.25) * 0.25;

// A correction slider is the lens actually worn, in 0.25 D steps: from 50% of its base up to 0.50 D (2 steps) over-corrected.
// When the base Rx is 0.00 the slider still works: it is then a plain lens power on an eye with no error
// (far: -1.50 .. +1.50 D, signed; cylinder and add: 0 .. +1.50 D). Default is 0.00 (no lens power).
const CORR_ZERO_SPAN = 1.5;
function corrRange(d) {
  const base = Number(el[d.base].value), B = Math.abs(base);
  if (B === 0) return { base, B, zero: true, lo: d.base === "power" ? -CORR_ZERO_SPAN : 0, hi: CORR_ZERO_SPAN };
  return { base, B, lo: Math.max(0.25, q25(0.5 * B)), hi: B + 1.5 };
}
// The lens value in D, with its sign (for the far lens at 0 Rx the slider is already signed)
function corrLens(d) {
  const r = corrRange(d), m = Number(el[d.id].value);
  return r.zero ? m : (r.base < 0 ? -1 : 1) * m;
}
// Axis tolerance (deg, each way) shrinks exponentially as the eye's cylinder grows:
// AXIS_TOL_LOW at AXIS_TOL_CYL_LOW (0.25 D)  ->  AXIS_TOL_MIN at AXIS_TOL_CYL_HIGH (2.75 D) and above.
const AXIS_TOL_LOW = 45, AXIS_TOL_MIN = 5, AXIS_TOL_CYL_LOW = 0.25, AXIS_TOL_CYL_HIGH = 2.75;
const AXIS_TOL_CURVE = 3;      // curvature: 0 = straight line, 3 = curvy, 5 = very curvy
function axisTol(cyl) {
  if (cyl <= AXIS_TOL_CYL_LOW) return AXIS_TOL_LOW;
  if (cyl >= AXIS_TOL_CYL_HIGH) return AXIS_TOL_MIN;
  const k = (cyl - AXIS_TOL_CYL_LOW) / (AXIS_TOL_CYL_HIGH - AXIS_TOL_CYL_LOW);
  // true exponential decay that still hits both ends exactly; bigger AXIS_TOL_CURVE = steeper drop at first, then a long flat tail
  const e = x => Math.exp(-AXIS_TOL_CURVE * x);
  return AXIS_TOL_MIN + (AXIS_TOL_LOW - AXIS_TOL_MIN) * (e(k) - e(1)) / (e(0) - e(1));
}
function syncCorrection(d) {
  const slider = el[d.id], lab = k => cur.r(d.id + k);
  if (d.axisCorr) {                                  // Axis correction: 0-180, starts on the eye's axis (100% corrected) until moved
    const prevA = Number(slider.value), eyeAxis = Number(el[d.base].value);
    slider.min = 0; slider.max = 180; slider.step = 5;
    slider.value = userSet[d.id] ? prevA : eyeAxis;
    // green = within the tolerance of the eye's axis (wraps around 0/180); red = further away
    const cylNow = Number(el.cylinder.value), tol = axisTol(cylNow);
    if (cylNow === 0) slider.style.setProperty("--tg", "#CBD6CD");   // no cylinder -> the axis doesn't matter: all green, no red zone
    else {
      const G = "#CBD6CD", Rd = "#E7A9A2", p = v => `calc(var(--th,28px)/2 + (100% - var(--th,28px)) * ${(v / 180).toFixed(4)})`;   // thumb centre travels from th/2 to width-th/2
      const lo = eyeAxis - tol, hi = eyeAxis + tol;
      slider.style.setProperty("--tg", lo < 0
        ? `linear-gradient(to right,${G} 0 ${p(hi)},${Rd} ${p(hi)} ${p(180 + lo)},${G} ${p(180 + lo)} 100%)`
        : hi > 180
        ? `linear-gradient(to right,${G} 0 ${p(hi - 180)},${Rd} ${p(hi - 180)} ${p(lo)},${G} ${p(lo)} 100%)`
        : `linear-gradient(to right,${Rd} 0 ${p(lo)},${G} ${p(lo)} ${p(hi)},${Rd} ${p(hi)} 100%)`);
    }
    lab("Lo").textContent = "0°"; lab("Mid").textContent = "Eye axis " + eyeAxis + "°" + (cylNow > 0 ? " (±" + Math.round(tol) + "°)" : ""); lab("Hi").textContent = "180°";
    return;
  }
  const r = corrRange(d), sg = r.base < 0 ? "-" : "+";
  if (r.zero) {                                      // base Rx is 0.00: the slider is a free lens power (0.00 D = no lens)
    const prev = Number(slider.value);
    slider.min = r.lo; slider.max = r.hi; slider.step = 0.25;
    slider.value = userSet[d.id] ? Math.min(r.hi, Math.max(r.lo, prev)) : 0;
    const f = v => Math.min(1, Math.max(0, (v - r.lo) / (r.hi - r.lo)));
    const p = v => `calc(var(--th,28px)/2 + (100% - var(--th,28px)) * ${f(v).toFixed(4)})`;
    slider.style.setProperty("--tg", `linear-gradient(to right,#E7A9A2 0 ${p(-0.125)},#CBD6CD ${p(-0.125)} ${p(0.125)},#E7A9A2 ${p(0.125)} 100%)`);   // green only at 0.00 D, anything else is a lens the eye doesn't need
    lab("Lo").textContent = r.lo < 0 ? "-" + (-r.lo).toFixed(2) + " D" : "0.00 D";
    lab("Mid").textContent = r.lo < 0 ? "0.00 D" : "";
    lab("Hi").textContent = "+" + r.hi.toFixed(2) + " D";
    return;
  }
  slider.style.removeProperty("--tg");
  const clamp = v => Math.min(r.hi, Math.max(r.lo, v)), prev = Number(slider.value);
  slider.min = r.lo; slider.max = r.hi; slider.step = 0.25;
  slider.value = userSet[d.id] ? clamp(prev) : clamp(r.B);
  slider.style.setProperty("--rp", `calc(var(--th,28px)/2 + (100% - var(--th,28px)) * ${((r.B - r.lo) / (r.hi - r.lo)).toFixed(4)})`);     // red shade starts after 100%
  lab("Lo").textContent = sg + r.lo.toFixed(2) + " D";
  lab("Mid").textContent = sg + r.B.toFixed(2) + " D (100%)";
  lab("Hi").textContent = sg + r.hi.toFixed(2) + " D";
}
function corrFraction(d) {                                       // lens value as a fraction of the base (1 = full correction)
  const r = corrRange(d);
  return r.B === 0 ? 1 : Number(el[d.id].value) / r.B;
}
function corrLabel(d) {
  if (d.axisCorr) {
    const m = Number(el[d.id].value), eye = Number(el[d.base].value);
    let df = ((m - eye + 90) % 180 + 180) % 180 - 90;          // off-axis error, -90..+90
    return m + "° · " + (df === 0 ? "exact" : (df > 0 ? "+" : "") + df + "°");
  }
  const r = corrRange(d), m = Number(el[d.id].value);
  if (r.zero) return (m > 0 ? "+" : "") + m.toFixed(2) + " D";
  return (r.base < 0 ? "-" : "+") + m.toFixed(2) + " D · " + Math.round(m / r.B * 100) + "%";
}

/* ---------- CONTACTS LENS ---------- */
// Simultaneous-vision contact lens: three adds only, a little haze everywhere (depth of focus), no multifocal / barrel / pincushion distortion,
// and only a quarter of the usual magnification / minification.
const CONTACT_ADDS = [["No", 0, 0, 0], ["Low", 0.5, 0.05, 0.1], ["Med", 1, 0.1, 0.2], ["High", 1.5, 0.15, 0.3]];     // [name, add in D, haze strength in D, spherical shift in D]. "No" = a plain contact lens (no add, no haze, no shift)
// The haze is drawn as a halo: a faint, wide, blurred copy sitting behind the real image, as if the bright parts "bleed" outward.
const HALO_WEIGHT = 5.00;        // halo opacity per 1 D of haze (low 34%, med 67%, high 100% -> capped at HALO_MAX). Was 0.67
const HALO_MAX = 30;
const HALO_RADIUS_BASE = 1, HALO_RADIUS_PER_D = 50;     // halo blur radius in px = base + per_D * haze  (low 10, med 15, high 20). Was 10 per D
const HALO_SHIFT = 2;            // px; set e.g. 3 to push the halo slightly sideways for more of a ghost / double-image look
const CONTACT_MAG = 0.25;        // fraction of the normal magnification / minification that remains (set 0 for none at all)
// The add also works like a spherical shift in the eye's vision (4th number in CONTACT_ADDS): Low +0.25 D, Med +0.50 D, High +0.75 D of extra plus.
// Far gets blurrier (it is now seen as if the eye were that much more myopic), near gets easier (less accommodation needed). Not used on the duo + fan scene.
const contactIndex = D => { let best = 0; CONTACT_ADDS.forEach(([n, a], i) => { if (Math.abs(a - D) <= Math.abs(CONTACT_ADDS[best][1] - D)) best = i; }); return best; };   // nearest add (ties go higher)
const contactLabel = i => { const [n, a] = CONTACT_ADDS[i]; return a ? n + " +" + a.toFixed(2) : n; };
// The Add slider holds the real add in D normally; while Contacts is on it holds 0..3 = No / Low / Med / High.
const getAdd = sim => { const v = Number(sim.el.nearAdd.value); return sim.contactMode ? CONTACT_ADDS[Math.round(v)][1] : v; };
const setAdd = (sim, D) => { sim.el.nearAdd.value = sim.contactMode ? contactIndex(D) : D; };
// While the Contacts lens is on, the Add chip offers only No / Low / Med / High; the Near RX % chip is not used (the add IS the lens).
function syncContacts(sim) {
  const on = sim.lensOn && sim.lensType === "contacts";
  if (on === sim.contactMode) return;
  const D = getAdd(sim);                              // current add in D, read in the old mode
  sim.contactMode = on;
  const d = defById.nearAdd, sl = sim.r("nearAdd"), sc = sim.r("nearAddScale");
  if (on) {
    sl.min = 0; sl.max = 3; sl.step = 1; sl.value = contactIndex(D);
    sc.innerHTML = CONTACT_ADDS.map((_, i) => `<span>${contactLabel(i)}</span>`).join("");
  } else {
    sl.min = d.min; sl.max = d.max; sl.step = d.step; sl.value = D;
    sc.innerHTML = d.s.map(t => `<span>${t}</span>`).join("");
  }
  sim.r("nearCorrectionChip").closest(".chip-wrap").querySelector(".chip").disabled = on;
}
const newFan = () => ({ cx: FAN_CX, cy: FAN_CY, x0: FAN_CX - (FAN_R + 120), y0: FAN_CY - (FAN_R + 120), size: 2 * (FAN_R + 120) });

// Move the scene under the fixed lens; edges are stretched so there is never a blank gap.
function panView(v) {
  const c = v.sctx, dx = Math.max(-W + 2, Math.min(W - 2, v.panX)), dy = Math.max(-H + 2, Math.min(H - 2, v.panY));
  c.clearRect(0, 0, W, H);
  c.drawImage(v.raw, dx, dy);
  if (dx > 0) c.drawImage(v.raw, 0, 0, 1, H, 0, dy, dx, H);
  else if (dx < 0) c.drawImage(v.raw, W - 1, 0, 1, H, W + dx, dy, -dx, H);
  if (dy > 0) c.drawImage(v.sc, 0, dy, W, 1, 0, 0, W, dy);
  else if (dy < 0) c.drawImage(v.sc, 0, H + dy - 1, W, 1, 0, H + dy, W, -dy);
}

// Size the pictures: as big as the free space allows. Never taller than square (so the whole lens stays visible), never wider than 3:2.

const VIEW_MIN_ASPECT = 1;          // 1 = never taller than square, whole lens always visible. Lower (e.g. 0.85) = taller picture, but the left/right ends of the lens get cropped
function layoutViewers() {
  const box = $("rowViews"), gap = 4, cw = box.clientWidth, ch = box.clientHeight;
  if (!cw || !ch) return;
  const portrait = innerHeight > innerWidth;
  const cell = !dual ? [cw, ch] : portrait ? [cw, (ch - gap) / 2] : [(cw - gap) / 2, ch];
  const A = Math.min(1.5, Math.max(VIEW_MIN_ASPECT, cell[0] / cell[1]));      // picture width / height
  const w = Math.min(cell[0], cell[1] * A), h = w / A;
  sims.forEach(s => { const v = s.cv.closest(".viewer"); v.style.width = Math.floor(w) + "px"; v.style.height = Math.floor(h) + "px"; });
}

    btn.addEventListener("click", () => {
      const B = sims[1];

      controlDefs.forEach(d => {
        if (d.pos) return;
        if (d.id !== "nearAdd") B.el[d.id].value = sim.el[d.id].value;
        if (d.corr) B.userSet[d.id] = sim.userSet[d.id];
      });

      B.lensType = sim.lensType;
      B.lensOn = sim.lensOn;
      B.r("lensSwitch").querySelectorAll("button").forEach(b => {
        b.classList.toggle("active", B.lensOn && b.dataset.type === B.lensType);
      });

      B.lensCircle = sim.lensCircle;
      B.r("shapeToggle").classList.toggle("active", B.lensCircle);

      B.boundary = { ...sim.boundary };
      B.r("boundaryControls").querySelectorAll("[data-boundary]").forEach(b => {
        b.classList.toggle("active", !!B.boundary[b.dataset.boundary]);
      });

      syncContacts(B);
      setAdd(B, getAdd(sim));
      updateBoundaryControls(B);

      B.bgKey = ""; B.lvKey = "";
      render(B);
      btn.textContent = "Copied ✓"; setTimeout(() => { btn.textContent = "Copy to B"; }, 900);
    });
  } else {                                            // invisible twin on B so A and B keep the same height and the lens rows line up
    const ph = document.createElement("button");
    ph.type = "button"; ph.className = "chip copy-btn"; ph.textContent = "Copy to B"; ph.tabIndex = -1;
    ph.setAttribute("aria-hidden", "true"); ph.style.visibility = "hidden";
    ph.style.gridRow = 4; ph.style.gridColumn = 4;
    r("grid").appendChild(ph);
  }

  ctrl.querySelectorAll("[data-boundary]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.boundary;
    sim.boundary[k] = !sim.boundary[k];
    b.classList.toggle("active", sim.boundary[k]);
    render(sim);
  }));

  const lensButtons = r("lensSwitch").querySelectorAll("button");
  lensButtons.forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.type;
    if (sim.lensOn && sim.lensType === t) sim.lensOn = false;       // tap the chosen lens again = take the glasses off
    else { sim.lensOn = true; sim.lensType = t; }
    lensButtons.forEach(x => x.classList.toggle("active", sim.lensOn && x === b));
    syncContacts(sim);
    updateBoundaryControls(sim);
    render(sim);
  }));


  r("shapeToggle").addEventListener("click", e => {
    sim.lensCircle = !sim.lensCircle;
    e.currentTarget.classList.toggle("active", sim.lensCircle);
    render(sim);
  });

  // Reset All: this eye only (its chips, lens type, circle). The shared scene / position sliders have their own Reset buttons.
  r("resetAll").addEventListener("click", () => {
    if (sim.lensCircle) r("shapeToggle").click();
    sim.lensOn = false; r("lensSwitch").querySelector('[data-type="far"]').click();
    syncContacts(sim);
    controlDefs.forEach(d => { if (!d.pos) r(d.id + "Reset").click(); });
    closePops();
    render(sim);
  });

  updateBoundaryControls(sim);
  return sim;
}

const EX = 1600;                                   // scenes are drawn this much beyond the edges (zoomed-out view)
const ZK = { computer: 0.7, phone: 0.7, meeting: 0.7, night: 0.6 };   // zoom-out factor per scene (1 = original size)

/* ---------- DRAWING HELPERS ---------- */
const R = (c, x, y, w, h) => { S.fillStyle = c; S.fillRect(x, y, w, h); };
const C = (c, x, y, r) => { S.fillStyle = c; S.beginPath(); S.arc(x, y, r, 0, Math.PI * 2); S.fill(); };
const POLY = (c, pts) => {
  S.fillStyle = c; S.beginPath(); S.moveTo(...pts[0]);
  pts.slice(1).forEach(p => S.lineTo(...p));
  S.closePath(); S.fill();
};
const TXT = (c, font, t, x, y) => { S.fillStyle = c; S.font = font; S.fillText(t, x, y); };
const RR = (c, x, y, w, h, r) => { S.fillStyle = c; S.beginPath(); S.roundRect(x, y, w, h, r); S.fill(); };

/* ---------- SCENE 1: CITY (standing on the right sidewalk, tall buildings both sides, cars at eye level) ---------- */
function drawCityScene() {
  // One-point perspective: x = VX + (X - CAMX)*f/z, y = VY + (h - Y)*f/z. Eye height 1.6 m, so car roofs sit just below eye level.
  const f = 600, h = 1.6, VX = 600, VY = 330, ZE = 40;   // ZE = far end of the street
  const FACE = 7.0;                                       // distance from the road centre to the building faces
  const CAMX = 5.6;                                       // where you stand: right sidewalk (4.9 = at the curb, 0 = middle of the road)
  const P = (X, Y, z) => [VX + (X - CAMX) * f / z, VY + (h - Y) * f / z];
  const Q = (c, pts) => POLY(c, pts.map(p => P(p[0], p[1], p[2])));

  // colour helpers (always return hex): haze toward the sky colour with distance, shade toward black
  const rgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const mixC = (a, b, t) => { const A = rgb(a), B = rgb(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
  const hz = (c, z) => mixC(c, "#D3E0E3", Math.min(0.7, Math.max(0, (z - 8) / 60)));
  const shade = (c, k) => mixC(c, "#000000", k);

  // ---- Sky + ground
  const sky = S.createLinearGradient(0, 0, 0, VY);
  sky.addColorStop(0, "#9CCBE3"); sky.addColorStop(1, "#DCE8EA");
  S.fillStyle = sky; S.fillRect(0, 0, W, VY + 2);
  R("#8D928F", 0, VY, W, H - VY);

  // ---- Far end of the street: a distant tower and a skyline of blocks
  Q(hz("#8FA3A8", 120), [[4.0, 0, 110], [4.0, 62, 110], [6.4, 62, 110], [6.4, 0, 110]]);
  [[-7.0, -3.6, 16, "#7D8F94"], [-3.6, -1.4, 22, "#9AA39A"], [-1.4, 0.6, 12, "#86989C"],
   [0.6, 2.6, 19, "#A39A8C"], [2.6, 4.4, 14, "#7F9296"], [4.4, 7.0, 18, "#98A59E"]].forEach(([x0, x1, Hh, c]) =>
    Q(hz(c, ZE), [[x0, 0, ZE], [x0, Hh, ZE], [x1, Hh, ZE], [x1, 0, ZE]]));

  // ---- Road, sidewalks, curbs, markings
  Q("#4B5052", [[-4.5, 0, 1], [-4.5, 0, ZE], [4.5, 0, ZE], [4.5, 0, 1]]);
  [-1, 1].forEach(sd => {
    Q("#B9B5AA", [[sd * 4.5, 0, 1], [sd * 4.5, 0, ZE], [sd * FACE, 0, ZE], [sd * FACE, 0, 1]]);          // sidewalk
    Q("#D5D1C6", [[sd * 4.4, 0, 1], [sd * 4.4, 0, ZE], [sd * 4.5, 0, ZE], [sd * 4.5, 0, 1]]);            // curb
    Q("#E8E3D6", [[sd * 4.2, 0, 1], [sd * 4.2, 0, ZE], [sd * 4.3, 0, ZE], [sd * 4.3, 0, 1]]);            // edge line
  });
  for (let z = 2; z < ZE; z += 4) Q("#E8E3D6", [[-0.09, 0, z], [0.09, 0, z], [0.09, 0, z + 2], [-0.09, 0, z + 2]]);   // centre dashes
  for (let X = -4.0; X <= 4.0; X += 0.9) Q("#E8E3D6", [[X, 0, 9], [X + 0.45, 0, 9], [X + 0.45, 0, 10.6], [X, 0, 10.6]]);   // crosswalk

  // ---- Tall buildings on both sides: [z start, z end, height m, colour, awning colour]
  const LEFT  = [[2, 13, 40, "#8D9C9C", "#B94A3A"], [13, 22, 55, "#A39A8C", "#3A6656"], [22, 29, 30, "#7E8F96", "#E2B84B"],
                 [29, 36, 44, "#9AA39A", "#D77C55"], [36, ZE, 24, "#8A8F96", "#527A64"]];
  const RIGHT = [[2, 9, 48, "#9AA39A", "#E2B84B"], [9, 17, 36, "#84969A", "#B94A3A"], [17, 25, 52, "#A59B8E", "#3A6656"],
                 [25, 32, 28, "#8D9C9C", "#D77C55"], [32, ZE, 34, "#7E8F96", "#527A64"]];
  const WIN = ["#BFD7DD", "#9CB9C2", "#E6DDA6", "#8FB0BA", "#C9DDE3", "#7E9CA6"];
  const building = (sd, list) => list.forEach(([z0, z1, Hh, base, awn], bi) => {
    const X = sd * FACE, zm = (z0 + z1) / 2, wall = sd < 0 ? shade(base, 0.14) : base;
    Q(hz(wall, zm), [[X, 0, z0], [X, Hh, z0], [X, Hh, z1], [X, 0, z1]]);                       // facade
    Q(hz(shade(base, 0.38), zm), [[X, 0, z0], [X, 3.7, z0], [X, 3.7, z1], [X, 0, z1]]);          // ground floor
    for (let z = z0 + 0.5, k = 0; z + 3.6 <= z1; z += 4.2, k++) {                                // shop windows + awnings
      Q(hz("#7F9AA0", z), [[X, 0.4, z], [X, 2.9, z], [X, 2.9, z + 3.6], [X, 0.4, z + 3.6]]);
      Q(hz("#B8D2D6", z), [[X, 1.6, z + 0.3], [X, 2.8, z + 0.3], [X, 2.8, z + 1.6], [X, 1.6, z + 1.6]]);   // reflection
      Q(hz(k % 2 ? shade(awn, 0.15) : awn, z), [[X, 3.1, z - 0.1], [X, 3.1, z + 3.7], [X - sd * 1.1, 2.55, z + 3.7], [X - sd * 1.1, 2.55, z - 0.1]]);
    }
    for (let fl = 0; ; fl++) {                                                                  // upper floors of windows
      const Ys = 4.2 + fl * 3.4;
      if (Ys + 2.6 > Hh - 0.5) break;
      if (P(X, Ys + 2.6, z0)[1] < -40 && P(X, Ys + 2.6, z1)[1] < -40) break;                    // above the picture: stop
      if (fl % 4 === 3) Q(hz(shade(base, 0.2), zm), [[X, Ys - 0.35, z0], [X, Ys - 0.05, z0], [X, Ys - 0.05, z1], [X, Ys - 0.35, z1]]);
      for (let z = z0 + 0.6, col = 0; z + 1.5 < z1; z += 2.4, col++)
        Q(hz(WIN[(bi * 5 + fl * 3 + col * 7) % 6], z), [[X, Ys + 0.7, z], [X, Ys + 2.6, z], [X, Ys + 2.6, z + 1.5], [X, Ys + 0.7, z + 1.5]]);
    }
  });
  building(-1, LEFT); building(1, RIGHT);

  // ---- Everything on the street, sorted far to near
  const objs = [];
  const wheel = (c, X, Y, zc, r) => {                      // wheel on a car's side (strongly foreshortened)
    const a = P(X, Y, zc - r), b = P(X, Y, zc + r), m = P(X, Y, zc);
    S.fillStyle = c; S.beginPath(); S.ellipse(m[0], m[1], Math.max(1, Math.abs(a[0] - b[0]) / 2), r * f / zc, 0, 0, Math.PI * 2); S.fill();
  };

  // Parked cars along both curbs. You see the rear, the top and the side that faces you.
  const parked = (sd, z0, col) => objs.push({ z: z0, draw() {
    const L = 4.4, xi = sd * 2.7, xo = sd * 4.5, vis = sd > 0 ? xo : xi, ri = xi + sd * 0.15, ro = xo - sd * 0.15, c = x => hz(x, z0 + 2);
    Q(c("#2B2F30"), [[xi, 0.02, z0], [xo, 0.02, z0], [xo, 0.02, z0 + L], [xi, 0.02, z0 + L]]);                    // shadow
    Q(c(col), [[xi, 0.95, z0], [xo, 0.95, z0], [xo, 0.95, z0 + 1.0], [xi, 0.95, z0 + 1.0]]);                      // boot top
    Q(c(col), [[xi, 0.95, z0 + L - 0.9], [xo, 0.95, z0 + L - 0.9], [xo, 0.95, z0 + L], [xi, 0.95, z0 + L]]);      // bonnet top
    Q(c(shade(col, 0.28)), [[vis, 0.3, z0], [vis, 0.95, z0], [vis, 0.95, z0 + L], [vis, 0.3, z0 + L]]);           // body side
    Q(c("#2F3C42"), [[vis, 0.98, z0 + 1.0], [vis, 1.43, z0 + 1.3], [vis, 1.43, z0 + L - 1.5], [vis, 0.98, z0 + L - 0.9]]);   // side windows
    Q(c(shade(col, 0.12)), [[ri, 1.45, z0 + 1.3], [ro, 1.45, z0 + 1.3], [ro, 1.45, z0 + L - 1.5], [ri, 1.45, z0 + L - 1.5]]);   // roof
    Q(c(col), [[xi, 0.3, z0], [xi, 0.95, z0], [xo, 0.95, z0], [xo, 0.3, z0]]);                                    // rear face
    Q(c("#2F3C42"), [[xi + sd * 0.12, 0.98, z0 + 1.0], [xi + sd * 0.2, 1.43, z0 + 1.3], [xo - sd * 0.2, 1.43, z0 + 1.3], [xo - sd * 0.12, 0.98, z0 + 1.0]]);   // rear window
    [[0.1, 0.45], [1.35, 1.7]].forEach(([a, b]) => Q(c("#D9382C"), [[xi + sd * a, 0.62, z0], [xi + sd * a, 0.82, z0], [xi + sd * b, 0.82, z0], [xi + sd * b, 0.62, z0]]));   // tail lights
    wheel(c("#15181A"), vis, 0.33, z0 + 0.95, 0.33); wheel(c("#15181A"), vis, 0.33, z0 + L - 0.95, 0.33);
  }});
  [[2.5, "#4A6FA5"], [9, "#B94A3A"], [15.5, "#E3E0D4"], [22, "#3A6656"], [29, "#C9B36A"], [35, "#8A8F96"]].forEach(([z, c]) => parked(1, z, c));
  [[7, "#E3E0D4"], [13.5, "#354E49"], [20, "#B94A3A"], [27.5, "#8A8F96"], [34, "#D77C55"]].forEach(([z, c]) => parked(-1, z, c));

  // Moving cars: right lane goes away from you (rear view), left lane comes toward you (front view)
  const moving = (X, z, col, front) => objs.push({ z, draw() {
    const xi = X - 0.9, xo = X + 0.9, L = 4.2, c = x => hz(x, z + 1), g = "#2F3C42";
    Q(c("#2B2F30"), [[xi, 0.02, z], [xo, 0.02, z], [xo, 0.02, z + L], [xi, 0.02, z + L]]);                        // shadow
    Q(c(col), [[xi, 0.95, z], [xo, 0.95, z], [xo, 0.95, z + L], [xi, 0.95, z + L]]);                              // top
    Q(c(shade(col, 0.25)), [[xo, 0.3, z], [xo, 0.95, z], [xo, 0.95, z + L], [xo, 0.3, z + L]]);                   // side facing you
    Q(c(g), [[xo - 0.05, 0.98, z + 0.9], [xo - 0.15, 1.43, z + 1.3], [xo - 0.15, 1.43, z + L - 1.4], [xo - 0.05, 0.98, z + L - 0.9]]);   // side glass
    Q(c(shade(col, 0.12)), [[xi + 0.15, 1.43, z + 1.3], [xo - 0.15, 1.43, z + 1.3], [xo - 0.15, 1.43, z + L - 1.4], [xi + 0.15, 1.43, z + L - 1.4]]);   // roof
    Q(c(g), [[xi + 0.1, 0.98, z + 0.9], [xi + 0.2, 1.43, z + 1.3], [xo - 0.2, 1.43, z + 1.3], [xo - 0.1, 0.98, z + 0.9]]);                  // rear / front glass
    Q(c(col), [[xi, 0.3, z], [xi, 0.95, z], [xo, 0.95, z], [xo, 0.3, z]]);                                        // the face you see
    if (front) {
      Q(c("#15181A"), [[X - 0.45, 0.4, z], [X - 0.45, 0.7, z], [X + 0.45, 0.7, z], [X + 0.45, 0.4, z]]);          // grille
      [-1, 1].forEach(s => Q(c("#FFF1C9"), [[X + s * 0.55, 0.62, z], [X + s * 0.55, 0.82, z], [X + s * 0.85, 0.82, z], [X + s * 0.85, 0.62, z]]));   // headlights
    } else {
      [-1, 1].forEach(s => Q(c("#D9382C"), [[X + s * 0.55, 0.62, z], [X + s * 0.55, 0.82, z], [X + s * 0.85, 0.82, z], [X + s * 0.85, 0.62, z]]));   // tail lights
      Q(c("#E8E3D6"), [[X - 0.25, 0.5, z], [X - 0.25, 0.62, z], [X + 0.25, 0.62, z], [X + 0.25, 0.5, z]]);        // plate
    }
    [-1, 1].forEach(s => Q(c("#15181A"), [[X + s * 0.65, 0.0, z], [X + s * 0.65, 0.3, z], [X + s * 0.88, 0.3, z], [X + s * 0.88, 0.0, z]]));    // wheels at the face
    wheel(c("#15181A"), xo, 0.33, z + 0.95, 0.33); wheel(c("#15181A"), xo, 0.33, z + L - 0.95, 0.33);              // wheels on the side
  }});
  moving(1.35, 6, "#B94A3A", false); moving(1.35, 18, "#E3E0D4", false); moving(1.35, 31, "#3A6656", false);
  moving(-1.35, 12, "#354E49", true); moving(-1.35, 24, "#E2B84B", true); moving(-1.35, 37, "#8A8F96", true);

  // Street lamps and trees on the sidewalks (right side stands at the curb, so nothing is in your face)
  const lamp = (sd, z) => objs.push({ z, draw() {
    const lx = sd > 0 ? 4.8 : -5.3, a = P(lx, 0, z), b = P(lx, 6.5, z), t = P(lx - sd * 1.0, 6.8, z);
    S.strokeStyle = hz("#2B3330", z); S.lineCap = "round";
    S.lineWidth = Math.max(1, 0.15 * f / z); S.beginPath(); S.moveTo(a[0], a[1]); S.lineTo(b[0], b[1]); S.lineTo(t[0], t[1]); S.stroke();
    C(hz("#FFF1C9", z), t[0], t[1] + 0.1 * f / z, Math.max(1.5, 0.25 * f / z)); S.lineCap = "butt";
  }});
  const tree = (sd, z) => objs.push({ z, draw() {
    const tx = sd > 0 ? 4.9 : -5.5, a = P(tx, 0, z), b = P(tx, 3.3, z), c = P(tx - sd * 0.1, 4.8, z), r = 2.0 * f / z;
    S.strokeStyle = hz("#665B45", z); S.lineWidth = Math.max(1, 0.35 * f / z);
    S.beginPath(); S.moveTo(a[0], a[1]); S.lineTo(b[0], b[1]); S.stroke();
    C(hz("#426C50", z), c[0], c[1], r); C(hz("#57835C", z), c[0] - r * 0.25, c[1] - r * 0.3, r * 0.6);
  }});
  [10, 21, 32].forEach(z => { lamp(1, z); lamp(-1, z + 5); });
  [12.5, 25, 36].forEach(z => { tree(1, z); tree(-1, z - 4); });

  // People walking on the sidewalks
  const ped = (X, z, shirt, pants) => objs.push({ z, draw() {
    const p = P(X, 0, z), s = f / z;
    R(hz(pants, z), p[0] - 0.18 * s, p[1] - 0.95 * s, 0.36 * s, 0.95 * s);
    R(hz(shirt, z), p[0] - 0.22 * s, p[1] - 1.5 * s, 0.44 * s, 0.6 * s);
    C(hz("#D6A17E", z), p[0], p[1] - 1.63 * s, 0.13 * s);
  }});
  ped(5.0, 14, "#B94A3A", "#2B3330"); ped(6.1, 22, "#E2B84B", "#2B3330"); ped(5.2, 30, "#D77C55", "#354E49");
  ped(-5.0, 9.5, "#3A6656", "#354E49"); ped(-5.3, 18, "#527A64", "#4A4F50");

  objs.sort((a, b) => b.z - a.z).forEach(o => o.draw());

  drawSmallPhone();                                                // same phone, same place as before
}

function glow(x, y, r, rgb, a) {
  const g = S.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  S.fillStyle = g; S.fillRect(x - r, y - r, r * 2, r * 2);
}

    S.beginPath();

    S.stroke();

    POLY("#0C0F11", [[VX - wt, yt], [VX + wt, yt], [VX + wb, yb], [VX - wb, yb]]);
    S.strokeStyle = "rgba(205,210,213,0.55)"; S.lineWidth = Math.max(1, bb * 0.22); S.setLineDash([3, 3]);
    S.beginPath(); S.moveTo(VX - hw(yt + bb / 2), yt + bb / 2); S.lineTo(VX + hw(yt + bb / 2), yt + bb / 2); S.stroke();
    S.setLineDash([]);
    const g = S.createLinearGradient(0, yt, 0, y1);                // tilted tread: catches light at the raised edge, darker toward the low end
    g.addColorStop(0, "rgba(255,255,255,0.28)"); g.addColorStop(1, "rgba(0,0,0,0.3)");
    POLY(g, [[VX - wt, yt], [VX + wt, yt], [VX + w1, y1], [VX - w1, y1]]);

    S.beginPath(); S.moveTo(VX - wt, yt); S.lineTo(VX + wt, yt); S.stroke();

    band(m, 0.88, 1, "#6F6B67");

function regionAt(regs, x, y) {
  for (let i = regs.length - 1; i > 0; i--) {
    const g = regs[i];
    if (x >= g[0] && x < g[0] + g[2] && y >= g[1] && y < g[1] + g[3]) return i;
  }
  return 0;
}
function getSceneDemand() {
