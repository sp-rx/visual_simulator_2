<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIARA OPTOMETRY | Spectacle Lens Distortion</title>
<style>
:root{--bg:#F5F1E8;--panel:#FFFDF7;--green:#3A6656;--green-dark:#2F5547;--text:#292D2A;--muted:#777D77}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.container{max-width:1500px;margin:auto;zoom:0.8}
h2{margin:0 0 2px;font-size:15px;color:var(--green-dark)}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
.panel{background:var(--panel);padding:14px;border-radius:12px;border:1px solid #E5E0D5}

/* Layout: picture (stage) + sliders. Stacked by default, side-by-side on landscape iPad */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stage{container-type:inline-size;min-width:0}

.pos-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.scene-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.scene-blocks{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:14px}
.scene-blocks.dual{grid-template-columns:1fr 1fr}
#dualToggle{flex:none;margin-top:8px}
.pos-row strong{font-size:9px;white-space:nowrap}
.pos-row input[type=range]{flex:1;min-width:0}
.tick{font-size:9px;color:var(--muted)}

.view-row{--vh:min(60vw,60vh);display:flex;gap:6px;align-items:stretch}
@supports (width:1cqw){.view-row{--vh:calc((100cqw - 68px) * 2 / 3)}}
.viewer{flex:1;min-width:0;height:var(--vh);overflow:hidden;position:relative;background:#D9D9D9;border-radius:10px;display:flex;gap:4px}
.cv{position:relative;flex:1;min-width:0;overflow:hidden;background:#D9D9D9}
.cv-tag{position:absolute;left:8px;top:8px;z-index:2;padding:3px 8px;border-radius:999px;background:rgba(41,45,42,.72);color:#fff;font-size:9px;font-weight:bold}
#tagB{left:auto;right:8px}
/* Dual mode: the panel keeps its size; the two pictures shrink to fit side by side inside it */
.viewer.dual{align-items:center}
.viewer.dual .cv{flex:1;aspect-ratio:3/2}
[hidden]{display:none!important}
.stress-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
canvas{position:absolute;width:100%;height:100%;left:0;top:0;display:block;transform-origin:center;transition:transform .2s ease}
.vpos{width:62px;height:var(--vh);display:flex;flex-direction:column;align-items:center;gap:5px}
.vpos strong{font-size:9px}
.vpos .reset-button{padding:1px 4px}
.vtrack{position:relative;flex:1;width:30px}
.vtrack input[type=range]{position:absolute;top:50%;left:50%;margin:0;width:calc(var(--vh) - 130px);transform:translate(-50%,-50%) rotate(90deg);touch-action:pan-x}

.result{height:112px;overflow:auto;margin-top:10px;padding:10px;background:#F5F1E8;border-radius:10px;text-align:center}
.result-main{font-size:11px;font-weight:bold;color:var(--green-dark)}
.result-main,.result-sub{white-space:pre-line}
.result-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}

.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:6px;align-content:start}
.control{padding:4px 0}
.control-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.control-heading strong{font-size:10px}
.value{font-size:10px;font-weight:bold;color:var(--green);white-space:nowrap}
.control-right{display:flex;align-items:center;gap:8px}
.reset-button{border:1px solid #C9D1C9;background:transparent;color:var(--green-dark);padding:0px 8px;border-radius:8px;font-size:9px;height:18px;cursor:pointer}
.reset-button:hover,.reset-button:active{background:#EAEFE9}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* Correction sliders: compact grid, 100-125% shaded red (not recommended) */
.corr-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));column-gap:14px}
.control.corr .control-heading{flex-wrap:wrap;row-gap:2px}
.control.corr .control-heading strong{flex:1 1 100%}
.control.corr .control-right{width:100%;justify-content:space-between}
.control.corr .scale{font-size:9px}
.control input.corr-slider::-webkit-slider-runnable-track{background:linear-gradient(to right,#CBD6CD 0 var(--rp,66%),#E7A9A2 var(--rp,66%) 100%)}
.control input.corr-slider::-moz-range-track{background:linear-gradient(to right,#CBD6CD 0 var(--rp,66%),#E7A9A2 var(--rp,66%) 100%)}

/* Correction sliders switched Off: red scheme */
.control.off input[type=range]::-webkit-slider-thumb{background:#C0392B}
.control.off input[type=range]::-webkit-slider-runnable-track{background:#EBC3BE}
.control.off input[type=range]::-moz-range-thumb{background:#C0392B}
.control.off input[type=range]::-moz-range-track{background:#EBC3BE}
.control.off .value{color:#C0392B}
.control.off .off-button{background:#C0392B;border-color:#C0392B;color:#fff}

.reset-all{grid-column:1/-1;width:100%;height:30px;border:0;border-radius:8px;background:var(--green);color:#fff;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer}
.reset-all:active{background:var(--green-dark)}

.lens-switch button.active{background:var(--green);color:#fff}

/* Floating canvas controls: one toolbar row */
.toolbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:calc(100% - 16px);z-index:3}
.lens-switch,.boundary-controls{display:flex;align-items:center;gap:4px;padding:4px;height:34px;border-radius:999px;white-space:nowrap}
.boundary-controls{display:none}
.lens-switch button{border:0;background:transparent;color:var(--green-dark);font-family:inherit;font-size:10px;font-weight:bold;height:26px;padding:0 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.boundary-controls button{--c:#3A6656;height:26px;padding:0 10px;border:1.5px solid var(--c);border-radius:999px;background:transparent;color:var(--c);font-family:inherit;font-size:9px;font-weight:bold;cursor:pointer;opacity:.6}
.boundary-controls button.active{background:var(--c);color:#fff;opacity:1}
.boundary-controls [data-boundary=far]{--c:#4B9B80}
.boundary-controls [data-boundary=intermediate]{--c:#E2B84B}
.boundary-controls [data-boundary=intermediate].active{color:#3a3000}
.boundary-controls [data-boundary=near]{--c:#D77C55}
.boundary-controls [data-boundary=distortion]{--c:#C0392B}
.zoom-controls{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:5px;padding:5px;border-radius:9px;z-index:4}
.zoom-controls button{height:27px;min-width:27px;border:1px solid #C9D1C9;border-radius:6px;background:var(--green);color:#fff;font-size:13px;font-weight:bold;cursor:pointer}
.zoom-controls #zoomReset{background:transparent;color:var(--green-dark);font-size:9px;padding:0 7px}
#zoomValue{min-width:35px;text-align:center;font-size:9px;font-weight:bold;color:var(--green-dark)}
#dualToggle.active{background:var(--green);color:#fff;border-color:var(--green)}

/* Polish */
.panel{box-shadow:0 6px 24px rgba(41,45,42,.08)}
.viewer{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 2px 10px rgba(41,45,42,.12)}
.lens-switch,.boundary-controls,.zoom-controls{background:rgba(255,253,247,.95);border:1px solid #D8D2C4;box-shadow:0 2px 10px rgba(41,45,42,.15)}
.lens-switch button,.boundary-controls button{transition:background .15s,color .15s}
.control{padding:6px 0;border-bottom:1px solid #F0EBDF}
.result{background:linear-gradient(#F8F4EA,#F3EEE2);border:1px solid #EAE3D3}
input[type=range]::-webkit-slider-thumb{box-shadow:0 1px 5px rgba(0,0,0,.35),0 0 0 1px rgba(58,102,86,.25)}

/* Collapsible prescription panel */
.group{grid-column:1/-1;border:1px solid #E5E0D5;border-radius:10px;background:#FBF8EF;padding:0 12px}
.group-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;padding:10px 0;font-family:inherit;font-size:10px;font-weight:bold;color:var(--green-dark);cursor:pointer;text-align:left}
.group-toggle .chev{font-size:12px;transition:transform .2s}
.group.closed .chev{transform:rotate(-90deg)}
.group-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:6px;padding-bottom:8px}
.group.closed .group-body{display:none}

/* Touch-friendly sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid #fff}

/* Landscape iPad / desktop: picture on the left (stays in view), sliders on the right */
@media (min-width:1000px) and (orientation:landscape){
  .layout{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
  .stage{position:sticky;top:8px}
  .controls,.group-body{grid-template-columns:minmax(0,1fr)}
}
/* Phones */
@media (max-width:600px){
  body{padding:7px}.panel{padding:8px}
  .controls,.group-body{grid-template-columns:minmax(0,1fr)}
}
.scale-wrapper {
  width: 100%;
  transform: scale(0.9);
  transform-origin: top center;
}
.result{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;align-items:center;height:76px;margin-top:8px;padding:6px 10px}
.result-main{font-size:10px}
.result-sub{font-size:9px;line-height:1.35;margin-top:2px}
.result{grid-column:1/-1}
</style>
</head>
<body>

<div class="scale-wrapper">

<div class="container">
  <div class="panel layout">

    <div class="stage">
      <div class="view-row">
        <div class="viewer">
          <div class="cv"><canvas id="canvas" width="1200" height="800"></canvas><span class="cv-tag" id="tagA" hidden></span></div>
          <div class="cv" id="cvB" hidden><canvas id="canvasB" width="1200" height="800"></canvas><span class="cv-tag" id="tagB"></span></div>

          <div class="toolbar">
          <div class="lens-switch" id="lensSwitch">
            <button type="button" data-type="far" class="active">Far Lens</button>
            <button type="button" data-type="near">Near Lens</button>
            <button type="button" data-type="multi">Multifocal Lens</button>
            <button type="button" data-type="office">Office Lens</button>
          </div>
          <div class="boundary-controls" id="boundaryControls">
            <button type="button" data-boundary="far" class="active">Far</button>
            <button type="button" data-boundary="intermediate" class="active">Intermediate</button>
            <button type="button" data-boundary="near" class="active">Near</button>
            <button type="button" data-boundary="distortion" class="active">Distortion</button>
          </div>
          </div>
          <div class="zoom-controls">
            <button type="button" id="zoomOut">&minus;</button><span id="zoomValue">100%</span><button type="button" id="zoomIn">+</button><button type="button" id="zoomReset">Reset</button>
          </div>
        </div>
        <div class="vpos">
          <strong>Vertical</strong>
          <span class="tick">Top</span>
          <div class="vtrack"><input type="range" id="lensVerticalPosition" min="-100" max="200" step="1" value="50"></div>
          <span class="tick">Bottom</span>
          <span class="value" id="lensVerticalPositionValue"></span>
          <button class="reset-button" id="lensVerticalPositionReset">Reset</button>
        </div>
      </div>
      <div class="pos-row">
        <strong>Lens Position</strong>
        <span class="tick">Left</span>
        <input type="range" id="lensPosition" min="-100" max="200" step="1" value="50">
        <span class="tick">Right</span>
        <span class="value" id="lensPositionValue"></span>
        <button class="reset-button" id="lensPositionReset">Reset</button>
      </div>
    </div>

    <div class="group">
      <div class="scene-row">
        <div class="scene-blocks" id="sceneBlocks">
          <div class="control" id="sceneControl">
            <div class="control-heading"><strong>Viewing Scene</strong><span class="value" id="sceneValue"></span></div>
            <input type="range" id="sceneSlider" min="0" max="6" step="1" value="0">
            <div class="scale"><span>City</span><span>Night</span><span>Meeting</span><span>Computer</span><span>Phone</span><span>Duochrome</span><span>Fan</span></div>
          </div>
          <div class="control" id="blockB" hidden>
            <div class="control-heading"><strong>Scene B</strong><span class="value" id="sceneValueB"></span></div>
            <input type="range" id="sceneSliderB" min="0" max="6" step="1" value="4">
            <div class="scale"><span>City</span><span>Night</span><span>Meeting</span><span>Computer</span><span>Phone</span><span>Duochrome</span><span>Fan</span></div>
          </div>
        </div>
        <button class="reset-button" id="dualToggle" type="button">Dual</button>
      </div>
    </div>

    <div class="controls" id="controls">
      <div class="group" id="rxGroup">
        <button class="group-toggle" id="rxToggle" type="button" aria-expanded="true">
          <span>Prescription: Far Lens Power, Accommodation, Cylinder, Axis, Near ADD</span>
          <span class="chev">&#9662;</span>
        </button>
        <div class="group-body" id="rxBody">
        </div>
      </div>
      <div class="corr-grid" id="extraBody"></div>
      <div class="corr-grid" id="corrBody"></div>
    </div>

    <div class="result" id="resultBox"></div>

    <button class="reset-all" id="resetAll" type="button">Reset All</button>

  </div>
</div>
</div>

<script>
/* ---------- CANVASES ---------- */
const W = 1200, H = 800;
let canvas, ctx, sourceCanvas, S, curScene = "city";   // swapped per view by useView()

function makeCanvas(willRead) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  return [c, c.getContext("2d", willRead ? { willReadFrequently: true } : undefined)];
}
const [blurCanvas, blurCtx] = makeCanvas();
const [ghostCanvas, ghostCtx] = makeCanvas();
const [smearCanvas, smearCtx] = makeCanvas();
const lens = { cx: W / 2, cy: H / 2, rx: 390, ry: 230 };

function lensPath(c) {
  c.beginPath();
  c.ellipse(lens.cx, lens.cy, lens.rx, lens.ry, 0, 0, Math.PI * 2);
  c.closePath();
}

/* ---------- AGE <-> ACCOMMODATION (estimate) ---------- */
const AGE_TABLE = [[0.25, 58], [0.5, 53], [1, 49], [2, 43], [3, 38], [4, 33], [5, 27]];   // original gradient, shifted 7 years younger  // [diopters, age]
function ageLabel(acc) {
  if (acc <= AGE_TABLE[0][0]) return AGE_TABLE[0][1] + "+ yrs";
  if (acc >= AGE_TABLE[AGE_TABLE.length - 1][0]) return AGE_TABLE[AGE_TABLE.length - 1][1] + " yrs & below";
  for (let i = 1; i < AGE_TABLE.length; i++) {
    const [a0, y0] = AGE_TABLE[i - 1], [a1, y1] = AGE_TABLE[i];
    if (acc <= a1) return "~" + Math.round(y0 + (acc - a0) / (a1 - a0) * (y1 - y0)) + " yrs";
  }
}

/* ---------- CONTROLS (generated, in this order: left, right, left, right...) ---------- */
const controlDefs = [
  { rx: true, id: "power", label: "Far Lens Power", min: -10, max: 10, step: 0.25, v: 0,
    f: v => (v > 0 ? "+" : "") + v.toFixed(2) + " D", s: ["-10.00 D Myopia", "0.00 D", "+10.00 D Hyperopia"] },
  { rx: true, id: "accommodation", label: "Accommodation (Age)", min: 0.25, max: 5, step: 0.25, v: 3,
    f: v => "+" + v.toFixed(2) + " D · " + ageLabel(v), s: [AGE_TABLE[0][1] + "+ yrs", AGE_TABLE[AGE_TABLE.length - 1][1] + " yrs & below"] },
  { rx: true, id: "cylinder", label: "Cylinder", min: 0, max: 4, step: 0.25, v: 0,
    f: v => v.toFixed(2), s: ["0", "4.00"] },
  { rx: true, id: "axis", label: "Axis", min: 0, max: 180, step: 5, v: 0,
    f: v => v.toFixed(0) + "°", s: ["0°", "90°", "180°"] },
  { id: "lensPosition", label: "Lens Position", min: 0, max: 100, step: 1, v: 50,
    f: v => v + "%", s: ["Left", "Centre", "Right"], pos: true },
  { id: "lensVerticalPosition", label: "Vertical Lens Position", min: 0, max: 100, step: 1, v: 50,
    f: v => v + "%", s: ["Top", "Centre", "Bottom"], pos: true },
  { id: "cylCorrection", label: "Cylinder & Axis Correction", corr: true, base: "cylinder", min: 0, max: 1, step: 0.25, v: 0 },
  { id: "farCorrection", label: "Far Spectacle Correction", corr: true, base: "power", min: 0, max: 1, step: 0.25, v: 0 },
  { rx: true, id: "nearAdd", label: "Near ADD", min: 0, max: 3, step: 0.25, v: 0,
    f: v => "+" + v.toFixed(2) + " D", s: ["0.00 D", "+1.50 D", "+3.00 D"] },
  { id: "nearCorrection", label: "Near ADD Correction", corr: true, base: "nearAdd", min: 0, max: 1, step: 0.25, v: 0 },
  { id: "aspheric", label: "Aspherical Design", min: 0, max: 80, step: 40, v: 0,
    f: v => v.toFixed(0) + "%", s: ["Normal", "Semi-Custom", "Fully Custom"] },
  { id: "enhance", label: "Multifocal Enhancement", min: 0, max: 100, step: 5, v: 0,
    f: v => v + "%", s: ["Standard", "Half", "Clearest"] }
];

const el = {};
const controlsBox = document.getElementById("controls");

const isOff = {};       // correction switched Off (= 0). Corrections start on (100%); the Off button switches one off
const lastVal = {};     // lens value (D) to restore when switched back on (0 = 100% of the base)
const userSet = {};     // true once the slider was moved by hand (otherwise it follows its base at 100%)
const controlDivs = {};
const defById = {};
controlDefs.forEach(d => { defById[d.id] = d; });
const q25 = x => Math.round(x / 0.25) * 0.25;

// A correction slider is the lens actually worn, in 0.25 D steps: from 50% of its base up to 0.50 D (2 steps) over-corrected.
function corrRange(d) {
  const base = Number(el[d.base].value), B = Math.abs(base);
  if (B === 0) return { base, B, lo: 0, hi: 0 };
  return { base, B, lo: Math.max(0.25, q25(0.5 * B)), hi: B + 0.5 };
}
function syncCorrection(d) {
  const slider = el[d.id], r = corrRange(d), sg = r.base < 0 ? "-" : "+";
  const lab = k => document.getElementById(d.id + k);
  if (r.B === 0) { slider.min = 0; slider.max = 0; slider.value = 0; ["Lo", "Mid", "Hi"].forEach(k => lab(k).textContent = "-"); return; }
  const clamp = v => Math.min(r.hi, Math.max(r.lo, v)), prev = Number(slider.value);
  slider.min = r.lo; slider.max = r.hi; slider.step = 0.25;
  slider.value = isOff[d.id] ? r.lo : userSet[d.id] ? clamp(prev) : clamp(r.B);
  slider.style.setProperty("--rp", ((r.B - r.lo) / (r.hi - r.lo) * 100) + "%");     // red shade starts after 100%
  lab("Lo").textContent = sg + r.lo.toFixed(2) + " D";
  lab("Mid").textContent = sg + r.B.toFixed(2) + " D (100%)";
  lab("Hi").textContent = sg + r.hi.toFixed(2) + " D";
}
function corrFraction(d) {                                       // lens value as a fraction of the base (1 = full correction)
  if (isOff[d.id]) return 0;
  const r = corrRange(d);
  return r.B === 0 ? 1 : Number(el[d.id].value) / r.B;
}
function corrLabel(d) {
  if (isOff[d.id]) return "OFF · 0%";
  const r = corrRange(d), m = Number(el[d.id].value);
  return r.B === 0 ? "0.00 D" : (r.base < 0 ? "-" : "+") + m.toFixed(2) + " D · " + Math.round(m / r.B * 100) + "%";
}

controlDefs.forEach(d => {
  let div = null;
  if (!d.pos) {
    div = document.createElement("div");
    div.className = "control";
    div.innerHTML =
      `<div class="control-heading"><strong>${d.label}</strong>
         <div class="control-right"><span class="value" id="${d.id}Value"></span>
         <button class="reset-button" id="${d.id}Reset">Reset</button>
         ${d.corr ? `<button class="reset-button off-button" id="${d.id}Off">Off</button>` : ""}</div></div>
       <input type="range" id="${d.id}" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.v}">
       ${d.corr
         ? `<div class="scale"><span id="${d.id}Lo"></span><span id="${d.id}Mid"></span><span id="${d.id}Hi"></span></div>`
         : `<div class="scale">${d.s.map(t => `<span>${t}</span>`).join("")}</div>`}`;
    (d.corr ? document.getElementById("corrBody") : d.rx ? document.getElementById("rxBody") : document.getElementById("extraBody")).appendChild(div);
  }
  const slider = document.getElementById(d.id);
  el[d.id] = slider;
  const update = d.pos ? updateLensPosition : render;

  if (d.corr) {
    controlDivs[d.id] = div;
    div.classList.add("corr");
    slider.classList.add("corr-slider");
    isOff[d.id] = false; userSet[d.id] = false; lastVal[d.id] = 0;     // starts on, at 100%

    slider.addEventListener("input", () => {   // sliding by hand switches the correction on
      userSet[d.id] = true;
      if (isOff[d.id]) { isOff[d.id] = false; div.classList.remove("off"); }
    });
    document.getElementById(d.id + "Off").addEventListener("click", () => {
      if (isOff[d.id]) {                       // back on at the previous lens value (or 100%)
        isOff[d.id] = false; div.classList.remove("off");
        if (lastVal[d.id]) { slider.value = lastVal[d.id]; userSet[d.id] = true; }
      } else {                                 // switch off
        lastVal[d.id] = userSet[d.id] ? Number(slider.value) : 0; isOff[d.id] = true; div.classList.add("off");
      }
      update();
    });

const R = (c, x, y, w, h) => { S.fillStyle = c; S.fillRect(x, y, w, h); };
const C = (c, x, y, r) => { S.fillStyle = c; S.beginPath(); S.arc(x, y, r, 0, Math.PI * 2); S.fill(); };
const POLY = (c, pts) => {
  S.fillStyle = c; S.beginPath(); S.moveTo(...pts[0]);
  pts.slice(1).forEach(p => S.lineTo(...p));
  S.closePath(); S.fill();
};
const TXT = (c, font, t, x, y) => { S.fillStyle = c; S.font = font; S.fillText(t, x, y); };
const RR = (c, x, y, w, h, r) => { S.fillStyle = c; S.beginPath(); S.roundRect(x, y, w, h, r); S.fill(); };

/* ---------- SCENE 4: DRIVING AT NIGHT ---------- */
function glow(x, y, r, rgb, a) {
  const g = S.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  S.fillStyle = g; S.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawNightScene() {
  const sky = S.createLinearGradient(0, 0, 0, 360);
  sky.addColorStop(0, "#05070F"); sky.addColorStop(1, "#1B2238");
  S.fillStyle = sky; S.fillRect(0, 0, W, 360);
  R("#0B0E14", 0, 360, W, H - 360);

  // Buildings with lit windows
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  [[0, 250, 150], [130, 200, 120], [250, 290, 110], [350, 230, 100], [440, 310, 90],
   [700, 300, 100], [790, 240, 130], [910, 190, 110], [1010, 270, 120], [1120, 220, 100]].forEach(([x, top, w]) => {
    R("#141A28", x, top, w, 370 - top);
    for (let wx = x + 10; wx < x + w - 14; wx += 22)
      for (let wy = top + 12; wy < 350; wy += 26)
        if (rnd() > 0.55) R(rnd() > 0.5 ? "#F3D98B" : "#9CC7E8", wx, wy, 10, 14);
  });

  // Road + edge lines + centre dashes (perspective)
  POLY("#1A1D24", [[570, 360], [630, 360], [1150, 800], [50, 800]]);
  S.strokeStyle = "#8A8F9A"; S.lineWidth = 3;
  S.beginPath(); S.moveTo(570, 360); S.lineTo(50, 800); S.moveTo(630, 360); S.lineTo(1150, 800); S.stroke();
  for (let i = 0; i < 8; i++) {
    const t0 = i / 8, t1 = (i + 0.5) / 8;
    const y0 = 360 + 440 * t0 * t0, y1 = 360 + 440 * t1 * t1;
    const w0 = 1 + 9 * t0 * t0, w1 = 1 + 9 * t1 * t1;
    POLY("#E8D27A", [[600 - w0, y0], [600 + w0, y0], [600 + w1, y1], [600 - w1, y1]]);
  }

  // Street lights (soft warm glow)
  [0.04, 0.14, 0.3, 0.55].forEach(u => {
    const y = 360 + 440 * u;
    [-1, 1].forEach(sd => {
      const ex = 600 + sd * (55 + 545 * u), top = y - (30 + 220 * u), lx = ex - sd * (10 + 30 * u);
      R("#222", ex - 1 - 2 * u, top, 2 + 4 * u, y - top);
      S.globalCompositeOperation = "lighter";
      glow(lx, top, 30 + 90 * u, "255,200,110", 0.45);
      S.globalCompositeOperation = "source-over";
      C("#FFE9B0", lx, top, 2 + 5 * u);
    });
  });

  // Cars: oncoming (right lane, front view) and ahead (left lane, rear view)
  const lane = (u, side) => 600 + side * (30 + 520 * u) / 2;
  const oval = (c, x, y, rx, ry) => { S.fillStyle = c; S.beginPath(); S.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); S.fill(); };

  [[0.06, 1, true, "#2A3040"], [0.1, -1, false, "#4A2024"], [0.22, 1, true, "#3A2F44"],
   [0.32, -1, false, "#28344A"], [0.5, 1, true, "#22303A"]].forEach(([u, side, oncoming, color]) => {
    const yB = 360 + 440 * u, cx = lane(u, side), cw = 14 + 230 * u, ch = cw * 0.55;

    RR("#06070B", cx - cw * 0.5, yB - ch * 0.08, cw, ch * 0.1, 2);                   // shadow under car
    RR(color, cx - cw * 0.5, yB - ch * 0.62, cw, ch * 0.55, cw * 0.08);              // body
    POLY(oncoming ? "#3B4660" : "#1E2330",                                            // windscreen / rear window
         [[cx - cw * 0.38, yB - ch * 0.62], [cx - cw * 0.28, yB - ch], [cx + cw * 0.28, yB - ch], [cx + cw * 0.38, yB - ch * 0.62]]);
    R("#050608", cx - cw * 0.46, yB - ch * 0.12, cw * 0.14, ch * 0.14);              // wheels
    R("#050608", cx + cw * 0.32, yB - ch * 0.12, cw * 0.14, ch * 0.14);

    if (oncoming) R("#11141B", cx - cw * 0.12, yB - ch * 0.36, cw * 0.24, ch * 0.1);  // grille
    else R("#D9D6CC", cx - cw * 0.1, yB - ch * 0.3, cw * 0.2, ch * 0.08);             // number plate

    [-1, 1].forEach(sd => {
      const lx = cx + sd * cw * 0.32, ly = yB - ch * 0.4;
      S.globalCompositeOperation = "lighter";
      if (oncoming) {
        glow(lx, ly, cw * 0.55, "255,235,190", 0.4);
        glow(lx, yB + ch * 0.15, cw * 0.35, "255,235,190", 0.15);                      // road reflection
      } else {
        glow(lx, ly, cw * 0.5, "255,40,30", 0.45);
        glow(lx, yB + ch * 0.15, cw * 0.3, "255,40,30", 0.15);
      }
      S.globalCompositeOperation = "source-over";
      oval(oncoming ? "#FFF1C9" : "#FF4036", lx, ly, cw * 0.09, cw * 0.045);
    });
  });

  // Dashboard + steering wheel
  R("#0A0A0C", 0, 745, W, 55);
  S.strokeStyle = "#15161A"; S.lineWidth = 26;
  S.beginPath(); S.ellipse(600, 900, 340, 170, 0, Math.PI, 2 * Math.PI); S.stroke();
}

/* ---------- SCENE 7: ASTIGMATIC FAN CHART (clock dial) ---------- */
function drawFanScene() {
  R("#FBFAF6", 0, 0, W, H);
  const cx = 600, cy = 405, r0 = 32, r1 = 160;
  S.textAlign = "center"; S.textBaseline = "middle";
  S.strokeStyle = "#111"; S.lineWidth = 5; S.lineCap = "butt";
  for (let k = 0; k < 12; k++) {
    const a = k * Math.PI / 12, ux = Math.sin(a), uy = -Math.cos(a);   // k = 0 is vertical (12 o'clock), then clockwise
    [-1, 1].forEach(sg => {
      S.beginPath(); S.moveTo(cx + sg * ux * r0, cy + sg * uy * r0); S.lineTo(cx + sg * ux * r1, cy + sg * uy * r1); S.stroke();
    });
    if (k % 2 === 0) {                                                 // clock numbers every 30 degrees
      const h = k / 2;
      TXT("#444", "bold 17px Arial", String(h || 12), cx + ux * (r1 + 24), cy + uy * (r1 + 24));
      TXT("#444", "bold 17px Arial", String(h + 6), cx - ux * (r1 + 24), cy - uy * (r1 + 24));
    }
  }
  S.textAlign = "left"; S.textBaseline = "alphabetic";
}

function drawScene() {
  S.clearRect(0, 0, W, H);
  const scene = curScene;
  if (scene === "city") drawCityScene();
  else if (scene === "night") drawNightScene();
  else if (scene === "meeting") drawMeetingScene();
  else if (scene === "computer") drawComputerScene();
  else if (scene === "duo") drawDuoScene();
  else if (scene === "fan") drawFanScene();
  else drawPhoneScene();
}

/* Eye with far point `power` and `accommodation` sees clearly when the demand reaching it lies in [power - accommodation, power].
   Signed result: + = focus falls in front (myopic type), - = focus falls behind (accommodation / hyperopic type), 0 = clear. */
function signedDefocus(power, accommodation, demand) {
  const high = power, low = power - accommodation;
  return demand > high ? demand - high : demand < low ? demand - low : 0;
}
const getResidualDefocus = (power, accommodation, demand) => Math.abs(signedDefocus(power, accommodation, demand));

// Duochrome: red focuses further back than blue. Myopic defocus -> red side clearer; hyperopic -> blue side clearer.
function duoDef(sd, side) {
  const m = Math.abs(sd);
  if (m === 0) return 0;
  return side === (sd > 0 ? "red" : "blue") ? Math.max(0, m - 0.5) : m + 0.5;
}

/* ---------- BLUR (works on Safari / iPad, which ignores ctx.filter) ---------- */
const nativeBlur = (() => {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 9;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.filter = "blur(2px)";
    x.fillStyle = "#fff";
    x.fillRect(4, 4, 1, 1);
    return x.getImageData(2, 4, 1, 1).data[3] > 0;   // blurred pixel spread = filter works
  } catch (e) { return false; }
})();

const tmpCanvases = [];
function tmpCanvas(i, w, h) {
  let c = tmpCanvases[i];
  if (!c) c = tmpCanvases[i] = document.createElement("canvas");
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const x = c.getContext("2d");
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = "high";
  x.clearRect(0, 0, w, h);
  return c;
}

function blurInto(dst, src, r) {
  dst.clearRect(0, 0, W, H);
  if (r <= 0) { dst.drawImage(src, 0, 0); return; }

  if (nativeBlur) {
    dst.filter = `blur(${r}px)`;
    dst.drawImage(src, 0, 0);
    dst.filter = "none";
    return;
  }

  // Fallback: shrink in halving steps, then enlarge back (smooth bilinear blur)
  const k = Math.max(1.5, r * 1.4);
  const chain = [];
  let cur = src, f = 1;
  while (f < k) {
    f = Math.min(f * 2, k);
    const c = tmpCanvas(chain.length, Math.max(1, Math.round(W / f)), Math.max(1, Math.round(H / f)));
    c.getContext("2d").drawImage(cur, 0, 0, c.width, c.height);
    chain.push(c);
    cur = c;
  }
  for (let i = chain.length - 1; i >= 0; i--) {
    if (i === 0) { dst.drawImage(chain[0], 0, 0, W, H); }
    else {
      const t = chain[i - 1];
      const x = t.getContext("2d");
      x.clearRect(0, 0, t.width, t.height);
      x.drawImage(chain[i], 0, 0, t.width, t.height);
    }
  }
}

/* ---------- VISION EFFECTS (blur + cylinder ghosting) ---------- */
function applyVisionEffects(target, blurAmount, cylinder, axis) {
  // 1. Spherical blur
  blurInto(blurCtx, sourceCanvas, blurAmount);

  // 1b. Cylinder blur: smear along the power meridian. Features along it stay sharp, features across it blur,
  //     and in-between angles blur progressively. (The fan chart has its own per-line version.)
  const angle = (axis + 90) * Math.PI / 180;
  const smearLen = curScene === "fan" ? 0 : cylinder * 14;
  let layer = blurCanvas;
  if (smearLen > 0.5) {
    const n = Math.min(fast ? 7 : 15, Math.max(3, Math.ceil(smearLen / 3) + 1)), cs = Math.cos(angle), sn = Math.sin(angle);
    smearCtx.clearRect(0, 0, W, H);
    for (let k = 0; k < n; k++) {
      smearCtx.globalAlpha = 1 / (k + 1);                  // running average of n shifted copies
      const o = (k - (n - 1) / 2) * smearLen / (n - 1);
      smearCtx.drawImage(blurCanvas, cs * o, sn * o);
    }
    smearCtx.globalAlpha = 1;
    layer = smearCanvas;
  }

  // 2. Cylinder doubling: two copies move apart symmetrically.
  //    At zero cylinder both sit on top of each other (one image).
  ghostCtx.clearRect(0, 0, W, H);

  const separation = cylinder * (curScene === "fan" ? 4 : 16);   // total gap between the two images (fan chart: a quarter)
  const secondWeight = Math.min(.5, cylinder * 0.75);    // opacity of the second image (0.5 = equal to the first)
  const ox = Math.cos(angle) * separation / 2;
  const oy = Math.sin(angle) * separation / 2;

  ghostCtx.globalAlpha = 1;
  ghostCtx.drawImage(layer, -ox, -oy);                    // image 1
  ghostCtx.globalAlpha = secondWeight;
  ghostCtx.drawImage(layer, ox, oy);                      // image 2
  ghostCtx.globalAlpha = 1;

  target.clearRect(0, 0, W, H);
  target.drawImage(ghostCanvas, 0, 0);
}

let lensType = "far";     // "far" | "near" | "multi"
let enhFrac = 0;          // Multifocal Enhancement 0..1
const boundaryVisibility = { far: true, intermediate: true, near: true, distortion: true };
// Edge of the clear corridor (fraction of lens half-width) at height t; Enhancement pushes it toward the sides
const ZONES = {                                   // zone boundaries (fraction of lens height) + width of the clear corridor
  multi:  { far: 0.5, mid: 0.65, near: 0.8, edge: t => 0.55 - 0.3 * t },
  office: { far: 0.05, mid: 0.375, near: 0.7, edge: t => 0.55 - 0.3 * t }
};
const sideEdge = t => { const th = ZONES[lensType].edge(t); return th + (0.98 - th) * enhFrac; };

function drawLensGuides() {
  const Z = ZONES[lensType];
  if (!Z) return;
  const { cx, cy, rx, ry } = lens, yAt = t => cy + ry * (2 * t - 1);
  const hline = (t, color) => { ctx.strokeStyle = color; ctx.beginPath(); ctx.moveTo(cx - rx, yAt(t)); ctx.lineTo(cx + rx, yAt(t)); ctx.stroke(); };
  ctx.save(); lensPath(ctx); ctx.clip(); ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
  if (boundaryVisibility.far) hline(Z.far, "#4B9B80");
  if (boundaryVisibility.intermediate) hline(Z.mid, "#E2B84B");
  if (boundaryVisibility.near) hline(Z.near, "#D77C55");
  if (boundaryVisibility.distortion) {
    ctx.setLineDash([7, 6]); ctx.strokeStyle = "#C0392B";
    [-1, 1].forEach(side => {
      ctx.beginPath();
      for (let i = 0; i <= 100; i++) { const t = Z.far + (1 - Z.far) * i / 100, x = cx + side * rx * sideEdge(t), y = yAt(t); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    });
  }
  ctx.restore();
}
const sstep = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };

// Fan chart: blur grows progressively from the good meridian (lines along the doubling direction) to the opposite one.
// Every line is radial, so the line direction at a pixel is its polar angle around the chart centre.
const FAN = { cx: 600, cy: 405, x0: 320, y0: 125, size: 560 };
const fanPool = [];
function fanBackground(target, sphR, cylAmt, axis) {
  const { cx, cy, x0, y0, size } = FAN, cylR = cylAmt * 5, alpha = (axis + 90) * Math.PI / 180, data = [];
  const nL = fast ? 3 : 5, STEP = fast ? 2 : 1;
  for (let i = 0; i < nL; i++) {
    const lv = fanPool[i] || (fanPool[i] = makeCanvas(true));
    applyVisionEffects(lv[1], Math.min(30, sphR + i * cylR / (nL - 1)), 0, axis);   // blur only
    data.push(lv[1].getImageData(x0, y0, size, size).data);
  }
  const gp = fanPool[5] || (fanPool[5] = makeCanvas(true));                          // split (doubled) layer, only sphere blur
  applyVisionEffects(gp[1], Math.min(30, sphR), cylAmt, axis);
  const gd = gp[1].getImageData(x0, y0, size, size).data;
  target.clearRect(0, 0, W, H);
  target.drawImage(fanPool[0][0], 0, 0);
  const img = target.createImageData(size, size), out = img.data;
  for (let y = 0; y < size; y += STEP) {
    for (let x = 0; x < size; x += STEP) {
      const f = Math.abs(Math.sin(Math.atan2(y0 + y - cy, x0 + x - cx) - alpha));
      const L = Math.min(nL - 1.001, f * (nL - 1)), i0 = Math.floor(L), w = L - i0, o = (y * size + x) * 4;
      for (let yy = y; yy < y + STEP && yy < size; yy++) {
        for (let xx = x; xx < x + STEP && xx < size; xx++) {
          const q = (yy * size + xx) * 4;
          for (let c = 0; c < 3; c++) out[q + c] = (data[i0][o + c] * (1 - w) + data[i0 + 1][o + c] * w) * 0.4 + gd[o + c] * 0.6;
          out[q + 3] = 255;
        }
      }
    }
  }
  target.putImageData(img, x0, y0);
}

// Blur with a different radius on the left (red) and right (blue) half of the picture
let halfPool = null;
function applyVisionHalves(target, rl, rr, cylinder, axis) {
  applyVisionEffects(target, rl, cylinder, axis);
  if (rl === rr) return;
  halfPool = halfPool || makeCanvas(true);
  applyVisionEffects(halfPool[1], rr, cylinder, axis);
  target.drawImage(halfPool[0], W / 2, 0, W / 2, H, W / 2, 0, W / 2, H);
}

/* ---------- RENDER ---------- */
// While a slider is moving: a cheaper pass (fewer blur levels, every 2nd pixel). A full-quality pass follows 180 ms after you stop.
let renderPending = false, fast = false, fastTimer = 0;

function schedule() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(doRender);
}
function render() {
  fast = true;
  clearTimeout(fastTimer);
  fastTimer = setTimeout(() => { fast = false; schedule(); }, 180);
  schedule();
}

function renderView(v) {
  const val = id => Number(el[id].value);
  enhFrac = val("enhance") / 300;
  const power = val("power");
  const aspheric = val("aspheric");
  const cylinder = val("cylinder");
  const axis = val("axis");
  const accommodation = val("accommodation");
  const nearAdd = val("nearAdd");
  const farCorr = corrFraction(defById.farCorrection);    // affects the far lens power only
  const cylCorr = corrFraction(defById.cylCorrection);    // affects cylinder + axis only
  const nearCorr = corrFraction(defById.nearCorrection);  // affects the near ADD only

  /* Original (uncorrected) vision: always full power + full cylinder */
  const demand = getSceneDemand();
  const isDuo = curScene === "duo";
  const sideDef = sd => isDuo ? [duoDef(sd, "red"), duoDef(sd, "blue")] : [Math.abs(sd), Math.abs(sd)];   // [left, right] defocus
  const accom = curScene === "duo" ? 0 : accommodation;   // duochrome test: no accommodation, whatever the slider says
  const [bgL, bgR] = sideDef(signedDefocus(power, accom, demand));
  const bgKey = [curScene, bgL.toFixed(3), bgR.toFixed(3), cylinder, axis, fast ? 1 : 0].join("|");
  if (v.bgKey === bgKey) { ctx.clearRect(0, 0, W, H); ctx.drawImage(v.bgCanvas, 0, 0); }
  else {
    if (curScene === "fan" && cylinder > 0) fanBackground(ctx, Math.min(30, bgL * 5), cylinder, axis);
    else applyVisionHalves(ctx, Math.min(30, bgL * 5), Math.min(30, bgR * 5), cylinder, axis);
    v.bgCtx.clearRect(0, 0, W, H); v.bgCtx.drawImage(canvas, 0, 0); v.bgKey = bgKey;
  }

  /* Through the lens */
  const addTotal = nearAdd * nearCorr;                            // the only ADD: full near power
  const intPart = addTotal / 2;                                   // intermediate = the gradient half way between far and near
  const isMulti = !!ZONES[lensType];
  const lensAdd = lensType === "far" ? 0 : addTotal;              // "Near Lens Rx"
  const lensCylinder = cylinder * (1 - cylCorr);

  // The eye sees the scene through lens power L = far correction + local ADD; accommodation only works when L is not enough
  const defsAt = a => sideDef(signedDefocus(power, accom, demand + power * farCorr + a));

  // ADD at a height in the lens (t: 0 = top, 1 = bottom)
  const addAt = t => {
    if (lensType === "far") return 0;
    if (lensType === "near") return addTotal;
    const stops = lensType === "office"
      ? [[0, 0], [0.05, 0], [0.2, intPart], [0.6, intPart], [0.7, addTotal], [1, addTotal]]   // office: far 5% | intermediate 65% | near 30%
      : [[0, 0], [0.5, 0], [0.65, intPart], [0.8, addTotal], [1, addTotal]];                 // multifocal: far 50% | intermediate 30% | near 20%
    for (let i = 1; i < stops.length; i++) {
      if (t <= stops[i][0]) {
        const [t0, a0] = stops[i - 1], [t1, a1] = stops[i];
        return a0 + (a1 - a0) * (t - t0) / (t1 - t0);
      }
    }
    return addTotal;
  };

  /* Title + details */
  const effectivePower = power * farCorr;
  const effectiveCylinder = cylinder * cylCorr;
  const presbyopiaRx = getResidualDefocus(0, accommodation, demand);   // accommodation deficit for this scene
  const rxText = v => (v > 0 ? "+" : "") + v.toFixed(2) + " D";

  const effects = [];
  if (effectivePower < 0) effects.push("Myopic Lens");
  else if (effectivePower > 0) effects.push("Hyperopic Lens");
  if (effectiveCylinder > 0) effects.push("Cylinder Lens");
  if (presbyopiaRx > 0) effects.push("Presbyopia");
  v.title = effects.length ? effects.join(" + ") : "No Rx";
  v.detail =
    "Far Lens Rx: " + rxText(effectivePower) + " | Eye Rx: " + rxText(power) +
    " | Near Lens Rx: " + rxText(lensAdd) + " | Presbyopia Rx: " + rxText(presbyopiaRx);

  // Vision stress: over-correcting the far lens (> 100%) forces extra accommodation.
  // 100% stress = the eye having to use 50% of its accommodation.
  const stress = Math.round(Math.max(0, farCorr - 1) * Math.abs(power) / (0.5 * accommodation) * 100);
  const stressColor = stress <= 50 ? "#2E9B5F" : stress <= 75 ? "#E0A800" : "#C0392B";
  v.detail += '\n<span class="stress-dot" style="background:' + stressColor + '"></span>Vision Stress: ' + stress + "%";

  if (effectivePower === 0 && effectiveCylinder === 0 && lensAdd === 0) { drawLensGuides(); return; }   // lens changes nothing

  /* Lens distortion parameters */
  const effectiveAspheric = aspheric * Math.min(farCorr, 1);
  const magFactor = 1 + effectivePower / 25;
  const radialStrength = effectivePower * 0.085 * (1 - effectiveAspheric / 100);
  const ADD_STRENGTH = 1;                                        // how obvious the plus-lens (ADD) distortion is
  const addRadK = ADD_STRENGTH * 0.085 * (1 - aspheric / 100);
  const cylMag = 1 + effectiveCylinder / 40;                     // stretch along power meridian
  const mAngle = (axis + 90) * Math.PI / 180;
  const mCos = Math.cos(mAngle), mSin = Math.sin(mAngle);

  /* Lens region (+ padding for sampling) */
  const { cx, cy, rx, ry } = lens;
  const xStart = Math.max(0, Math.floor(cx - rx)), xEnd = Math.min(W, Math.ceil(cx + rx));
  const yStart = Math.max(0, Math.floor(cy - ry)), yEnd = Math.min(H, Math.ceil(cy + ry));
  const rw = xEnd - xStart, rh = yEnd - yStart;
  const gx = Math.max(0, xStart - 70), gy = Math.max(0, yStart - 70);
  const gw = Math.min(W, xEnd + 70) - gx, gh = Math.min(H, yEnd + 70) - gy;

  /* Blur levels: sphere blur + residual cylinder ghosting. Multifocal uses 5 levels (blended per pixel). */
  const SIDE_BLUR = 9;                                           // extra sphere blur at the sides of a multifocal
  const isFan = curScene === "fan";
  const cylAmt = Math.abs(lensCylinder), cylAxis = lensCylinder < 0 ? axis + 90 : axis;   // over-correction flips the meridian
  const perPixel = isMulti || isDuo || isFan;                    // blur varies across the lens
  let maxDef = 0;
  for (let k = 0; k <= (isMulti ? 20 : 0); k++) maxDef = Math.max(maxDef, ...defsAt(addAt(k / 20)));
  const rMax = Math.min(30, maxDef * 5 + (isMulti ? SIDE_BLUR : 0) + (isFan ? cylAmt * 5 : 0));
  const nLev = perPixel ? (fast ? 3 : 5) : 1;

  const lvKey = [curScene, nLev, rMax.toFixed(2), cylAmt.toFixed(2), cylAxis, isFan ? 1 : 0, isMulti ? 1 : 0, maxDef.toFixed(2), fast ? 1 : 0].join("|");
  if (v.lvKey !== lvKey) {                                       // rebuild only when something that affects the blur changed
    for (let i = 0; i < nLev; i++) {
      const lv = v.lvPool[i] || (v.lvPool[i] = makeCanvas(true));
      applyVisionEffects(lv[1], nLev === 1 ? rMax : i * rMax / (nLev - 1), isFan ? 0 : cylAmt, cylAxis);   // fan chart: blur only, the split is a separate layer
    }
    if (isFan && cylAmt > 0) {                                   // fan chart: sharp split (doubled) layer
      v.ghostPool = v.ghostPool || makeCanvas(true);
      applyVisionEffects(v.ghostPool[1], Math.min(30, maxDef * 5), cylAmt, cylAxis);
    }
    if (isMulti) {                                               // multifocal sides: directional smear, tilted opposite ways left / right
      const N = fast ? 5 : 9;
      [0.45, -0.45].forEach((ang, k) => {
        const sc = v.smearPool[k] || (v.smearPool[k] = makeCanvas(true)), d2 = sc[1];
        d2.clearRect(0, 0, W, H);
        for (let n = 0; n < N; n++) {
          d2.globalAlpha = 1 / (n + 1);
          const o = (n - (N - 1) / 2) * 24 / (N - 1);
          d2.drawImage(v.lvPool[0][0], Math.cos(ang) * o, Math.sin(ang) * o);
        }
        d2.globalAlpha = 1;
      });
    }
    v.lvKey = lvKey;
  }
  const readRegion = c => c[1].getImageData(gx, gy, gw, gh).data;
  const levelData = v.lvPool.slice(0, nLev).map(readRegion);
  const fanGhostData = (isFan && cylAmt > 0) ? readRegion(v.ghostPool) : null;
  const smearData = isMulti ? v.smearPool.map(readRegion) : [];

  const rowCache = [];                                           // ADD + defocus per lens height
  const rowInfo = t => {
    const k = Math.round(t * 200);
    if (!rowCache[k]) { const a = addAt(k / 200), [dl, dr] = defsAt(a); rowCache[k] = { a, dl, dr }; }
    return rowCache[k];
  };

  const output = ctx.getImageData(xStart, yStart, rw, rh);       // start from the processed background (lens area only)
  const out = output.data;

  const s3 = [0, 0, 0];
  function samp(arr, px, py) {
    const sx = Math.max(0, Math.min(gw - 1, px - gx));
    const sy = Math.max(0, Math.min(gh - 1, py - gy));
    const x0 = Math.floor(sx), y0 = Math.floor(sy);
    const x1 = Math.min(gw - 1, x0 + 1), y1 = Math.min(gh - 1, y0 + 1);
    const fx = sx - x0, fy = sy - y0;
    const p00 = (y0 * gw + x0) * 4, p10 = (y0 * gw + x1) * 4, p01 = (y1 * gw + x0) * 4, p11 = (y1 * gw + x1) * 4;
    for (let c = 0; c < 3; c++) {
      s3[c] = (arr[p00 + c] * (1 - fx) + arr[p10 + c] * fx) * (1 - fy) + (arr[p01 + c] * (1 - fx) + arr[p11 + c] * fx) * fy;
    }
  }

  const STEP = fast ? 2 : 1;                                     // while dragging: compute every 2nd pixel and fill 2x2 blocks
  for (let y = yStart; y < yEnd; y += STEP) {
    const dy = (y - cy) / ry;
    if (dy * dy > 1) continue;
    const t = (dy + 1) / 2, { a, dl, dr } = rowInfo(t);          // ADD + defocus at this height of the lens
    const addMag = 1 + (a * ADD_STRENGTH) / 25, addRad = a * addRadK;

    for (let x = xStart; x < xEnd; x += STEP) {
      const dx = (x - cx) / rx, d2 = dx * dx + dy * dy;
      if (d2 > 1) continue;                                      // outside the lens

      // 1) ADD: plus-lens magnification + pincushion (always hyperopic)
      const ra = 1 + addRad * d2;
      const ax = dx / addMag / ra;
      const ay = dy / addMag / ra;

      // 2) Lens power: magnification + radial distortion
      const rp = 1 + radialStrength * (ax * ax + ay * ay);
      let bx = (ax / magFactor / rp) * rx;
      let by = (ay / magFactor / rp) * ry;

      // 3) Cylinder: stretch the image along the power meridian
      const along = (bx * mCos + by * mSin) / cylMag;
      const perp = -bx * mSin + by * mCos;
      bx = along * mCos - perp * mSin;
      by = along * mSin + perp * mCos;

      let spx = cx + bx, spy = cy + by;

      // Multifocal side aberration: blur + astigmatic "swim" (slanting + sideways stretch), weakened by Enhancement
      let side = 0;
      if (isMulti) {
        side = sstep(sideEdge(t), 1.0, Math.abs(dx)) * Math.min(1, a) * (1 - 0.85 * enhFrac);
        spy += Math.abs(dx) * 80 * side;   // lines slant the same amount on both sides, mirrored (e.g. 30 deg right = 150 deg left)
        spx -= dx * 60 * side;             // image stretches sideways
      }
      let r = (spx < W / 2 ? dl : dr) * 5 + side * SIDE_BLUR;
      if (isFan) r += Math.abs(Math.sin(Math.atan2(spy - FAN.cy, spx - FAN.cx) - (cylAxis + 90) * Math.PI / 180)) * cylAmt * 5;
      const L = (nLev === 1 || rMax <= 0) ? 0 : Math.min(nLev - 1, r / rMax * (nLev - 1));
      const i0 = Math.floor(L), i1 = Math.min(nLev - 1, i0 + 1), f = L - i0;

      samp(levelData[i0], spx, spy);
      let R0 = s3[0], G0 = s3[1], B0 = s3[2];
      if (f > 0.001 && i1 !== i0) {
        samp(levelData[i1], spx, spy);
        R0 += (s3[0] - R0) * f; G0 += (s3[1] - G0) * f; B0 += (s3[2] - B0) * f;
      }
      if (side > 0.02) {                                         // mix in cylindrical (directional) blur
        samp(smearData[dx < 0 ? 0 : 1], spx, spy);
        const m = side * 0.8;
        R0 += (s3[0] - R0) * m; G0 += (s3[1] - G0) * m; B0 += (s3[2] - B0) * m;
      }
      if (fanGhostData) {
        samp(fanGhostData, spx, spy);
        R0 = R0 * 0.4 + s3[0] * 0.6; G0 = G0 * 0.4 + s3[1] * 0.6; B0 = B0 * 0.4 + s3[2] * 0.6;
      }
      for (let yy = y; yy < y + STEP && yy < yEnd; yy++) {
        for (let xx = x; xx < x + STEP && xx < xEnd; xx++) {
          const o = ((yy - yStart) * rw + (xx - xStart)) * 4;
          out[o] = R0; out[o + 1] = G0; out[o + 2] = B0; out[o + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(output, xStart, yStart);

  lensPath(ctx);
  ctx.strokeStyle = "#3A6656"; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.5; ctx.stroke();
  drawLensGuides();
}

function doRender() {
  renderPending = false;
  controlDefs.forEach(d => { if (d.corr) syncCorrection(d); });   // ranges follow the base sliders
  controlDefs.forEach(d => {
    document.getElementById(d.id + "Value").textContent = d.corr ? corrLabel(d) : d.f(Number(el[d.id].value));
  });
  const list = dual ? views : [views[0]];
  list.forEach(v => { useView(v); renderView(v); });
  resultBox.innerHTML = list.map((v, i) =>
    `<div><div class="result-main">${dual ? "AB"[i] + " · " : ""}${v.title}</div><div class="result-sub">${v.detail}</div></div>`).join("");
}

/* ---------- LENS POSITION ---------- */
function updateLensPosition() {
  const h = Number(el.lensPosition.value);
  const v = Number(el.lensVerticalPosition.value);
  lens.cx = lens.rx + (h / 100) * (W - 2 * lens.rx);
  lens.cy = lens.ry + (v / 100) * (H - 2 * lens.ry);
  render();
}

/* ---------- EVENTS + INIT ---------- */
const $ = id => document.getElementById(id);

sliders.forEach((sl, i) => sl.addEventListener("input", () => setScene(i)));

$("dualToggle").addEventListener("click", e => {
  dual = !dual;
  e.currentTarget.classList.toggle("active", dual);
  ["cvB", "blockB", "tagA"].forEach(id => $(id).hidden = !dual);
  $("sceneBlocks").classList.toggle("dual", dual);
  document.querySelector(".viewer").classList.toggle("dual", dual);
  setScene(0);
  if (dual) setScene(1);
});

const updateBoundaryControls = () => { $("boundaryControls").style.display = ZONES[lensType] ? "flex" : "none"; };
document.querySelectorAll("[data-boundary]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.boundary;
  boundaryVisibility[k] = !boundaryVisibility[k];
  b.classList.toggle("active", boundaryVisibility[k]);
  render();
}));

const lensButtons = document.querySelectorAll("#lensSwitch button");
lensButtons.forEach(b => b.addEventListener("click", () => {
  lensType = b.dataset.type;
  lensButtons.forEach(x => x.classList.toggle("active", x === b));
  updateBoundaryControls();
  render();
}));

let canvasZoom = 1;                       // shown as 100% = real 150%
const ZOOM_BASE = 1.5;
const updateZoom = () => {
  views.forEach(v => v.cv.style.transform = `scale(${canvasZoom * ZOOM_BASE})`);
  $("zoomValue").textContent = Math.round(canvasZoom * 100) + "%";
};
$("zoomIn").addEventListener("click", () => { canvasZoom = Math.min(1.5, canvasZoom + 0.25); updateZoom(); });
$("zoomOut").addEventListener("click", () => { canvasZoom = Math.max(0.5, canvasZoom - 0.25); updateZoom(); });
$("zoomReset").addEventListener("click", () => { canvasZoom = 1; updateZoom(); });

// Reset All: sliders, scenes, dual mode, lens type and zoom back to defaults
$("resetAll").addEventListener("click", () => {
  controlDefs.forEach(d => $(d.id + "Reset").click());
  sliders[0].value = 0; sliders[1].value = 4;
  if (dual) $("dualToggle").click();
  document.querySelector('#lensSwitch [data-type="far"]').click();
  canvasZoom = 1; updateZoom();
  setScene(0);
});

setScene(0);
updateLensPosition();
updateBoundaryControls();
updateZoom();
</script>
</body>
</html>
