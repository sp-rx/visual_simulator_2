<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIARA OPTOMETRY | Spectacle Lens Distortion</title>
<style>
:root{--bg:#F5F1E8;--panel:#FFFDF7;--green:#3A6656;--green-dark:#2F5547;--text:#292D2A;--muted:#777D77}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.container{max-width:2200px;margin:auto;zoom:0.72}
h2{margin:0 0 2px;font-size:15px;color:var(--green-dark)}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
.panel{background:var(--panel);padding:14px;border-radius:12px;border:1px solid #E5E0D5}

/* Layout: picture (stage) + controls. Stacked by default, side-by-side on landscape iPad */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stage{min-width:0}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{min-width:0}

.pos-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.scene-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.scene-blocks{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:14px}
.scene-blocks.dual{grid-template-columns:1fr 1fr}
#dualToggle{flex:none;margin-top:8px}
.pos-row strong{font-size:9px;white-space:nowrap}
.pos-row input[type=range]{flex:1;min-width:0}
.tick{font-size:9px;color:var(--muted)}

.view-row{--vh:400px;display:flex;gap:6px;align-items:stretch}
.viewer{flex:1;min-width:0;aspect-ratio:3/2;overflow:hidden;position:relative;background:#D9D9D9;border-radius:10px;display:flex;gap:4px}
.cv{position:relative;flex:1;min-width:0;overflow:hidden;background:#D9D9D9}
.cv-tag{position:absolute;left:8px;top:8px;z-index:2;padding:3px 8px;border-radius:999px;background:rgba(41,45,42,.72);color:#fff;font-size:9px;font-weight:bold}
#tagB{left:auto;right:8px}
.viewer.dual{align-items:center}
.viewer.dual .cv{flex:1;aspect-ratio:3/2}
[hidden]{display:none!important}
.stress-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
canvas{position:absolute;width:100%;height:100%;left:0;top:0;display:block;transform-origin:center;transition:transform .2s ease}
.vpos{width:62px;display:flex;flex-direction:column;align-items:center;gap:5px}
.vpos strong{font-size:9px}
.vpos .reset-button{padding:1px 4px}
.vtrack{position:relative;flex:1;width:30px}
.vtrack input[type=range]{position:absolute;top:50%;left:50%;margin:0;width:calc(var(--vh) - 130px);transform:translate(-50%,-50%) rotate(90deg);touch-action:pan-x}

.result{height:112px;overflow:auto;margin-top:10px;padding:10px;background:#F5F1E8;border-radius:10px;text-align:center}
.result-main{font-size:11px;font-weight:bold;color:var(--green-dark)}
.result-main,.result-sub{white-space:pre-line}
.result-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}

.control{padding:4px 0}
.control-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.control-heading strong{font-size:10px}
.value{font-size:10px;font-weight:bold;color:var(--green);white-space:nowrap}
.control-right{display:flex;align-items:center;gap:8px}
.reset-button{border:1px solid #C9D1C9;background:transparent;color:var(--green-dark);padding:0px 8px;border-radius:8px;font-size:9px;height:18px;cursor:pointer}
.reset-button:hover,.reset-button:active{background:#EAEFE9}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* Correction sliders: 100-125% shaded red (not recommended) */
.control.corr .scale{font-size:9px}
.control input.corr-slider::-webkit-slider-runnable-track{background:linear-gradient(to right,#CBD6CD 0 var(--rp,66%),#E7A9A2 var(--rp,66%) 100%)}
.control input.corr-slider::-moz-range-track{background:linear-gradient(to right,#CBD6CD 0 var(--rp,66%),#E7A9A2 var(--rp,66%) 100%)}

.reset-all{grid-column:1/-1;width:100%;height:30px;border:0;border-radius:8px;background:var(--green);color:#fff;font-family:inherit;font-size:11px;font-weight:bold;cursor:pointer}
.reset-all:active{background:var(--green-dark)}

.lens-switch button.active{background:var(--green);color:#fff}

/* Floating canvas controls: one toolbar row */
.toolbar{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:max-content;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:calc(100% - 16px);z-index:3}
.lens-switch,.boundary-controls{display:flex;align-items:center;gap:4px;padding:4px;height:34px;border-radius:999px;white-space:nowrap}
.boundary-controls{display:none}
.lens-switch button{border:0;background:transparent;color:var(--green-dark);font-family:inherit;font-size:10px;font-weight:bold;height:26px;padding:0 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.boundary-controls button{--c:#3A6656;height:26px;padding:0 10px;border:1.5px solid var(--c);border-radius:999px;background:transparent;color:var(--c);font-family:inherit;font-size:9px;font-weight:bold;cursor:pointer;opacity:.6}
.boundary-controls button.active{background:var(--c);color:#fff;opacity:1}
.boundary-controls [data-boundary=far]{--c:#4B9B80}
.boundary-controls [data-boundary=intermediate]{--c:#E2B84B}
.boundary-controls [data-boundary=intermediate].active{color:#3a3000}
.boundary-controls [data-boundary=near]{--c:#D77C55}
.boundary-controls [data-boundary=distortion]{--c:#C0392B}
.zoom-controls{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:5px;padding:5px;border-radius:9px;z-index:4}
.zoom-controls button{height:27px;min-width:27px;border:1px solid #C9D1C9;border-radius:6px;background:var(--green);color:#fff;font-size:13px;font-weight:bold;cursor:pointer}
.zoom-controls #zoomReset{background:transparent;color:var(--green-dark);font-size:9px;padding:0 7px}
#zoomValue{min-width:35px;text-align:center;font-size:9px;font-weight:bold;color:var(--green-dark)}
#dualToggle.active{background:var(--green);color:#fff;border-color:var(--green)}

/* Polish */
.panel{box-shadow:0 6px 24px rgba(41,45,42,.08)}
.viewer{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 2px 10px rgba(41,45,42,.12)}
.lens-switch,.boundary-controls,.zoom-controls{background:rgba(255,253,247,.95);border:1px solid #D8D2C4;box-shadow:0 2px 10px rgba(41,45,42,.15)}
.lens-switch button,.boundary-controls button{transition:background .15s,color .15s}
.control{padding:6px 0}
.result{background:linear-gradient(#F8F4EA,#F3EEE2);border:1px solid #EAE3D3}
input[type=range]::-webkit-slider-thumb{box-shadow:0 1px 5px rgba(0,0,0,.35),0 0 0 1px rgba(58,102,86,.25)}

.group{grid-column:1/-1;border:1px solid #E5E0D5;border-radius:10px;background:#FBF8EF;padding:0 12px}

/* Slider chips: small buttons that open a floating slider */
.controls{display:flex;flex-direction:column;gap:8px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-wrap{position:static}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 15px;border:1px solid #C9D1C9;border-radius:999px;background:#fff;color:var(--green-dark);font-family:inherit;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap}
.chip .value{font-size:11px}
.chip.open{background:var(--green);border-color:var(--green);color:#fff}
.chip.open .value{color:#fff}
.pop{position:absolute;left:12.5%;z-index:50;width:75%;background:var(--panel);border:1px solid #D8D2C4;border-radius:10px;padding:6px 12px 8px;box-shadow:0 8px 24px rgba(41,45,42,.28)}
.pop .control{border:0;padding:2px 0}
.pop .control-heading{flex-wrap:nowrap}
.pop .control-heading strong{flex:1}
.pop .control-right{width:auto}

/* Touch-friendly sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid #fff}

@media (max-width:600px){
  body{padding:7px}.panel{padding:8px}
}
.scale-wrapper{width:100%}
.result{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;align-items:center;height:76px;margin-top:8px;padding:6px 10px}
.result-main{font-size:10px}
.result-sub{font-size:9px;line-height:1.35;margin-top:2px}
.result{grid-column:1/-1}
</style>
</head>
<body>

<div class="scale-wrapper">

<div class="container">
  <div class="panel layout">

    <div class="stage">
      <div class="view-row">
        <div class="viewer">
          <div class="cv"><canvas id="canvas" width="1200" height="800"></canvas><span class="cv-tag" id="tagA" hidden></span></div>
          <div class="cv" id="cvB" hidden><canvas id="canvasB" width="1200" height="800"></canvas><span class="cv-tag" id="tagB"></span></div>

          <div class="toolbar">
          <div class="lens-switch" id="lensSwitch">
            <button type="button" data-type="far" class="active">Far Lens</button>
            <button type="button" data-type="near">Near Lens</button>
            <button type="button" data-type="multi">Multifocal Lens</button>
            <button type="button" data-type="office">Office Lens</button>
          </div>
          <div class="boundary-controls" id="boundaryControls">
            <button type="button" data-boundary="far">Far</button>
            <button style="display:none" type="button" data-boundary="intermediate">Intermediate</button>
            <button type="button" data-boundary="near">Near</button>
            <button type="button" data-boundary="distortion">Distortion</button>
          </div>
          </div>
          <div class="zoom-controls">
            <button type="button" id="zoomOut">&minus;</button><span id="zoomValue">100%</span><button type="button" id="zoomIn">+</button><button type="button" id="zoomReset">Reset</button>
          </div>
        </div>
        <div class="vpos">
          <strong>Vertical</strong>
          <span class="tick">Top</span>
          <div class="vtrack"><input type="range" id="lensVerticalPosition" min="-100" max="200" step="1" value="50"></div>
          <span class="tick">Bottom</span>
          <span class="value" id="lensVerticalPositionValue"></span>
          <button class="reset-button" id="lensVerticalPositionReset">Reset</button>
        </div>
      </div>
      <div class="pos-row">
        <strong>Horizontal</strong>
        <span class="tick">Left</span>
        <input type="range" id="lensPosition" min="-100" max="200" step="1" value="50">
        <span class="tick">Right</span>
        <span class="value" id="lensPositionValue"></span>
        <button class="reset-button" id="lensPositionReset">Reset</button>
      </div>
    </div>

    <div class="side">
    <div class="group">
      <div class="scene-row">
        <div class="scene-blocks" id="sceneBlocks">
          <div class="control" id="sceneControl">
            <div class="control-heading"><strong>Viewing Scene</strong><span class="value" id="sceneValue"></span></div>
            <input type="range" id="sceneSlider" min="0" max="8" step="1" value="0">
            <div class="scale"><span>City</span><span>Escalator</span><span>Aisle</span><span>Night</span><span>Meeting</span><span>Computer</span><span>Phone</span><span>Duochrome</span><span>Fan</span></div>
          </div>
          <div class="control" id="blockB" hidden>
            <div class="control-heading"><strong>Scene B</strong><span class="value" id="sceneValueB"></span></div>
            <input type="range" id="sceneSliderB" min="0" max="8" step="1" value="6">
            <div class="scale"><span>City</span><span>Escalator</span><span>Aisle</span><span>Night</span><span>Meeting</span><span>Computer</span><span>Phone</span><span>Duochrome</span><span>Fan</span></div>
          </div>
        </div>
        <button class="reset-button" id="dualToggle" type="button">Dual</button>
      </div>
    </div>

    <div class="controls" id="controls">
      <div class="chips" id="rxBody"></div>
      <div class="chips" id="extraBody"></div>
      <div class="chips" id="corrBody"></div>
    </div>

    <div class="result" id="resultBox"></div>

    <button class="reset-all" id="resetAll" type="button">Reset All</button>
    </div>

  </div>
</div>
</div>

<script>
/* ---------- CANVASES ---------- */
const W = 1200, H = 800;
let canvas, ctx, sourceCanvas, S, curScene = "city";   // swapped per view by useView()
let panX = 0, panY = 0;                                 // how far the view (scene) is moved; the lens stays in the middle

function makeCanvas(willRead) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  return [c, c.getContext("2d", willRead ? { willReadFrequently: true } : undefined)];
}
const [blurCanvas, blurCtx] = makeCanvas();
const [ghostCanvas, ghostCtx] = makeCanvas();
const [smearCanvas, smearCtx] = makeCanvas();
const lens = { cx: W / 2, cy: H / 2, rx: 390, ry: 230 };

function lensPath(c) {
  c.beginPath();
  c.ellipse(lens.cx, lens.cy, lens.rx, lens.ry, 0, 0, Math.PI * 2);
  c.closePath();
}

/* ---------- AGE <-> ACCOMMODATION (estimate) ---------- */
const AGE_TABLE = [[0.25, 58], [0.5, 53], [1, 49], [2, 43], [3, 38], [4, 33], [5, 27]];   // [diopters, age]
function ageLabel(acc) {
  if (acc <= AGE_TABLE[0][0]) return AGE_TABLE[0][1] + "+ yrs";
  if (acc >= AGE_TABLE[AGE_TABLE.length - 1][0]) return AGE_TABLE[AGE_TABLE.length - 1][1] + " yrs & below";
  for (let i = 1; i < AGE_TABLE.length; i++) {
    const [a0, y0] = AGE_TABLE[i - 1], [a1, y1] = AGE_TABLE[i];
    if (acc <= a1) return "~" + Math.round(y0 + (acc - a0) / (a1 - a0) * (y1 - y0)) + " yrs";
  }
}

/* ---------- CONTROLS ---------- */
const controlDefs = [
  { rx: true, id: "power", label: "Far Lens Power", min: -10, max: 10, step: 0.25, v: 0,
    f: v => (v > 0 ? "+" : "") + v.toFixed(2) + " D", s: ["-10.00 D Myopia", "0.00 D", "+10.00 D Hyperopia"] },
  { rx: true, id: "accommodation", label: "Accommodation (Age)", min: 0.25, max: 5, step: 0.25, v: 3,
    f: v => "+" + v.toFixed(2) + " D · " + ageLabel(v), s: [AGE_TABLE[0][1] + "+ yrs", AGE_TABLE[AGE_TABLE.length - 1][1] + " yrs & below"] },
  { rx: true, id: "cylinder", label: "Cylinder", min: 0, max: 4, step: 0.25, v: 0,
    f: v => v.toFixed(2), s: ["0", "4.00"] },
  { rx: true, id: "axis", label: "Axis", min: 0, max: 180, step: 5, v: 0,
    f: v => v.toFixed(0) + "°", s: ["0°", "90°", "180°"] },
  { id: "lensPosition", label: "Horizontal", min: 0, max: 100, step: 1, v: 50,
    f: v => v + "%", s: ["Left", "Centre", "Right"], pos: true },
  { id: "lensVerticalPosition", label: "Vertical", min: 0, max: 100, step: 1, v: 50,
    f: v => v + "%", s: ["Top", "Centre", "Bottom"], pos: true },
  { id: "cylCorrection", label: "Cylinder & Axis Correction", corr: true, base: "cylinder", min: 0, max: 1, step: 0.25, v: 0 },
  { id: "farCorrection", label: "Far Spectacle Correction", corr: true, base: "power", min: 0, max: 1, step: 0.25, v: 0 },
  { rx: true, id: "nearAdd", label: "Near ADD", min: 0, max: 3, step: 0.25, v: 0,
    f: v => "+" + v.toFixed(2) + " D", s: ["0.00 D", "+1.50 D", "+3.00 D"] },
  { id: "nearCorrection", label: "Near ADD Correction", corr: true, base: "nearAdd", min: 0, max: 1, step: 0.25, v: 0 },
  { id: "aspheric", label: "Aspherical Design", min: 0, max: 80, step: 40, v: 0,
    f: v => v.toFixed(0) + "%", s: ["Normal", "Semi-Custom", "Fully Custom"] },
  { id: "enhance", label: "Multifocal Enhancement", min: 0, max: 100, step: 5, v: 0,
    f: v => v + "%", s: ["Standard", "Half", "Clearest"] }
];

const SHORT = { power: "Far RX", accommodation: "AA Age", cylinder: "Cyl Rx", axis: "Axis", nearAdd: "Add", aspheric: "Aspheric", enhance: "MF Enhance", cylCorrection: "Cyl + Axis %", farCorrection: "Far RX %", nearCorrection: "Near RX %" };
const el = {};
const isOff = {};       // kept for the correction maths (always false now: the lens tabs control the frame)
const lastVal = {};
const userSet = {};     // true once the slider was moved by hand (otherwise it follows its base at 100%)
const controlDivs = {};
const defById = {};
controlDefs.forEach(d => { defById[d.id] = d; });
const q25 = x => Math.round(x / 0.25) * 0.25;

// A correction slider is the lens actually worn, in 0.25 D steps: from 50% of its base up to 0.50 D (2 steps) over-corrected.
function corrRange(d) {
  const base = Number(el[d.base].value), B = Math.abs(base);
  if (B === 0) return { base, B, lo: 0, hi: 0 };
  return { base, B, lo: Math.max(0.25, q25(0.5 * B)), hi: B + 0.5 };
}
function syncCorrection(d) {
  const slider = el[d.id], r = corrRange(d), sg = r.base < 0 ? "-" : "+";
  const lab = k => document.getElementById(d.id + k);
  if (r.B === 0) { slider.min = 0; slider.max = 0; slider.value = 0; ["Lo", "Mid", "Hi"].forEach(k => lab(k).textContent = "-"); return; }
  const clamp = v => Math.min(r.hi, Math.max(r.lo, v)), prev = Number(slider.value);
  slider.min = r.lo; slider.max = r.hi; slider.step = 0.25;
  slider.value = userSet[d.id] ? clamp(prev) : clamp(r.B);
  slider.style.setProperty("--rp", ((r.B - r.lo) / (r.hi - r.lo) * 100) + "%");     // red shade starts after 100%
  lab("Lo").textContent = sg + r.lo.toFixed(2) + " D";
  lab("Mid").textContent = sg + r.B.toFixed(2) + " D (100%)";
  lab("Hi").textContent = sg + r.hi.toFixed(2) + " D";
}
function corrFraction(d) {                                       // lens value as a fraction of the base (1 = full correction)
  const r = corrRange(d);
  return r.B === 0 ? 1 : Number(el[d.id].value) / r.B;
}
function corrLabel(d) {
  const r = corrRange(d), m = Number(el[d.id].value);
  return r.B === 0 ? "0.00 D" : (r.base < 0 ? "-" : "+") + m.toFixed(2) + " D · " + Math.round(m / r.B * 100) + "%";
}

// Slider chips: one floating slider open at a time
function closePops(except) {
  document.querySelectorAll(".chip-wrap").forEach(w => {
    if (w !== except) { w.querySelector(".pop").hidden = true; w.querySelector(".chip").classList.remove("open"); }
  });
}

controlDefs.forEach(d => {
  let div = null;
  if (!d.pos) {
    div = document.createElement("div");
    div.className = "control";
    div.innerHTML =
      `<div class="control-heading"><strong>${d.label}</strong>
         <div class="control-right"><span class="value" id="${d.id}Value"></span><button class="reset-button" id="${d.id}Reset">Reset</button></div></div>
       <input type="range" id="${d.id}" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.v}">
       ${d.corr
         ? `<div class="scale"><span id="${d.id}Lo"></span><span id="${d.id}Mid"></span><span id="${d.id}Hi"></span></div>`
         : `<div class="scale">${d.s.map(t => `<span>${t}</span>`).join("")}</div>`}`;

    const wrap = document.createElement("div");
    wrap.className = "chip-wrap";
    wrap.innerHTML = `<button type="button" class="chip"><span>${SHORT[d.id]}</span><span class="value" id="${d.id}Chip"></span></button>`;
    const pop = document.createElement("div");
    pop.className = "pop"; pop.hidden = true;
    pop.appendChild(div);
    wrap.appendChild(pop);
    const row1 = ["power", "cylinder", "axis"].includes(d.id);          // row 1: Far RX, Cyl Rx, Axis | row 2: the rest | row 3: corrections
    (d.corr ? document.getElementById("corrBody") : row1 ? document.getElementById("rxBody") : document.getElementById("extraBody")).appendChild(wrap);

    const chip = wrap.querySelector(".chip");
    chip.addEventListener("click", () => {
      const open = pop.hidden;
      closePops(wrap);
      pop.hidden = !open;
      chip.classList.toggle("open", open);
      if (open) pop.style.top = (wrap.offsetTop + wrap.offsetHeight + 6) + "px";   // just under the chip
    });
  }
  const slider = document.getElementById(d.id);
  el[d.id] = slider;
  const update = d.pos ? updateLensPosition : render;

  if (d.corr) {
    controlDivs[d.id] = div;
    div.classList.add("corr");
    slider.classList.add("corr-slider");
    isOff[d.id] = false; userSet[d.id] = false; lastVal[d.id] = 0;     // starts at 100%

    slider.addEventListener("input", () => { userSet[d.id] = true; });
    document.getElementById(d.id + "Reset").addEventListener("click", () => {
      userSet[d.id] = false; lastVal[d.id] = 0; update();
    });
  } else {
    document.getElementById(d.id + "Reset").addEventListener("click", () => { slider.value = d.v; update(); });
  }
  slider.addEventListener("input", update);
});

const resultBox = document.getElementById("resultBox");
const SCENES = [["city", "City View"], ["escalator", "Going Down an Escalator"], ["market", "Supermarket Aisle"],
                ["night", "Driving at Night"], ["meeting", "Meeting Room"],
                ["computer", "Working at Computer"], ["phone", "Looking at Phone"],
                ["duo", "Duochrome (Red / Blue)"], ["fan", "Astigmatic Fan Chart"]];
const sceneName = k => SCENES.find(x => x[0] === k)[1];
const sliders = [document.getElementById("sceneSlider"), document.getElementById("sceneSliderB")];
let dual = false;

// Two views (A, B): each has its own canvas + scene; the lens, eye and sliders are shared.
// raw = the scene as drawn; sc = the scene moved by the Horizontal / Vertical sliders (what the eye looks at).
const views = [0, 1].map(i => {
  const cv = document.getElementById(i ? "canvasB" : "canvas"), [sc, sctx] = makeCanvas();
  const [rawC, rawS] = makeCanvas();
  const [bgCanvas, bgCtx] = makeCanvas();                                  // cache of the processed background
  return { cv, ctx: cv.getContext("2d", { willReadFrequently: true }), sc, sctx, raw: rawC, rawS, scene: "city", title: "", detail: "", bgCanvas, bgCtx, bgKey: "", lvKey: "", lvPool: [], smearPool: [], ghostPool: null, regPool: [] };
});
function useView(v) { canvas = v.cv; ctx = v.ctx; sourceCanvas = v.sc; S = v.rawS; curScene = v.scene; }

// Move the scene under the fixed lens; edges are stretched so there is never a blank gap.
function panView(v) {
  const c = v.sctx, dx = Math.max(-W + 2, Math.min(W - 2, panX)), dy = Math.max(-H + 2, Math.min(H - 2, panY));
  c.clearRect(0, 0, W, H);
  c.drawImage(v.raw, dx, dy);
  if (dx > 0) c.drawImage(v.raw, 0, 0, 1, H, 0, dy, dx, H);
  else if (dx < 0) c.drawImage(v.raw, W - 1, 0, 1, H, W + dx, dy, -dx, H);
  if (dy > 0) c.drawImage(v.sc, 0, dy, W, 1, 0, 0, W, dy);
  else if (dy < 0) c.drawImage(v.sc, 0, H + dy - 1, W, 1, 0, H + dy, W, -dy);
}

function setScene(i) {
  const v = views[i], idx = Number(sliders[i].value);
  v.scene = SCENES[idx][0];
  document.getElementById(i ? "sceneValueB" : "sceneValue").textContent = (dual ? (i ? "B: " : "A: ") : "") + SCENES[idx][1];
  document.getElementById(i ? "tagB" : "tagA").textContent = (i ? "B · " : "A · ") + SCENES[idx][1];
  useView(v); drawScene(); panView(v); v.bgKey = ""; v.lvKey = ""; render();
}

const EX = 1600;                                   // scenes are drawn this much beyond the edges (zoomed-out view)
const ZK = { computer: 0.7, phone: 0.7, meeting: 0.7, night: 0.6 };   // zoom-out factor per scene (1 = original size)

/* ---------- DRAWING HELPERS ---------- */
const R = (c, x, y, w, h) => { S.fillStyle = c; S.fillRect(x, y, w, h); };
const C = (c, x, y, r) => { S.fillStyle = c; S.beginPath(); S.arc(x, y, r, 0, Math.PI * 2); S.fill(); };
const POLY = (c, pts) => {
  S.fillStyle = c; S.beginPath(); S.moveTo(...pts[0]);
  pts.slice(1).forEach(p => S.lineTo(...p));
  S.closePath(); S.fill();
};
const TXT = (c, font, t, x, y) => { S.fillStyle = c; S.font = font; S.fillText(t, x, y); };
const RR = (c, x, y, w, h, r) => { S.fillStyle = c; S.beginPath(); S.roundRect(x, y, w, h, r); S.fill(); };

/* ---------- SCENE 4: DRIVING AT NIGHT ---------- */
function glow(x, y, r, rgb, a) {
  const g = S.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  S.fillStyle = g; S.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawNightScene() {
  // ---- Outside world (drawn well beyond the edges, because the view is zoomed out)
  const sky = S.createLinearGradient(0, 0, 0, 360);
  sky.addColorStop(0, "#05070F"); sky.addColorStop(1, "#1B2238");
  S.fillStyle = sky; S.fillRect(-EX, -EX, W + 2 * EX, EX + 360);
  R("#0B0E14", -EX, 360, W + 2 * EX, H + EX);

  // stars
  let s2 = 7;
  const r2 = () => (s2 = (s2 * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 110; i++) {
    const sz = r2() < 0.15 ? 2 : 1;
    R("rgba(255,255,255," + (0.35 + r2() * 0.5).toFixed(2) + ")", -400 + r2() * 2000, -260 + r2() * 480, sz, sz);
  }
  // moon (seen through the right side window)
  S.globalCompositeOperation = "lighter"; glow(1330, 130, 110, "190,205,255", 0.35); S.globalCompositeOperation = "source-over";
  C("#E8EEF8", 1330, 130, 34); C("#D3DBEA", 1318, 120, 8); C("#D3DBEA", 1342, 142, 6); C("#D3DBEA", 1339, 114, 4);

  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  [[0, 250, 150], [130, 200, 120], [250, 290, 110], [350, 230, 100], [440, 310, 90],
   [700, 300, 100], [790, 240, 130], [910, 190, 110], [1010, 270, 120], [1120, 220, 100],
   [-380, 240, 130], [-250, 200, 120], [-130, 280, 130], [1200, 250, 130], [1320, 210, 120], [1440, 290, 130]].forEach(([x, top, w]) => {
    R("#141A28", x, top, w, 370 - top);
    for (let wx = x + 10; wx < x + w - 14; wx += 22)
      for (let wy = top + 12; wy < 350; wy += 26)
        if (rnd() > 0.55) R(rnd() > 0.5 ? "#F3D98B" : "#9CC7E8", wx, wy, 10, 14);
  });

  POLY("#1A1D24", [[570, 360], [630, 360], [1386, 1000], [-186, 1000]]);
  S.strokeStyle = "#8A8F9A"; S.lineWidth = 3;
  S.beginPath(); S.moveTo(570, 360); S.lineTo(-186, 1000); S.moveTo(630, 360); S.lineTo(1386, 1000); S.stroke();
  for (let i = 0; i < 11; i++) {
    const t0 = i / 8, t1 = (i + 0.5) / 8;
    const y0 = 360 + 440 * t0 * t0, y1 = 360 + 440 * t1 * t1;
    const w0 = 1 + 9 * t0 * t0, w1 = 1 + 9 * t1 * t1;
    POLY("#E8D27A", [[600 - w0, y0], [600 + w0, y0], [600 + w1, y1], [600 - w1, y1]]);
  }

  [0.04, 0.14, 0.3, 0.55, 0.85, 1.2].forEach(u => {
    const y = 360 + 440 * u;
    [-1, 1].forEach(sd => {
      const ex = 600 + sd * (55 + 545 * u), top = y - (30 + 220 * u), lx = ex - sd * (10 + 30 * u);
      R("#222", ex - 1 - 2 * u, top, 2 + 4 * u, y - top);
      S.globalCompositeOperation = "lighter";
      glow(lx, top, 30 + 90 * u, "255,200,110", 0.45);
      S.globalCompositeOperation = "source-over";
      C("#FFE9B0", lx, top, 2 + 5 * u);
    });
  });

  const lane = (u, side) => 600 + side * (30 + 520 * u) / 2;
  const oval = (c, x, y, rx, ry) => { S.fillStyle = c; S.beginPath(); S.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); S.fill(); };

  [[0.06, 1, true, "#2A3040"], [0.1, -1, false, "#4A2024"], [0.22, 1, true, "#3A2F44"],
   [0.32, -1, false, "#28344A"], [0.5, 1, true, "#22303A"]].forEach(([u, side, oncoming, color]) => {
    const yB = 360 + 440 * u, cx = lane(u, side), cw = 14 + 230 * u, ch = cw * 0.55;

    RR("#06070B", cx - cw * 0.5, yB - ch * 0.08, cw, ch * 0.1, 2);
    RR(color, cx - cw * 0.5, yB - ch * 0.62, cw, ch * 0.55, cw * 0.08);
    POLY(oncoming ? "#3B4660" : "#1E2330",
         [[cx - cw * 0.38, yB - ch * 0.62], [cx - cw * 0.28, yB - ch], [cx + cw * 0.28, yB - ch], [cx + cw * 0.38, yB - ch * 0.62]]);
    R("#050608", cx - cw * 0.46, yB - ch * 0.12, cw * 0.14, ch * 0.14);
    R("#050608", cx + cw * 0.32, yB - ch * 0.12, cw * 0.14, ch * 0.14);

    if (oncoming) R("#11141B", cx - cw * 0.12, yB - ch * 0.36, cw * 0.24, ch * 0.1);
    else R("#D9D6CC", cx - cw * 0.1, yB - ch * 0.3, cw * 0.2, ch * 0.08);

    [-1, 1].forEach(sd => {
      const lx = cx + sd * cw * 0.32, ly = yB - ch * 0.4;
      S.globalCompositeOperation = "lighter";
      if (oncoming) {
        glow(lx, ly, cw * 0.55, "255,235,190", 0.4);
        glow(lx, yB + ch * 0.15, cw * 0.35, "255,235,190", 0.15);
      } else {
        glow(lx, ly, cw * 0.5, "255,40,30", 0.45);
        glow(lx, yB + ch * 0.15, cw * 0.3, "255,40,30", 0.15);
      }
      S.globalCompositeOperation = "source-over";
      oval(oncoming ? "#FFF1C9" : "#FF4036", lx, ly, cw * 0.09, cw * 0.045);
    });
  });

  // ---- Car interior, drawn over the outside world
  // roof / headliner + dome light
  R("#08090C", -EX, -EX, W + 2 * EX, EX + 40);
  POLY("#08090C", [[0, 40], [W, 40], [900, 70], [300, 70]]);
  RR("#14161A", 520, -90, 160, 56, 12); RR("#2B2E36", 530, -80, 140, 36, 8);

  // left side of the car; the right side is the same, mirrored
  [false, true].forEach(flip => {
    S.save();
    if (flip) { S.translate(W, 0); S.scale(-1, 1); }
    R("#08090C", -EX, -EX, EX - 340, 2 * EX);                   // body beyond the side window
    R("#0B0C10", -340, 560, 340, EX);                           // door panel
    R("#1A1D24", -340, 556, 340, 6);                            // window trim

/* ---------- SCENE 8: GOING DOWN AN ESCALATOR (same small phone as the City view) ---------- */
// Mall around you; the escalator drops away below the horizon. Dark ribbed treads with silver grooves, a ridged dark band
// on every step, yellow edge segments that break at each step (left and right deliberately out of step), black skirts,
// brushed-steel side panels with black handrails.
function drawEscalatorScene() {
  const VX = 600, HZ = 270, YF = 440, YN = 800;                    // centre, horizon, far end of the steps, near edge
  const yAt = u => YF + (YN - YF) * Math.pow(u, 1.7);
  const hw = y => 80 + 1.528 * (y - YF);                           // half-width of the steps at screen height y (straight edges)
  const rh = y => 25 + 0.625 * (y - YF);                           // handrail height above the step edge

  // Mall at the lower level far ahead: ceiling, shop fronts
  const bg = S.createLinearGradient(0, 0, 0, HZ);
  bg.addColorStop(0, "#EDE8DC"); bg.addColorStop(1, "#D9D2C3");
  S.fillStyle = bg; S.fillRect(0, 0, W, HZ);
  for (let i = 0; i < 6; i++) R("#FFFDF7", 80 + i * 200, 18, 120, 10);
  [[40, 120, 200, "#3A6656", "CAFE"], [280, 140, 180, "#D77C55", "BOOKS"],
   [740, 140, 180, "#E2B84B", "OPTICAL"], [960, 120, 200, "#527A64", "SHOES"]].forEach(([x, y, w, c, t]) => {
    R("#CFC6B6", x, y, w, HZ - y); R(c, x, y, w, 34);
    TXT("#FFFDF7", "bold 16px Arial", t, x + 12, y + 24);
    R("#A9C7D0", x + 12, y + 50, w - 24, 70);
  });
  R("#3A6656", 520, 40, 160, 40); TXT("#FFFDF7", "bold 16px Arial", "LEVEL 1  \u2193", 548, 66);

  // Far lower floor, tile lines converging on the horizon
  R("#BFB6A6", 0, HZ, W, YF - HZ);
  S.strokeStyle = "#B2A998"; S.lineWidth = 2;
  for (let k = -6; k <= 6; k++) { S.beginPath(); S.moveTo(VX, HZ); S.lineTo(VX + k * 260, YF); S.stroke(); }
  for (let i = 1; i <= 7; i++) { const y = HZ + (YF - HZ) * Math.pow(i / 7, 2); S.beginPath(); S.moveTo(0, y); S.lineTo(W, y); S.stroke(); }

  // Upper-level floor around the escalator (your level)
  R("#D8D0C2", 0, YF, W, H - YF);

  // Steps, far (low) to near (high)
  const yel = (m, ya, yb) => {                                     // one yellow edge segment on one side
    if (yb - ya < 1) return;
    const wa = hw(ya), wb = hw(yb);
    POLY("#E3D12B", [[VX + m * wa, ya], [VX + m * wa * 0.95, ya], [VX + m * wb * 0.95, yb], [VX + m * wb, yb]]);
  };
  const N = 14;
  for (let i = 0; i < N; i++) {
    const y0 = yAt(i / N), y1 = yAt((i + 1) / N);
    const yt = i > 0 ? y0 - 0.75 * (y1 - y0) : y0;                  // each step's far edge is lifted: it rises over the step below
    const w1 = hw(y1), wt = hw(yt), L = y1 - yt, d = i / N;
    if (i > 0) {                                                   // shadow on the lower step, right behind the raised edge
      const ys = yt - 0.035 * (y1 - y0), ws = hw(ys);
      POLY("rgba(5,8,10,0.95)", [[VX - ws, ys], [VX + ws, ys], [VX + wt, yt], [VX - wt, yt]]);
    }
    POLY("#14181B", [[VX - wt, yt], [VX + wt, yt], [VX + w1, y1], [VX - w1, y1]]);
    S.strokeStyle = "#C3C8CC"; S.lineWidth = 0.7 + 2.2 * d; S.lineCap = "butt";            // fine silver grooves down the slope
    S.beginPath();
    for (let k = -49; k <= 49; k++) { const f = k * 0.02; S.moveTo(VX + f * wt, yt); S.lineTo(VX + f * w1, y1); }
    S.stroke();
    const bb = L * 0.14, yb = yt + bb, wb = hw(yb);                                         // dark ridged band at the step edge
    POLY("#0C0F11", [[VX - wt, yt], [VX + wt, yt], [VX + wb, yb], [VX - wb, yb]]);
    S.strokeStyle = "rgba(205,210,213,0.55)"; S.lineWidth = Math.max(1, bb * 0.22); S.setLineDash([3, 3]);
    S.beginPath(); S.moveTo(VX - hw(yt + bb / 2), yt + bb / 2); S.lineTo(VX + hw(yt + bb / 2), yt + bb / 2); S.stroke();
    S.setLineDash([]);
    const g = S.createLinearGradient(0, yt, 0, y1);                // tilted tread: catches light at the raised edge, darker toward the low end
    g.addColorStop(0, "rgba(255,255,255,0.28)"); g.addColorStop(1, "rgba(0,0,0,0.3)");
    POLY(g, [[VX - wt, yt], [VX + wt, yt], [VX + w1, y1], [VX - w1, y1]]);
    POLY("rgba(20,25,30," + (0.35 * (1 - d)).toFixed(2) + ")", [[VX - wt, yt], [VX + wt, yt], [VX + w1, y1], [VX - w1, y1]]);   // deeper = darker
    S.strokeStyle = "rgba(255,255,255,0.65)"; S.lineWidth = 2.5;                             // bright lip on the raised edge
    S.beginPath(); S.moveTo(VX - wt, yt); S.lineTo(VX + wt, yt); S.stroke();
    yel(-1, yb + 0.03 * L, y1 - 0.14 * L);                         // left: starts right after the band, breaks before the next step
    yel(1, yb + 0.24 * L, y1 - 0.02 * L);                          // right: shifted down, so the two sides never line up
  }
  R("#8E9397", VX - 80, YF - 6, 160, 6);                           // comb plate at the bottom landing

  // Black skirts, brushed-steel side panels, black handrails (the rail sits above the step edge)
  const U2 = 1.08, Yb = yAt(U2);
  const pt = (m, u, t) => { const y = yAt(u), h = hw(y), lx = VX + m * 1.05 * h, ux = VX + m * 1.06 * h; return [lx + (ux - lx) * t, y - rh(y) * t]; };
  const band = (m, t0, t1, c) => POLY(c, [pt(m, 0, t0), pt(m, U2, t0), pt(m, U2, t1), pt(m, 0, t1)]);
  [-1, 1].forEach(m => {
    POLY("#1A1F22", [[VX + m * hw(YF), YF], [VX + m * 1.05 * hw(YF), YF], [VX + m * 1.05 * hw(Yb), Yb], [VX + m * hw(Yb), Yb]]);
    band(m, 0, 1, "#A9A39C");
    band(m, 0.12, 0.3, "rgba(231,201,196,0.55)");
    band(m, 0.5, 0.68, "#F2ECE6");
    band(m, 0.88, 1, "#6F6B67");
    band(m, 1, 1.22, "#15181A");
    band(m, 1, 1.04, "rgba(255,255,255,0.25)");
  });

  drawSmallPhone();                                                // same phone, same place as the City view
}

/* ---------- SCENE 9: SUPERMARKET AISLE (white square floor tiles with lines; same small phone) ---------- */
function drawMarketScene() {
  const f = 600, h = 1.6, VX = 600, VY = 330, ZE = 14, HW = 1.2;   // simple perspective: x = VX + X*f/z, y = VY + (h-Y)*f/z
  const P = (X, Y, z) => [VX + X * f / z, VY + (h - Y) * f / z];

  R("#ECECE8", 0, 0, W, H);                                        // ceiling
  R("#F6F6F2", 0, VY, W, H - VY);                                  // white floor

  // Square tiles: lines running along the aisle + lines across it, spaced equally in depth
  S.strokeStyle = "#B4B8B5"; S.lineWidth = 2;
  for (let k = -3; k <= 3; k++) {
    const a = P(k * 0.6, 0, ZE), b = P(k * 0.6, 0, 1.0);
    S.beginPath(); S.moveTo(a[0], a[1]); S.lineTo(b[0], b[1]); S.stroke();
  }
  for (let z = 1.0; z <= ZE; z += 0.6) {
    const a = P(-HW, 0, z), b = P(HW, 0, z);
    S.beginPath(); S.moveTo(a[0], a[1]); S.lineTo(b[0], b[1]); S.stroke();
  }

  // End wall + a produce display + banner
  POLY("#E8E3D6", [P(-HW, 0, ZE), P(-HW, 3.2, ZE), P(HW, 3.2, ZE), P(HW, 0, ZE)]);
  POLY("#D9534F", [P(-0.9, 2.9, ZE), P(-0.9, 2.3, ZE), P(0.9, 2.3, ZE), P(0.9, 2.9, ZE)]);
  [["#E2B84B", -0.8], ["#57835C", -0.3], ["#D77C55", 0.2], ["#B94A3A", 0.6]].forEach(([c, X]) =>
    POLY(c, [P(X, 0, ZE), P(X, 0.8, ZE), P(X + 0.4, 0.8, ZE), P(X + 0.4, 0, ZE)]));

  // Shelving on both sides, packed with products
  const cols = ["#D9534F", "#3A6656", "#E2B84B", "#4A90C2", "#F2F2EE", "#D77C55", "#7A5C9E", "#57835C"];
  [-1, 1].forEach(sd => {
    const X = sd * HW;
    POLY("#E8E3D6", [P(X, 2.5, 1.0), P(X, 3.2, 1.0), P(X, 3.2, ZE), P(X, 2.5, ZE)]);     // wall above shelves
    POLY("#5B6468", [P(X, 0, 1.0), P(X, 2.5, 1.0), P(X, 2.5, ZE), P(X, 0, ZE)]);         // shelf body
    for (let l = 0; l < 5; l++) {
      const Yb = 0.12 + l * 0.5;
      let z = 1.0, m = 0;
      while (z < ZE) {
        const z2 = Math.min(ZE, z * 1.12), zE = Math.min(ZE, z * 1.10);
        const Yt = Yb + 0.22 + 0.16 * ((m * 7 + l) % 3) / 2;
        POLY(cols[(m * 3 + l * 5 + (sd > 0 ? 2 : 0)) % cols.length], [P(X, Yb, z), P(X, Yt, z), P(X, Yt, zE), P(X, Yb, zE)]);
        z = z2; m++;
      }
    }
  });

  // Ceiling light panels + hanging aisle sign
  for (let z = 1.6; z < ZE; z *= 1.5)
    POLY("#FFFFFF", [P(-0.5, 3.2, z), P(0.5, 3.2, z), P(0.5, 3.2, z * 1.25), P(-0.5, 3.2, z * 1.25)]);
  const sg = P(-0.5, 2.95, 6), sg2 = P(0.5, 2.55, 6);
  R("#3A6656", sg[0], sg[1], sg2[0] - sg[0], sg2[1] - sg[1]);
  TXT("#FFFDF7", "bold 13px Arial", "AISLE 7", sg[0] + 12, sg[1] + 26);

  drawSmallPhone();                                                // same phone, same place as the City view
}

function drawScene() {
  S.clearRect(0, 0, W, H);
  const scene = curScene, zk0 = ZK[scene];
  if (zk0) { S.save(); S.translate(600, 400); S.scale(zk0, zk0); S.translate(-600, -400); }
  if (scene === "city") drawCityScene();
  else if (scene === "night") drawNightScene();
  else if (scene === "meeting") drawMeetingScene();
  else if (scene === "computer") drawComputerScene();
  else if (scene === "duo") drawDuoScene();
  else if (scene === "fan") drawFanScene();
  else if (scene === "escalator") drawEscalatorScene();
  else if (scene === "market") drawMarketScene();
  else drawPhoneScene();
  if (zk0) S.restore();
}

const REGIONS = {

  dst.clearRect(0, 0, W, H);

  if (nativeBlur) {
    dst.filter = `blur(${r}px)`;
    dst.drawImage(src, 0, 0);
    dst.filter = "none";
    return;
  }

  const k = Math.max(1.5, r * 1.4);

  while (f < k) {
    f = Math.min(f * 2, k);
    const c = tmpCanvas(chain.length, Math.max(1, Math.round(W / f)), Math.max(1, Math.round(H / f)));
    c.getContext("2d").drawImage(cur, 0, 0, c.width, c.height);
    chain.push(c);
    cur = c;

  for (let i = chain.length - 1; i >= 0; i--) {
    if (i === 0) { dst.drawImage(chain[0], 0, 0, W, H); }
    else {
      const t = chain[i - 1];
      const x = t.getContext("2d");
      x.clearRect(0, 0, t.width, t.height);
      x.drawImage(chain[i], 0, 0, t.width, t.height);

    const p00 = (y0 * gw + x0) * 4, p10 = (y0 * gw + x1) * 4, p01 = (y1 * gw + x0) * 4, p11 = (y1 * gw + x1) * 4;
    for (let c = 0; c < 3; c++) {
      s3[c] = (arr[p00 + c] * (1 - fx) + arr[p10 + c] * fx) * (1 - fy) + (arr[p01 + c] * (1 - fx) + arr[p11 + c] * fx) * fy;
    }
  }

  const STEP = 1;
  for (let y = yStart; y < yEnd; y += STEP) {
    const dy = (y - cy) / ry;
    if (dy * dy > 1) continue;
    const t = (dy + 1) / 2, a = rowInfo(t, 0).a;                 // ADD at this height of the lens
    const addMag = 1 + (a * ADD_STRENGTH) / 25, addRad = a * addRadK;

    for (let x = xStart; x < xEnd; x += STEP) {
      const dx = (x - cx) / rx, d2 = dx * dx + dy * dy;
      if (d2 > 1) continue;

      // 1) ADD: plus-lens magnification + pincushion
      const ra = 1 + addRad * d2;
      const ax = dx / addMag / ra;
      const ay = dy / addMag / ra;

      // 2) Lens power: magnification + radial distortion
      const rp = 1 + radialStrength * (ax * ax + ay * ay);
      let bx = (ax / magFactor / rp) * rx;
      let by = (ay / magFactor / rp) * ry;

      // 3) Cylinder: stretch the image along the power meridian
      const along = (bx * mCos + by * mSin) / cylMag;
      const perp = -bx * mSin + by * mCos;
      bx = along * mCos - perp * mSin;
      by = along * mSin + perp * mCos;

      let spx = cx + bx, spy = cy + by;

      // Multifocal side aberration
      let side = 0;
      if (isMulti) {
        side = sstep(sideEdge(t), 1.0, Math.abs(dx)) * Math.min(1, a) * (1 - 0.85 * enhFrac);
        spy += Math.abs(dx) * 80 * side;
        spx -= dx * 60 * side;
      }
      const ri = regs ? regionAt(regs, (spx - panX - 600) / zk + 600, (spy - panY - 400) / zk + 400) : 0;   // which focal distance this part of the scene has
      const rr_ = rowInfo(t, ri);
      let r = (spx < W / 2 + panX ? rr_.dl : rr_.dr) * 5 + side * SIDE_BLUR;
      if (isFan) r += Math.abs(Math.sin(Math.atan2(spy - FAN.cy, spx - FAN.cx) - (cylAxis + 90) * Math.PI / 180)) * cylAmt * 5;
      const L = (nLev === 1 || rMax <= 0) ? 0 : Math.min(nLev - 1, r / rMax * (nLev - 1));
      const i0 = Math.floor(L), i1 = Math.min(nLev - 1, i0 + 1), f = L - i0;

      samp(levelData[i0], spx, spy);
      let R0 = s3[0], G0 = s3[1], B0 = s3[2];
      if (f > 0.001 && i1 !== i0) {
        samp(levelData[i1], spx, spy);
        R0 += (s3[0] - R0) * f; G0 += (s3[1] - G0) * f; B0 += (s3[2] - B0) * f;
      }
      if (side > 0.02) {
        samp(smearData[dx < 0 ? 0 : 1], spx, spy);
        const m = side * 0.8;
        R0 += (s3[0] - R0) * m; G0 += (s3[1] - G0) * m; B0 += (s3[2] - B0) * m;
      }
      if (fanGhostData) {
        samp(fanGhostData, spx, spy);
        R0 = R0 * 0.4 + s3[0] * 0.6; G0 = G0 * 0.4 + s3[1] * 0.6; B0 = B0 * 0.4 + s3[2] * 0.6;
      }
      for (let yy = y; yy < y + STEP && yy < yEnd; yy++) {
        for (let xx = x; xx < x + STEP && xx < xEnd; xx++) {
          const o = ((yy - yStart) * rw + (xx - xStart)) * 4;
          out[o] = R0; out[o + 1] = G0; out[o + 2] = B0; out[o + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(output, xStart, yStart);
  drawLensFrame();
  drawLensGuides();
}

function doRender() {
  renderPending = false;
  controlDefs.forEach(d => { if (d.corr) syncCorrection(d); });
  controlDefs.forEach(d => {
    const full = d.corr ? corrLabel(d) : d.f(Number(el[d.id].value));
    const vEl = document.getElementById(d.id + "Value");
    if (vEl.textContent !== full) vEl.textContent = full;
    const cEl = document.getElementById(d.id + "Chip");
    if (cEl) {                                                    // compact value on the chip
      const pr = full.split(" · "), c = (d.corr || d.id === "accommodation" ? pr[pr.length - 1] : pr[0]).replace(" D", "");
      if (cEl.textContent !== c) cEl.textContent = c;
    }
  });
  const list = dual ? views : [views[0]];
  list.forEach(v => { useView(v); renderView(v); });
  const html = list.map((v, i) =>
    `<div><div class="result-main">${dual ? "AB"[i] + " · " : ""}${v.title}</div><div class="result-sub">${v.detail}</div></div>`).join("");
  if (html !== doRender.last) { resultBox.innerHTML = html; doRender.last = html; }
}

/* ---------- VIEW POSITION (the lens stays in the middle, the scene moves) ---------- */
function updateLensPosition() {
  const h = Number(el.lensPosition.value);
  const v = Number(el.lensVerticalPosition.value);
  panX = Math.round(-(h - 50) / 100 * (W - 2 * lens.rx));
  panY = Math.round(-(v - 50) / 100 * (H - 2 * lens.ry));
  FAN.cx = 600 + panX; FAN.cy = 405 + panY;
  FAN.x0 = Math.max(0, Math.min(W - FAN.size, 320 + panX));
  FAN.y0 = Math.max(0, Math.min(H - FAN.size, 125 + panY));
  views.forEach(vw => { vw.bgKey = ""; vw.lvKey = ""; panView(vw); });
  render();
}

/* ---------- EVENTS + INIT ---------- */
const $ = id => document.getElementById(id);

sliders.forEach((sl, i) => sl.addEventListener("input", () => setScene(i)));

$("dualToggle").addEventListener("click", e => {
  dual = !dual;
  e.currentTarget.classList.toggle("active", dual);
  ["cvB", "blockB", "tagA"].forEach(id => $(id).hidden = !dual);
  $("sceneBlocks").classList.toggle("dual", dual);
  document.querySelector(".viewer").classList.toggle("dual", dual);
  setScene(0);
  if (dual) setScene(1);
});

// Tap / click anywhere outside a chip or its slider popup closes the open popup
document.addEventListener("pointerdown", e => {
  if (!e.target.closest(".chip-wrap")) closePops();
});

const updateBoundaryControls = () => { $("boundaryControls").style.display = ZONES[lensType] && lensOn ? "flex" : "none"; };
document.querySelectorAll("[data-boundary]").forEach(b => b.addEventListener("click", () => {
  const k = b.dataset.boundary;
  boundaryVisibility[k] = !boundaryVisibility[k];
  b.classList.toggle("active", boundaryVisibility[k]);
  render();
}));

const lensButtons = document.querySelectorAll("#lensSwitch button");
lensButtons.forEach(b => b.addEventListener("click", () => {
  const t = b.dataset.type;
  if (lensOn && lensType === t) lensOn = false;            // tap the chosen lens again = take the glasses off
  else { lensOn = true; lensType = t; }
  lensButtons.forEach(x => x.classList.toggle("active", lensOn && x === b));
  updateBoundaryControls();
  render();
}));

let canvasZoom = 1;                       // shown as 100% = real 150%
const ZOOM_BASE = 1.5;
const updateZoom = () => {
  views.forEach(v => v.cv.style.transform = `scale(${canvasZoom * ZOOM_BASE})`);
  $("zoomValue").textContent = Math.round(canvasZoom * 100) + "%";
};
$("zoomIn").addEventListener("click", () => { canvasZoom = Math.min(1.5, canvasZoom + 0.25); updateZoom(); });
$("zoomOut").addEventListener("click", () => { canvasZoom = Math.max(0.5, canvasZoom - 0.25); updateZoom(); });
$("zoomReset").addEventListener("click", () => { canvasZoom = 1; updateZoom(); });

// Reset All: sliders, scenes, dual mode, lens type and zoom back to defaults
$("resetAll").addEventListener("click", () => {
  controlDefs.forEach(d => $(d.id + "Reset").click());
  sliders[0].value = 0; sliders[1].value = 6;
  if (dual) $("dualToggle").click();
  lensOn = false; document.querySelector('#lensSwitch [data-type="far"]').click();
  closePops();
  canvasZoom = 1; updateZoom();
  setScene(0);
});

// Keep the vertical slider as long as the picture, whatever the page width / orientation
const viewRow = document.querySelector(".view-row"), viewerEl = document.querySelector(".viewer");
const fitVSlider = () => viewRow.style.setProperty("--vh", viewerEl.offsetHeight + "px");
new ResizeObserver(fitVSlider).observe(viewerEl);
window.addEventListener("orientationchange", () => setTimeout(fitVSlider, 250));
fitVSlider();

setScene(0);
updateLensPosition();
updateBoundaryControls();
updateZoom();
</script>
</body>
</html>
