<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIARA OPTOMETRY | Spectacle Lens Distortion</title>
<style>
:root{--bg:#F5F1E8;--panel:#FFFDF7;--green:#3A6656;--green-dark:#2F5547;--text:#292D2A;--muted:#777D77}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding:10px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.container{max-width:1500px;margin:auto;zoom:0.8}
h2{margin:0 0 2px;font-size:15px;color:var(--green-dark)}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:10px}
.panel{background:var(--panel);padding:14px;border-radius:12px;border:1px solid #E5E0D5}

/* Layout: picture (stage) + sliders. Stacked by default, side-by-side on landscape iPad */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stage{container-type:inline-size;min-width:0}

.pos-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pos-row strong{font-size:9px;white-space:nowrap}
.pos-row input[type=range]{flex:1;min-width:0}
.tick{font-size:9px;color:var(--muted)}

.view-row{--vh:min(60vw,60vh);display:flex;gap:6px;align-items:stretch}
@supports (width:1cqw){.view-row{--vh:calc((100cqw - 68px) * 2 / 3)}}
.viewer{flex:1;min-width:0;height:var(--vh);overflow:hidden;position:relative;background:#D9D9D9;border-radius:10px}
canvas{position:absolute;width:100%;height:100%;left:0;top:0;display:block}
.vpos{width:62px;height:var(--vh);display:flex;flex-direction:column;align-items:center;gap:5px}
.vpos strong{font-size:9px}
.vpos .reset-button{padding:6px 8px}
.vtrack{position:relative;flex:1;width:30px}
.vtrack input[type=range]{position:absolute;top:50%;left:50%;margin:0;width:calc(var(--vh) - 130px);transform:translate(-50%,-50%) rotate(90deg);touch-action:pan-x}

.result{margin-top:10px;padding:10px;background:#F5F1E8;border-radius:10px;text-align:center}
.result-main{font-size:11px;font-weight:bold;color:var(--green-dark)}
.result-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}

.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:6px;align-content:start}
.control{padding:4px 0}
.control-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.control-heading strong{font-size:10px}
.value{font-size:10px;font-weight:bold;color:var(--green);white-space:nowrap}
.control-right{display:flex;align-items:center;gap:8px}
.reset-button{border:1px solid #C9D1C9;background:transparent;color:var(--green-dark);padding:6px 12px;border-radius:8px;font-size:9px;min-height:15px;cursor:pointer}
.reset-button:hover,.reset-button:active{background:#EAEFE9}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* Touch-friendly sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--green);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#CBD6CD}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid #fff}

/* Landscape iPad / desktop: picture on the left (stays in view), sliders on the right */
@media (min-width:1000px) and (orientation:landscape){
  .layout{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
  .stage{position:sticky;top:8px}
  .controls{grid-template-columns:minmax(0,1fr)}
}
/* Phones */
@media (max-width:600px){
  body{padding:7px}.panel{padding:8px}
  .controls{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<div class="container">
  <h2>KIARA OPTOMETRY</h2>
  <div class="subtitle">Spectacle Lens Distortion Simulator</div>
  <div class="panel layout">

    <div class="stage">
      <div class="pos-row">
        <strong>Lens Position</strong>
        <span class="tick">Left</span>
        <input type="range" id="lensPosition" min="0" max="100" step="1" value="50">
        <span class="tick">Right</span>
        <span class="value" id="lensPositionValue"></span>
        <button class="reset-button" id="lensPositionReset">Reset</button>
      </div>
      <div class="view-row">
        <div class="viewer"><canvas id="canvas" width="1200" height="800"></canvas></div>
        <div class="vpos">
          <strong>Vertical</strong>
          <span class="tick">Top</span>
          <div class="vtrack"><input type="range" id="lensVerticalPosition" min="0" max="100" step="1" value="50"></div>
          <span class="tick">Bottom</span>
          <span class="value" id="lensVerticalPositionValue"></span>
          <button class="reset-button" id="lensVerticalPositionReset">Reset</button>
        </div>
      </div>
      <div class="result">
        <div class="result-main" id="effectDisplay">No distortion</div>
        <div class="result-sub" id="detailDisplay">Original image</div>
      </div>
    </div>

    <div class="controls" id="controls">
      <div class="control" id="sceneControl">
        <div class="control-heading"><strong>Viewing Scene</strong><span class="value" id="sceneValue"></span></div>
        <input type="range" id="sceneSlider" min="0" max="4" step="1" value="0">
        <div class="scale"><span>City View</span><span>Night Driving</span><span>Meeting Room</span><span>Computer</span><span>Phone</span></div>
      </div>
    </div>

  </div>
</div>

<script>
/* ---------- CANVASES ---------- */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });
const W = canvas.width, H = canvas.height;

function makeCanvas(willRead) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  return [c, c.getContext("2d", willRead ? { willReadFrequently: true } : undefined)];
}
const [sourceCanvas, S] = makeCanvas(true);
const [maskCanvas, maskCtx] = makeCanvas(true);
const [blurCanvas, blurCtx] = makeCanvas();
const [ghostCanvas, ghostCtx] = makeCanvas();
const [lensSrcCanvas, lensSrcCtx] = makeCanvas(true);

let sourceImageData = null;
let maskData = null;
const lens = { cx: W / 2, cy: H / 2, rx: 390, ry: 230 };

function lensPath(c) {
  c.beginPath();
  c.ellipse(lens.cx, lens.cy, lens.rx, lens.ry, 0, 0, Math.PI * 2);
  c.closePath();
}

/* ---------- AGE <-> ACCOMMODATION (estimate) ---------- */
const AGE_TABLE = [[0.25, 65], [0.5, 60], [1, 56], [2, 50], [3, 45], [4, 40], [5, 34]];  // [diopters, age]
function ageLabel(acc) {
  if (acc <= AGE_TABLE[0][0]) return "65+ yrs";
  if (acc >= AGE_TABLE[AGE_TABLE.length - 1][0]) return "34 yrs & below";
  for (let i = 1; i < AGE_TABLE.length; i++) {
    const [a0, y0] = AGE_TABLE[i - 1], [a1, y1] = AGE_TABLE[i];
    if (acc <= a1) return "~" + Math.round(y0 + (acc - a0) / (a1 - a0) * (y1 - y0)) + " yrs";
  }
}

/* ---------- CONTROLS (generated, in this order: left, right, left, right...) ---------- */
const controlDefs = [
  { id: "power", label: "Far Lens Power", min: -10, max: 10, step: 0.25, v: 0,
    f: v => (v > 0 ? "+" : "") + v.toFixed(2) + " D", s: ["-10.00 D Myopia", "0.00 D", "+10.00 D Hyperopia"] },
  { id: "accommodation", label: "Accommodation (Age)", min: 0.25, max: 5, step: 0.25, v: 3,
    f: v => "+" + v.toFixed(2) + " D · " + ageLabel(v), s: ["65+ yrs", "34 yrs & below"] },
  { id: "cylinder", label: "Cylinder", min: 0, max: 4, step: 0.25, v: 0,
    f: v => v.toFixed(2), s: ["0", "4.00"] },
  { id: "axis", label: "Axis", min: 0, max: 180, step: 1, v: 0,
    f: v => v.toFixed(0) + "°", s: ["0°", "90°", "180°"] },
  { id: "lensPosition", label: "Lens Position", min: 0, max: 100, step: 1, v: 50,
    f: v => v + "%", s: ["Left", "Centre", "Right"], pos: true },
  { id: "lensVerticalPosition", label: "Vertical Lens Position", min: 0, max: 100, step: 1, v: 50,
    f: v => v + "%", s: ["Top", "Centre", "Bottom"], pos: true },
  { id: "cylCorrection", label: "Cylinder & Axis Correction", min: 0, max: 100, step: 1, v: 0,
    f: v => v + "%", s: ["No Correction", "Half", "Full Correction"] },
  { id: "farCorrection", label: "Far Spectacle Correction", min: 0, max: 100, step: 1, v: 0,
    f: v => v + "%", s: ["No Correction", "Half", "Full Correction"] },
  { id: "intermediateAdd", label: "Intermediate ADD (computer + phone)", min: 0, max: 3, step: 0.25, v: 0,
    f: v => "+" + v.toFixed(2) + " D", s: ["0.00 D", "+1.50 D", "+3.00 D"] },
  { id: "addCorrection", label: "Intermediate ADD Correction", min: 0, max: 100, step: 1, v: 0,
    f: v => v + "%", s: ["No ADD", "Half", "Full ADD"] },
  { id: "nearAdd", label: "Near ADD (phone only)", min: 0, max: 3, step: 0.25, v: 0,
    f: v => "+" + v.toFixed(2) + " D", s: ["0.00 D", "+1.50 D", "+3.00 D"] },
  { id: "nearCorrection", label: "Near ADD Correction", min: 0, max: 100, step: 1, v: 0,
    f: v => v + "%", s: ["No ADD", "Half", "Full ADD"] },
  { id: "aspheric", label: "Aspherical Design", min: 0, max: 80, step: 40, v: 0,
    f: v => v.toFixed(0) + "%", s: ["Normal", "Semi-Custom", "Fully Custom"] }
];

const el = {};
const controlsBox = document.getElementById("controls");

controlDefs.forEach(d => {
  if (!d.pos) {
    const div = document.createElement("div");
    div.className = "control";
    div.innerHTML =
      `<div class="control-heading"><strong>${d.label}</strong>
         <div class="control-right"><span class="value" id="${d.id}Value"></span>
         <button class="reset-button" id="${d.id}Reset">Reset</button></div></div>
       <input type="range" id="${d.id}" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.v}">
       <div class="scale">${d.s.map(t => `<span>${t}</span>`).join("")}</div>`;
    controlsBox.appendChild(div);
  }
  const slider = document.getElementById(d.id);
  el[d.id] = slider;
  const update = d.pos ? updateLensPosition : render;
  slider.addEventListener("input", update);
  document.getElementById(d.id + "Reset").addEventListener("click", () => {
    slider.value = d.v;
    update();
  });
});

// Move the Viewing Scene slider into the grid, after Aspherical Design
controlsBox.appendChild(document.getElementById("sceneControl"));

const effectDisplay = document.getElementById("effectDisplay");
const detailDisplay = document.getElementById("detailDisplay");
const SCENES = [["city", "City View"], ["night", "Driving at Night"], ["meeting", "Meeting Room"],
                ["computer", "Working at Computer"], ["phone", "Looking at Phone"]];
const sceneSlider = document.getElementById("sceneSlider");
const sceneValue = document.getElementById("sceneValue");
const sceneSelect = { get value() { return SCENES[Number(sceneSlider.value)][0]; } };

/* ---------- DRAWING HELPERS ---------- */
const R = (c, x, y, w, h) => { S.fillStyle = c; S.fillRect(x, y, w, h); };
const C = (c, x, y, r) => { S.fillStyle = c; S.beginPath(); S.arc(x, y, r, 0, Math.PI * 2); S.fill(); };
const POLY = (c, pts) => {
  S.fillStyle = c; S.beginPath(); S.moveTo(...pts[0]);
  pts.slice(1).forEach(p => S.lineTo(...p));
  S.closePath(); S.fill();
};
const TXT = (c, font, t, x, y) => { S.fillStyle = c; S.font = font; S.fillText(t, x, y); };
const RR = (c, x, y, w, h, r) => { S.fillStyle = c; S.beginPath(); S.roundRect(x, y, w, h, r); S.fill(); };

/* ---------- SCENE 1: CITY ---------- */
function drawCityScene() {
  const sky = S.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#A8D0E5");
  sky.addColorStop(0.55, "#D9E6E8");
  sky.addColorStop(1, "#B7C4B8");
  S.fillStyle = sky; S.fillRect(0, 0, W, H);

  const cloud = (x, y, s) => {
    S.fillStyle = "rgba(255,255,255,0.65)";
    S.beginPath();
    S.arc(x, y, 35 * s, 0, 7);
    S.arc(x + 35 * s, y - 15 * s, 40 * s, 0, 7);
    S.arc(x + 75 * s, y, 32 * s, 0, 7);
    S.fill();
  };
  cloud(150, 120, 1); cloud(650, 100, 0.8); cloud(900, 180, 1.1);

  [[30, 300, 130, 180], [180, 260, 110, 220], [340, 210, 165, 470],
   [520, 130, 165, 510], [720, 270, 140, 210], [900, 300, 300, 180]].forEach(b => {
    R("#84969A", b[0], b[1], b[2], b[3]);
    for (let x = b[0] + 15; x < b[0] + b[2] - 10; x += 30)
      for (let y = b[1] + 20; y < b[1] + b[3] - 10; y += 35)
        R("#D5D8D2", x, y, 12, 15);
  });

  const tree = (x, y, s) => {
    R("#665B45", x - 8 * s, y, 16 * s, 100 * s);
    C("#426C50", x, y, 55 * s);
    C("#57835C", x - 10 * s, y - 20 * s, 35 * s);
  };
  tree(100, 370, 1.1); tree(250, 380, 0.9); tree(850, 380, 1.0); tree(1050, 350, 1.2);

  R("#89947D", 0, 470, W, H - 470);
  POLY("#555B5B", [[280, 470], [820, 470], [1100, 700], [0, 700]]);

  S.strokeStyle = "#F5F1E8"; S.lineWidth = 7; S.setLineDash([35, 35]);
  S.beginPath(); S.moveTo(550, 490); S.lineTo(550, 700); S.stroke();
  S.setLineDash([]);

  const car = (x, y, s, color) => {
    R(color, x, y, 100 * s, 35 * s);
    POLY("#343D40", [[x + 20 * s, y], [x + 35 * s, y - 25 * s], [x + 75 * s, y - 25 * s], [x + 90 * s, y]]);
    C("#222", x + 22 * s, y + 35 * s, 10 * s);
    C("#222", x + 78 * s, y + 35 * s, 10 * s);
  };
  car(420, 550, 1.0, "#B94A3A"); car(680, 610, 0.65, "#E3E0D4"); car(580, 510, 0.65, "#E3E0D4");
}

/* ---------- SCENE 2: COMPUTER ---------- */
function drawComputerScene() {
  R("#D8D0C2", 0, 0, W, H);
  R("#E9E3D8", 0, 0, W, 490);

  R("#A9C7D0", 70, 60, 360, 300);
  R("#F5F1E8", 235, 60, 12, 300);
  R("#F5F1E8", 70, 205, 360, 12);
  R("#6D927D", 70, 270, 360, 90);

  R("#916D50", 0, 570, W, 230);

  R("#303B3B", 300, 130, 600, 350);
  R("#A8C6C0", 320, 150, 560, 305);

  // Screen 1: dashboard
  R("#FFFDF7", 350, 180, 230, 240);
  R("#3A6656", 350, 180, 230, 42);
  TXT("#FFFDF7", "bold 13px Arial", "DASHBOARD", 367, 206);
  C("#B9C8BE", 380, 255, 18);
  R("#3A6656", 410, 245, 115, 9);
  R("#B9C8BE", 410, 261, 80, 6);
  R("#E4EBE5", 370, 290, 85, 48);
  R("#E4EBE5", 470, 290, 85, 48);
  R("#3A6656", 380, 302, 45, 7);
  R("#3A6656", 480, 302, 45, 7);
  R("#B9C8BE", 380, 318, 60, 6);
  R("#B9C8BE", 480, 318, 60, 6);
  for (let i = 0; i < 3; i++) R("#B9C8BE", 370, 355 + i * 18, 170 - i * 15, 7);

  // Screen 2: activity
  R("#FFFDF7", 610, 180, 230, 240);
  R("#3A6656", 610, 180, 230, 42);
  TXT("#FFFDF7", "bold 13px Arial", "ACTIVITY", 627, 206);
  TXT("#3A6656", "bold 11px Arial", "WEEKLY PERFORMANCE", 630, 248);
  R("#E4EBE5", 630, 260, 190, 85);
  for (let i = 0; i < 3; i++) R("#D0DBD2", 640, 278 + i * 24, 170, 1);
  const bars = [25, 42, 32, 60, 48, 70, 55];
  bars.forEach((b, i) => R("#527A64", 647 + i * 23, 338 - b, 12, b));
  ["M", "T", "W", "T", "F", "S", "S"].forEach((d, i) => TXT("#7C8E82", "8px Arial", d, 649 + i * 23, 357));
  TXT("#3A6656", "bold 10px Arial", "TOTAL ACTIVITY", 630, 380);
  TXT("#527A64", "bold 17px Arial", "86%", 630, 401);
  R("#E4EBE5", 685, 389, 125, 8);
  R("#527A64", 685, 389, 107, 8);

  // Stand, keyboard, mouse
  R("#343D40", 560, 480, 80, 90);
  R("#343D40", 510, 560, 180, 15);
  R("#343D40", 350, 585, 330, 75);
  for (let x = 365; x < 660; x += 25)
    for (let y = 595; y < 650; y += 15) R("#AAB1A9", x, y, 15, 7);
  S.fillStyle = "#E7E4DC"; S.beginPath(); S.ellipse(770, 610, 30, 42, 0, 0, Math.PI * 2); S.fill();
}

/* ---------- SCENE 3: PHONE ---------- */
function drawPhoneScene() {
  R("#C4B9A7", 0, 0, W, H);

  // Lap
  S.fillStyle = "#354E49"; S.beginPath();
  S.moveTo(0, 800); S.lineTo(100, 490);
  S.quadraticCurveTo(350, 420, 600, 450);
  S.quadraticCurveTo(850, 420, 1100, 490);
  S.lineTo(1200, 800); S.closePath(); S.fill();

  // Forearms
  POLY("#D6A17E", [[0, 800], [0, 640], [300, 350], [480, 360], [510, 510], [340, 620], [250, 800]]);
  POLY("#D9A582", [[1200, 800], [1200, 640], [900, 350], [720, 360], [690, 510], [860, 620], [950, 800]]);

  // Phone
  S.save();
  S.translate(600, 355); S.rotate(-0.06);
  RR("#252B2C", -190, -275, 380, 550, 32);
  RR("#F7F5EF", -174, -259, 348, 518, 23);
  R("#3A6656", -174, -220, 348, 85);
  TXT("#FFFDF7", "bold 20px Arial", "MY DASHBOARD", -145, -170);
  RR("#E4EBE5", -145, -110, 290, 100, 12);
  R("#3A6656", -120, -85, 130, 11);
  R("#B9C8BE", -120, -60, 220, 8);
  R("#B9C8BE", -120, -40, 160, 8);
  for (let i = 0; i < 3; i++) {
    RR("#E4EBE5", -145, 15 + i * 85, 290, 68, 10);
    R("#527A64", -120, 35 + i * 85, 130, 9);
    R("#B9C8BE", -120, 55 + i * 85, 200, 6);
  }
  R("#DCE5DD", -174, 220, 348, 39);
  for (let i = 0; i < 4; i++) C("#3A6656", -105 + i * 70, 239, 9);
  RR("#252B2C", -35, -269, 70, 6, 4);
  S.restore();

  // Hands: side = 1 (left) or -1 (right, mirrored about x = 600)
  const hand = (color, m) => {
    const X = x => m === 1 ? x : 1200 - x;
    S.fillStyle = color; S.beginPath();
    S.moveTo(X(300), 350);
    S.bezierCurveTo(X(260), 295, X(280), 220, X(345), 195);
    S.bezierCurveTo(X(405), 165, X(465), 205, X(480), 275);
    S.lineTo(X(490), 455);
    S.bezierCurveTo(X(450), 520, X(345), 475, X(300), 350);
    S.fill();

    S.strokeStyle = color; S.lineCap = "round"; S.lineWidth = 42;
    [[330, 255, 275, 225, 280, 290], [305, 320, 255, 305, 275, 365], [315, 390, 270, 390, 295, 435]]
      .forEach(f => {
        S.beginPath(); S.moveTo(X(f[0]), f[1]);
        S.quadraticCurveTo(X(f[2]), f[3], X(f[4]), f[5]); S.stroke();
      });

    S.lineWidth = 48;
    S.beginPath(); S.moveTo(X(420), 440);
    S.bezierCurveTo(X(445), 405, X(475), 400, X(510), 420); S.stroke();
  };
  hand("#D6A17E", 1);
  hand("#D9A582", -1);

  // Sleeves
  POLY("#3A6656", [[0, 800], [0, 650], [250, 540], [350, 625], [260, 800]]);
  POLY("#3A6656", [[1200, 800], [1200, 650], [950, 540], [850, 625], [940, 800]]);
}

/* ---------- SCENE 4: DRIVING AT NIGHT ---------- */
function glow(x, y, r, rgb, a) {
  const g = S.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  S.fillStyle = g; S.fillRect(x - r, y - r, r * 2, r * 2);
}

function drawNightScene() {
  const sky = S.createLinearGradient(0, 0, 0, 360);
  sky.addColorStop(0, "#05070F"); sky.addColorStop(1, "#1B2238");
  S.fillStyle = sky; S.fillRect(0, 0, W, 360);
  R("#0B0E14", 0, 360, W, H - 360);

  // Buildings with lit windows
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  [[0, 250, 150], [130, 200, 120], [250, 290, 110], [350, 230, 100], [440, 310, 90],
   [700, 300, 100], [790, 240, 130], [910, 190, 110], [1010, 270, 120], [1120, 220, 100]].forEach(([x, top, w]) => {
    R("#141A28", x, top, w, 370 - top);
    for (let wx = x + 10; wx < x + w - 14; wx += 22)
      for (let wy = top + 12; wy < 350; wy += 26)
        if (rnd() > 0.55) R(rnd() > 0.5 ? "#F3D98B" : "#9CC7E8", wx, wy, 10, 14);
  });

  // Road + edge lines + centre dashes (perspective)
  POLY("#1A1D24", [[570, 360], [630, 360], [1150, 800], [50, 800]]);
  S.strokeStyle = "#8A8F9A"; S.lineWidth = 3;
  S.beginPath(); S.moveTo(570, 360); S.lineTo(50, 800); S.moveTo(630, 360); S.lineTo(1150, 800); S.stroke();
  for (let i = 0; i < 8; i++) {
    const t0 = i / 8, t1 = (i + 0.5) / 8;
    const y0 = 360 + 440 * t0 * t0, y1 = 360 + 440 * t1 * t1;
    const w0 = 1 + 9 * t0 * t0, w1 = 1 + 9 * t1 * t1;
    POLY("#E8D27A", [[600 - w0, y0], [600 + w0, y0], [600 + w1, y1], [600 - w1, y1]]);
  }

  // Street lights (soft warm glow)
  [0.04, 0.14, 0.3, 0.55].forEach(u => {
    const y = 360 + 440 * u;
    [-1, 1].forEach(sd => {
      const ex = 600 + sd * (55 + 545 * u), top = y - (30 + 220 * u), lx = ex - sd * (10 + 30 * u);
      R("#222", ex - 1 - 2 * u, top, 2 + 4 * u, y - top);
      S.globalCompositeOperation = "lighter";
      glow(lx, top, 30 + 90 * u, "255,200,110", 0.45);
      S.globalCompositeOperation = "source-over";
      C("#FFE9B0", lx, top, 2 + 5 * u);
    });
  });

  // Cars: oncoming (right lane, front view) and ahead (left lane, rear view)
  const lane = (u, side) => 600 + side * (30 + 520 * u) / 2;
  const oval = (c, x, y, rx, ry) => { S.fillStyle = c; S.beginPath(); S.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); S.fill(); };

  [[0.06, 1, true, "#2A3040"], [0.1, -1, false, "#4A2024"], [0.22, 1, true, "#3A2F44"],
   [0.32, -1, false, "#28344A"], [0.5, 1, true, "#22303A"]].forEach(([u, side, oncoming, color]) => {
    const yB = 360 + 440 * u, cx = lane(u, side), cw = 14 + 230 * u, ch = cw * 0.55;

    RR("#06070B", cx - cw * 0.5, yB - ch * 0.08, cw, ch * 0.1, 2);                   // shadow under car
    RR(color, cx - cw * 0.5, yB - ch * 0.62, cw, ch * 0.55, cw * 0.08);              // body
    POLY(oncoming ? "#3B4660" : "#1E2330",                                            // windscreen / rear window
         [[cx - cw * 0.38, yB - ch * 0.62], [cx - cw * 0.28, yB - ch], [cx + cw * 0.28, yB - ch], [cx + cw * 0.38, yB - ch * 0.62]]);
    R("#050608", cx - cw * 0.46, yB - ch * 0.12, cw * 0.14, ch * 0.14);              // wheels
    R("#050608", cx + cw * 0.32, yB - ch * 0.12, cw * 0.14, ch * 0.14);

    if (oncoming) R("#11141B", cx - cw * 0.12, yB - ch * 0.36, cw * 0.24, ch * 0.1);  // grille
    else R("#D9D6CC", cx - cw * 0.1, yB - ch * 0.3, cw * 0.2, ch * 0.08);             // number plate

    [-1, 1].forEach(sd => {
      const lx = cx + sd * cw * 0.32, ly = yB - ch * 0.4;
      S.globalCompositeOperation = "lighter";
      if (oncoming) {
        glow(lx, ly, cw * 0.55, "255,235,190", 0.4);
        glow(lx, yB + ch * 0.15, cw * 0.35, "255,235,190", 0.15);                      // road reflection
      } else {
        glow(lx, ly, cw * 0.5, "255,40,30", 0.45);
        glow(lx, yB + ch * 0.15, cw * 0.3, "255,40,30", 0.15);
      }
      S.globalCompositeOperation = "source-over";
      oval(oncoming ? "#FFF1C9" : "#FF4036", lx, ly, cw * 0.09, cw * 0.045);
    });
  });

  // Dashboard + steering wheel
  R("#0A0A0C", 0, 745, W, 55);
  S.strokeStyle = "#15161A"; S.lineWidth = 26;
  S.beginPath(); S.ellipse(600, 900, 340, 170, 0, Math.PI, 2 * Math.PI); S.stroke();
}

/* ---------- SCENE 5: MEETING ROOM ---------- */
function drawMeetingScene() {
  R("#E6E0D3", 0, 0, W, H);
  R("#CFC6B6", 0, 430, W, H - 430);

  // Window
  R("#A9C7D0", 40, 90, 200, 230);
  R("#F5F1E8", 135, 90, 10, 230);

  // Projector screen
  R("#2B3330", 370, 60, 460, 260);
  R("#FFFDF7", 385, 75, 430, 230);
  R("#3A6656", 385, 75, 430, 50);
  TXT("#FFFDF7", "bold 22px Arial", "QUARTERLY REVIEW", 410, 108);
  R("#E4EBE5", 405, 145, 220, 140);
  [40, 70, 55, 95, 80].forEach((b, i) => R("#527A64", 425 + i * 38, 270 - b, 24, b));
  R("#3A6656", 650, 150, 140, 12);
  for (let i = 0; i < 5; i++) R("#B9C8BE", 650, 178 + i * 22, 140 - (i % 3) * 25, 8);

  // Ceiling projector + beam
  R("#343D40", 555, 8, 90, 30);
  C("#1A1F20", 600, 30, 9);
  POLY("rgba(255,255,225,0.10)", [[594, 38], [606, 38], [830, 305], [370, 305]]);

  // People across the table
  const person = (x, y, s, shirt, skin, hair) => {

  };
  person(240, 330, 1.0, "#527A64", "#D6A17E", "#2A211C");
  person(480, 320, 1.05, "#B94A3A", "#E0B08E", "#1D1A18");
  person(720, 320, 1.05, "#354E49", "#C98F6B", "#3B2B22");
  person(960, 330, 1.0, "#C9B36A", "#D9A582", "#5A3B24");

  // Table + items
  POLY("#916D50", [[100, 480], [1100, 480], [1200, 800], [0, 800]]);
  R("#A57F60", 100, 480, 1000, 8);
  [[220, 520], [470, 515], [700, 515], [950, 520]].forEach(([x, y]) => {
    R("#343D40", x - 55, y, 110, 14);
    POLY("#4A5659", [[x - 45, y], [x + 45, y], [x + 38, y - 55], [x - 38, y - 55]]);
  });
  C("#F5F1E8", 360, 535, 14); C("#F5F1E8", 840, 538, 14);
  R("#FFFDF7", 560, 560, 90, 55);

  // People seen from behind (near side)
  RR("#3A6656", -30, 640, 260, 200, 80); C("#2A211C", 100, 635, 52);
  RR("#527A64", 980, 650, 260, 200, 80); C("#3B2B22", 1100, 630, 52);

function drawScene() {
  S.clearRect(0, 0, W, H);
  const scene = sceneSelect.value;
  if (scene === "city") drawCityScene();
  else if (scene === "night") drawNightScene();
  else if (scene === "meeting") drawMeetingScene();
  else if (scene === "computer") drawComputerScene();
  else drawPhoneScene();
  sourceImageData = S.getImageData(0, 0, W, H);
}

/* ---------- LENS MASK ---------- */
function createLensMask() {
  maskCtx.clearRect(0, 0, W, H);
  maskCtx.fillStyle = "#FFFFFF";
  lensPath(maskCtx);
  maskCtx.fill();
  return maskCtx.getImageData(0, 0, W, H).data;
}

/* ---------- DEFOCUS MODEL ---------- */
function getSceneDemand() {
  const scene = sceneSelect.value;
  if (scene === "computer") return -1.75;
  if (scene === "meeting") return -0.75;
  if (scene === "phone") return -2.5;
  if (scene === "night") return 0.0;
  return 0.0;
}

function getResidualDefocus(power, accommodation, demand) {
  const high = power;
  const low = power - accommodation;
  if (demand <= high && demand >= low) return 0;
  if (demand > high) return demand - high;
  return low - demand;
}

/* ---------- BLUR (works on Safari / iPad, which ignores ctx.filter) ---------- */
const nativeBlur = (() => {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 9;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.filter = "blur(2px)";
    x.fillStyle = "#fff";
    x.fillRect(4, 4, 1, 1);
    return x.getImageData(2, 4, 1, 1).data[3] > 0;   // blurred pixel spread = filter works
  } catch (e) { return false; }
})();

const tmpCanvases = [];
function tmpCanvas(i, w, h) {
  let c = tmpCanvases[i];
  if (!c) c = tmpCanvases[i] = document.createElement("canvas");
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const x = c.getContext("2d");
  x.imageSmoothingEnabled = true;
  x.imageSmoothingQuality = "high";
  x.clearRect(0, 0, w, h);
  return c;
}

function blurInto(dst, src, r) {
  dst.clearRect(0, 0, W, H);
  if (r <= 0) { dst.drawImage(src, 0, 0); return; }

  if (nativeBlur) {
    dst.filter = `blur(${r}px)`;
    dst.drawImage(src, 0, 0);
    dst.filter = "none";
    return;
  }

  // Fallback: shrink in halving steps, then enlarge back (smooth bilinear blur)
  const k = Math.max(1.5, r * 1.4);
  const chain = [];
  let cur = src, f = 1;
  while (f < k) {
    f = Math.min(f * 2, k);
    const c = tmpCanvas(chain.length, Math.max(1, Math.round(W / f)), Math.max(1, Math.round(H / f)));
    c.getContext("2d").drawImage(cur, 0, 0, c.width, c.height);
    chain.push(c);
    cur = c;
  }
  for (let i = chain.length - 1; i >= 0; i--) {
    if (i === 0) { dst.drawImage(chain[0], 0, 0, W, H); }
    else {
      const t = chain[i - 1];
      const x = t.getContext("2d");
      x.clearRect(0, 0, t.width, t.height);
      x.drawImage(chain[i], 0, 0, t.width, t.height);
    }
  }
}

/* ---------- VISION EFFECTS (blur + cylinder ghosting) ---------- */
function applyVisionEffects(target, blurAmount, cylinder, axis) {
  // 1. Spherical blur
  blurInto(blurCtx, sourceCanvas, blurAmount);

  // 2. Cylinder doubling: two copies move apart symmetrically.
  //    At zero cylinder both sit on top of each other (one image).
  ghostCtx.clearRect(0, 0, W, H);

  const separation = cylinder * 16;                       // total gap between the two images
  const secondWeight = Math.min(.5, cylinder * 0.75);    // opacity of the second image (0.5 = equal to the first)
  const angle = (axis + 90) * Math.PI / 180;
  const ox = Math.cos(angle) * separation / 2;
  const oy = Math.sin(angle) * separation / 2;

  ghostCtx.globalAlpha = 1;
  ghostCtx.drawImage(blurCanvas, -ox, -oy);               // image 1
  ghostCtx.globalAlpha = secondWeight;
  ghostCtx.drawImage(blurCanvas, ox, oy);                 // image 2
  ghostCtx.globalAlpha = 1;

  target.clearRect(0, 0, W, H);
  target.drawImage(ghostCanvas, 0, 0);
}

/* ---------- RENDER ---------- */
let renderPending = false;

function render() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(doRender);
}

function doRender() {
  renderPending = false;

  const val = id => Number(el[id].value);
  const power = val("power");
  const aspheric = val("aspheric");
  const cylinder = val("cylinder");
  const axis = val("axis");
  const accommodation = val("accommodation");
  const intAdd = val("intermediateAdd");
  const nearAdd = val("nearAdd");
  const farCorr = val("farCorrection") / 100;     // affects the far lens power only
  const cylCorr = val("cylCorrection") / 100;     // affects cylinder + axis only
  const addCorr = val("addCorrection") / 100;     // affects the intermediate ADD only
  const nearCorr = val("nearCorrection") / 100;   // affects the near ADD only

  controlDefs.forEach(d => {
    document.getElementById(d.id + "Value").textContent = d.f(Number(el[d.id].value));
  });

  /* Original (uncorrected) vision: always full power + full cylinder */
  const demand = getSceneDemand();
  const uncorrectedDefocus = getResidualDefocus(power, accommodation, demand);
  applyVisionEffects(ctx, Math.min(30, uncorrectedDefocus * 5), cylinder, axis);

  /* Through the lens */
  const scene = sceneSelect.value;
  // City / night driving = no ADD; computer + meeting room = intermediate ADD; phone = intermediate + near ADD
  const intPart = intAdd * addCorr;
  const nearPart = nearAdd * nearCorr;
  const lensAdd = (scene === "computer" || scene === "meeting") ? intPart : scene === "phone" ? intPart + nearPart : 0;
  // Lacking accommodation (after far correction), reduced by the ADD
  const lackingAccommodation = getResidualDefocus(power * (1 - farCorr), accommodation, demand);
  const lensDefocus = Math.max(0, lackingAccommodation - lensAdd);
  const lensCylinder = cylinder * (1 - cylCorr);

  if (farCorr === 0 && cylCorr === 0 && lensAdd === 0) {
    effectDisplay.textContent = "No spectacle correction";
    detailDisplay.textContent =
      "Original vision | " + uncorrectedDefocus.toFixed(2) + " D defocus | " +
      cylinder.toFixed(2) + " D cylinder, axis " + axis.toFixed(0) + "°";
    return;
  }

  /* Lens distortion parameters */
  const effectivePower = power * farCorr;
  const effectiveAspheric = aspheric * farCorr;
  const effectiveCylinder = cylinder * cylCorr;
  const magFactor = 1 + effectivePower / 25;
  const radialStrength = effectivePower * 0.085 * (1 - effectiveAspheric / 100);
  /* ADD distortion: separate plus-lens (hyperopic) distortion layered on top of the lens power.
     ADD_STRENGTH scales how obvious it is (1 = same as a plus lens of that power). */
  const ADD_STRENGTH = 1;
  const addMag = 1 + (lensAdd * ADD_STRENGTH) / 25;
  const addRadial = lensAdd * ADD_STRENGTH * 0.085 * (1 - aspheric / 100);
  const cylMag = 1 + effectiveCylinder / 40;           // stretch along power meridian
  const mAngle = (axis + 90) * Math.PI / 180;
  const mCos = Math.cos(mAngle), mSin = Math.sin(mAngle);

  /* Description */
  const effects = [], details = [];
  if (effectivePower > 0) {
    effects.push("Hyperopic Lens");
    details.push("+" + effectivePower.toFixed(2) + " D", "Pincushion distortion");
  } else if (effectivePower < 0) {
    effects.push("Myopic Lens");
    details.push(effectivePower.toFixed(2) + " D", "Barrel distortion");
  }
  if (effectiveAspheric > 0) details.push("Aspherical reduction: " + effectiveAspheric.toFixed(0) + "%");
  if (effectiveCylinder > 0) {
    effects.push("Cylinder Distortion");
    details.push("Cylinder " + effectiveCylinder.toFixed(2) + " D, axis " + axis.toFixed(0) + "°",
                 "Meridional stretch: " + ((cylMag - 1) * 100).toFixed(1) + "%");
  }
  if (lensAdd > 0) {
    effects.push("ADD Hyperopic Distortion");
    details.push("ADD in use: +" + lensAdd.toFixed(2) + " D", "Pincushion from ADD");
  }
  details.push("Original vision: " + uncorrectedDefocus.toFixed(2) + " D defocus, " + cylinder.toFixed(2) + " D cyl");
  details.push("Through lens: " + lensDefocus.toFixed(2) + " D defocus, " + lensCylinder.toFixed(2) + " D cyl");
  details.push("Far " + el.farCorrection.value + "% | Cyl " + el.cylCorrection.value + "% | Int ADD " + el.addCorrection.value + "% | Near ADD " + el.nearCorrection.value + "%");
  effectDisplay.textContent = effects.length ? effects.join(" + ") : "No lens distortion";
  detailDisplay.textContent = details.join(" | ");

  /* Lens source = scene with only the residual blur/ghosting */
  applyVisionEffects(lensSrcCtx, Math.min(30, lensDefocus * 5), lensCylinder, axis);
  const lensData = lensSrcCtx.getImageData(0, 0, W, H).data;
  const backgroundData = ctx.getImageData(0, 0, W, H).data;

  const { cx, cy, rx, ry } = lens;
  const xStart = Math.max(0, Math.floor(cx - rx));
  const xEnd = Math.min(W, Math.ceil(cx + rx));
  const yStart = Math.max(0, Math.floor(cy - ry));
  const yEnd = Math.min(H, Math.ceil(cy + ry));
  const rw = xEnd - xStart, rh = yEnd - yStart;

  const output = ctx.createImageData(rw, rh);
  const out = output.data;

  function sample(px, py, o) {
    const sx = Math.max(0, Math.min(W - 1, px));
    const sy = Math.max(0, Math.min(H - 1, py));
    const x0 = Math.floor(sx), y0 = Math.floor(sy);
    const x1 = Math.min(W - 1, x0 + 1), y1 = Math.min(H - 1, y0 + 1);
    const fx = sx - x0, fy = sy - y0;
    const p00 = (y0 * W + x0) * 4, p10 = (y0 * W + x1) * 4;
    const p01 = (y1 * W + x0) * 4, p11 = (y1 * W + x1) * 4;
    for (let c = 0; c < 3; c++) {
      const top = lensData[p00 + c] * (1 - fx) + lensData[p10 + c] * fx;
      const bot = lensData[p01 + c] * (1 - fx) + lensData[p11 + c] * fx;
      out[o + c] = top * (1 - fy) + bot * fy;
    }
    out[o + 3] = 255;
  }

  for (let y = yStart; y < yEnd; y++) {
    for (let x = xStart; x < xEnd; x++) {
      const i = (y * W + x) * 4;
      const o = ((y - yStart) * rw + (x - xStart)) * 4;

      out[o] = backgroundData[i];
      out[o + 1] = backgroundData[i + 1];
      out[o + 2] = backgroundData[i + 2];
      out[o + 3] = backgroundData[i + 3];

      if (maskData[i] === 0) continue;

      const dx = (x - cx) / rx;
      const dy = (y - cy) / ry;

      // 1) ADD: plus-lens magnification + pincushion (always hyperopic)
      const ra = 1 + addRadial * (dx * dx + dy * dy);
      const ax = dx / addMag / ra;
      const ay = dy / addMag / ra;

      // 2) Lens power: magnification + radial distortion
      const rp = 1 + radialStrength * (ax * ax + ay * ay);
      let bx = (ax / magFactor / rp) * rx;
      let by = (ay / magFactor / rp) * ry;

      // Cylinder: stretch the image along the power meridian
      const along = (bx * mCos + by * mSin) / cylMag;
      const perp = -bx * mSin + by * mCos;
      bx = along * mCos - perp * mSin;
      by = along * mSin + perp * mCos;

      sample(cx + bx, cy + by, o);
    }
  }

  ctx.putImageData(output, xStart, yStart);

  lensPath(ctx);
  ctx.strokeStyle = "#3A6656"; ctx.lineWidth = 5; ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.8)"; ctx.lineWidth = 1.5; ctx.stroke();
}

/* ---------- LENS POSITION ---------- */
function updateLensPosition() {
  const h = Number(el.lensPosition.value);
  const v = Number(el.lensVerticalPosition.value);
  lens.cx = lens.rx + (h / 100) * (W - 2 * lens.rx);
  lens.cy = lens.ry + (v / 100) * (H - 2 * lens.ry);
  maskData = createLensMask();
  render();
}

/* ---------- EVENTS + INIT ---------- */
sceneSlider.addEventListener("input", () => {
  sceneValue.textContent = SCENES[Number(sceneSlider.value)][1];
  drawScene();
  render();
});

sceneValue.textContent = SCENES[Number(sceneSlider.value)][1];
drawScene();
updateLensPosition();
</script>
